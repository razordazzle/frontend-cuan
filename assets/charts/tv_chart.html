<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #chart-container,
        #chart,
        #fib-canvas {
            touch-action: none;
        }

        #chart {
            width: 100vw;
            height: 100vh;
        }

        #chart a {
            display: none !important;
            pointer-events: none !important;
        }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>

<body>
    <div id="chart-container" style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">
        <div id="chart" style="width: 100%; height: 100%;"></div>
        <canvas id="fib-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></canvas>
    </div>
    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error("TV_CHART_JS_ERROR: " + msg + " at " + lineNo + ":" + columnNo + (error ? " " + error.stack : ""));
            return false;
        };
        window.onunhandledrejection = function(event) {
            console.error("TV_CHART_JS_REJECTION: " + event.reason);
        };

        let chart = null;
        let candleSeries = null;
        let areaSeries = null;
        let volumeSeries = null;
        let smaSeries = null;
        let rsiSeries = null;
        let currentType = 'candle';
        let currentShowSma = false;
        let currentShowRsi = false;
        let currentShowVolume = false;
        let currentShowFib = false;
        let isDrawingFib = false;
        let isFibSelected = false; // true: Edit Mode (large handles, dashed line), false: Non-Edit Mode (subtle dots)
        let fibPoint1 = null; // { time, price }
        let fibPoint2 = null; // { time, price }
        let rawCandlesData = [];
        let currentRsiData = [];
        let currentVolumeData = [];
        let pendingData = null;

        let horizontalLines = []; // Array of prices: [7650, 7820]
        let isDrawingHorizontalLine = false;
        let selectedHorizontalLineIndex = -1; // -1: none, >= 0: index of horizontal line in edit mode
        let dragHorizontalLineIndex = -1;
        let crosshairPos = null;
        let currentCrosshairColor = 'rgba(255, 255, 255, 0.75)';

        let trendlines = []; // Array of { id, p1: { time, price }, p2: { time, price } }
        let isDrawingTrendline = false;
        let trendlineDrawState = 0; // 0: idle, 1: waiting for p1, 2: waiting for p2
        let tempTrendlineP1 = null;
        let tempTrendlineP2 = null;
        let selectedTrendlineIndex = -1; // -1: none, >= 0: trendline index in edit mode
        let dragTrendlineIndex = -1;
        let dragTrendlinePart = 0; // 0: none, 1: p1, 2: p2, 3: body
        let dragTrendlineStartPos = null;

        function notifyHorizontalLinesChanged() {
            if (window.flutter_inappwebview?.callHandler) {
                window.flutter_inappwebview.callHandler('onHorizontalLinesChanged', horizontalLines);
            }
            window.parent?.postMessage(JSON.stringify({ type: 'onHorizontalLinesChanged', payload: horizontalLines }), '*');
        }

        function notifyTrendlinesChanged() {
            if (window.flutter_inappwebview?.callHandler) {
                window.flutter_inappwebview.callHandler('onTrendlinesChanged', trendlines);
            }
            window.parent?.postMessage(JSON.stringify({ type: 'onTrendlinesChanged', payload: trendlines }), '*');
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        let fibDrawState = 0; // 0: idle, 1: waiting for anchor 1, 2: waiting for anchor 2
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;
        let dragMode = 0; // 0: none, 1: reposition anchor 1, 2: reposition anchor 2
        let isPointerDown = false;

        const FIB_LEVELS = [
            { level: -0.27, label: '-27.00%', color: '#26A69A', fill: 'transparent' },
            { level: 0.0,   label: '0.00%',   color: '#787B86', fill: 'rgba(120, 123, 134, 0.05)' },
            { level: 0.236, label: '23.60%',  color: '#F23645', fill: 'rgba(242, 54, 69, 0.06)' },
            { level: 0.382, label: '38.20%',  color: '#FF9800', fill: 'rgba(255, 152, 0, 0.06)' },
            { level: 0.5,   label: '50.00%',  color: '#4CAF50', fill: 'rgba(76, 175, 80, 0.06)' },
            { level: 0.618, label: '61.80%',  color: '#089981', fill: 'rgba(8, 153, 129, 0.08)' },
            { level: 0.786, label: '78.60%',  color: '#00BCD4', fill: 'rgba(0, 188, 212, 0.06)' },
            { level: 1.0,   label: '100.00%', color: '#787B86', fill: 'transparent' },
        ];

        function resizeFibCanvas() {
            const canvas = document.getElementById('fib-canvas');
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            const ctx = canvas.getContext('2d');
            ctx.resetTransform?.();
            ctx.scale(dpr, dpr);
            renderFib();
        }
        window.addEventListener('resize', resizeFibCanvas);

        function getTimeAtX(x) {
            if (!chart) return null;
            const t = chart.timeScale().coordinateToTime(x);
            if (t !== null && t !== undefined) {
                if (typeof t === 'number') return t;
                if (typeof t === 'object' && t.year) {
                    return Math.floor(Date.UTC(t.year, t.month - 1, t.day) / 1000);
                }
            }
            if (rawCandlesData && rawCandlesData.length > 0) {
                let closest = rawCandlesData[0];
                let minDist = Infinity;
                for (let i = 0; i < rawCandlesData.length; i++) {
                    const cx = chart.timeScale().timeToCoordinate(rawCandlesData[i].time);
                    if (cx !== null) {
                        const dist = Math.abs(cx - x);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = rawCandlesData[i];
                        }
                    }
                }
                return closest.time;
            }
            return null;
        }

        function getPriceAtY(y) {
            const series = candleSeries || areaSeries;
            if (!series) return null;
            if (chart && chart.panes && chart.panes().length > 1) {
                const pane0Height = chart.panes()[0]?.getHeight();
                if (pane0Height && y > pane0Height) return null;
            }
            return series.coordinateToPrice(y);
        }

        function getTrendlineActionPillPos(x1, y1, x2, y2, containerWidth, containerHeight) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            const maxW = containerWidth || 360;
            const maxH = containerHeight || 500;

            const dx = x2 - x1;
            const dy = y2 - y1;
            let len = Math.hypot(dx, dy);
            if (len < 1) len = 1;

            // Perpendicular unit normal vector (nx, ny)
            let nx = -dy / len;
            let ny = dx / len;

            // Standardize normal to point "upward" (negative Y) away from the line
            if (Math.abs(ny) < 0.05) {
                // For steep or purely vertical lines: offset horizontally into open space
                nx = (mx > maxW / 2) ? -1 : 1;
                ny = 0;
            } else if (ny > 0) {
                // Invert downwards-pointing normal so it points upwards away from line
                nx = -nx;
                ny = -ny;
            }

            const offsetDist = 38;
            let px = mx + (nx * offsetDist);
            let py = my + (ny * offsetDist);

            // If too close to the top boundary (< 42px), flip normal to opposite side of line
            if (py < 42) {
                px = mx - (nx * offsetDist);
                py = my - (ny * offsetDist);
            }
            // If flipped below chart bottom edge, push back up
            if (py > maxH - 35) {
                px = mx + (nx * offsetDist);
                py = my + (ny * offsetDist);
            }

            // Clamp coordinates safely within canvas bounds
            px = Math.max(35, Math.min(maxW - 35, px));
            py = Math.max(25, Math.min(maxH - 25, py));

            return { x: px, y: py, mx, my };
        }

        function initFibPointerEvents() {
            const canvas = document.getElementById('fib-canvas');
            const chartContainer = document.getElementById('chart-container');
            if (!canvas || !chartContainer) return;

            // Ergonomic Hitbox Constants (Generous sizes optimized for smartphone touchscreens)
            const HITBOX_FIB_ANCHOR = 38; // 38px radius (76px diameter touch target for mobile fingers/thumbs)
            const HITBOX_HLINE = 28;      // 28px vertical distance (56px tall touch target)
            const HITBOX_HLINE_DEL = 36;  // 36px touch zone at right edge for delete
            const HITBOX_TL_ANCHOR = 32;  // 32px radius for trendline anchors
            const HITBOX_TL_DEL = 28;     // 28px radius for trendline delete button
            const HITBOX_TL_BODY = 22;    // 22px distance for trendline body

            // Hover detection to allow grabbing existing anchor handles, trendlines, & horizontal lines on desktop
            function updateHoverState(e) {
                if (isDrawingHorizontalLine || isDrawingTrendline || isDrawingFib || fibDrawState !== 0 || trendlineDrawState !== 0 || isPointerDown || dragHorizontalLineIndex !== -1 || dragTrendlineIndex !== -1 || dragMode !== 0) {
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                    return;
                }

                const activeSeries = candleSeries || areaSeries;

                // 1. Check proximity to horizontal lines (vertical drag or delete button)
                if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                    for (let i = 0; i < horizontalLines.length; i++) {
                        const lineY = activeSeries.priceToCoordinate(horizontalLines[i]);
                        if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                            canvas.style.pointerEvents = 'auto';
                            if (i === selectedHorizontalLineIndex) {
                                if (x >= rect.width - HITBOX_HLINE_DEL) {
                                    canvas.style.cursor = 'pointer';
                                } else {
                                    canvas.style.cursor = 'ns-resize';
                                }
                            } else {
                                canvas.style.cursor = 'pointer';
                            }
                            return;
                        }
                    }
                }

                // 2. Check proximity to Trendlines (anchors, delete button, or body)
                if (trendlines && trendlines.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < trendlines.length; i++) {
                        const t = trendlines[i];
                        const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                        const y1 = activeSeries.priceToCoordinate(t.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                        const y2 = activeSeries.priceToCoordinate(t.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            if (i === selectedTrendlineIndex) {
                                const pillPos = getTrendlineActionPillPos(x1, y1, x2, y2, rect.width, rect.height);
                                if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_TL_DEL) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR || Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'grab';
                                    return;
                                }
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                            }
                        }
                    }
                }

                // 3. Check proximity to Fibonacci anchors
                if (currentShowFib && fibPoint1 && fibPoint2 && chart && activeSeries) {
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = activeSeries.priceToCoordinate(fibPoint1.price);
                    const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                    const y2 = activeSeries.priceToCoordinate(fibPoint2.price);

                    const near1 = x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR;
                    const near2 = x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR;

                    if (near1 || near2) {
                        canvas.style.pointerEvents = 'auto';
                        canvas.style.cursor = 'grab';
                        return;
                    }
                }

                // Default when not hovering directly over any drawing element
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }

            if (chartContainer) {
                chartContainer.addEventListener('pointermove', updateHoverState);

                // Mobile-first capture-phase touch interceptor:
                // Intercepts touches on drawing elements BEFORE LightweightCharts can handle them as pan/scroll!
                chartContainer.addEventListener('pointerdown', (e) => {
                    // If user is placing a brand new tool, let canvas handle placement
                    if (isDrawingHorizontalLine || isDrawingTrendline || isDrawingFib || fibDrawState !== 0 || trendlineDrawState !== 0) {
                        return;
                    }

                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    pointerDownPos = { x, y };
                    pointerDownTime = Date.now();

                    const activeSeries = candleSeries || areaSeries;
                    if (!activeSeries || !chart) return;

                    // 1. FIBONACCI RESIZE HIT TEST (Comfortable 76px touch zone)
                    if (currentShowFib && fibPoint1 && fibPoint2) {
                        const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                        const y1 = activeSeries.priceToCoordinate(fibPoint1.price);
                        const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                        const y2 = activeSeries.priceToCoordinate(fibPoint2.price);

                        const hit1 = x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR;
                        const hit2 = x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR;
                        const hitDiagonal = (x1 !== null && y1 !== null && x2 !== null && y2 !== null) && distToSegment(x, y, x1, y1, x2, y2) <= 24;

                        if (hit1 || hit2) {
                            e.stopPropagation();
                            e.stopImmediatePropagation();
                            e.preventDefault();

                            isFibSelected = true;
                            selectedTrendlineIndex = -1;
                            dragMode = hit1 ? 1 : 2;
                            isPointerDown = true;
                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                            chart.applyOptions({ handleScroll: false, handleScale: false });
                            renderFib();
                            return;
                        } else if (hitDiagonal) {
                            e.stopPropagation();
                            e.stopImmediatePropagation();
                            e.preventDefault();

                            isFibSelected = true;
                            selectedTrendlineIndex = -1;
                            renderFib();
                            return;
                        }
                    }

                    // 2. HORIZONTAL LINE HIT TEST (56px tall vertical touch zone)
                    if (horizontalLines && horizontalLines.length > 0) {
                        for (let i = 0; i < horizontalLines.length; i++) {
                            const lineY = activeSeries.priceToCoordinate(horizontalLines[i]);
                            if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                                e.stopPropagation();
                                e.stopImmediatePropagation();
                                e.preventDefault();

                                if (i === selectedHorizontalLineIndex) {
                                    // In edit mode: check if tapped the delete button
                                    if (x >= rect.width - HITBOX_HLINE_DEL) {
                                        horizontalLines.splice(i, 1);
                                        selectedHorizontalLineIndex = -1;
                                        renderFib();
                                        notifyHorizontalLinesChanged();
                                        return;
                                    }

                                    // In edit mode: allow dragging vertically
                                    dragHorizontalLineIndex = i;
                                    isPointerDown = true;
                                    try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                    chart.applyOptions({ handleScroll: false, handleScale: false });
                                    renderFib();
                                    return;
                                } else {
                                    // In non-edit mode: tap to enter edit mode!
                                    selectedHorizontalLineIndex = i;
                                    selectedTrendlineIndex = -1;
                                    isFibSelected = false;
                                    renderFib();
                                    return;
                                }
                            }
                        }
                    }

                    // 3. TRENDLINE HIT TEST (Generous touch zones for anchors, delete button, and body)
                    if (trendlines && trendlines.length > 0) {
                        for (let i = 0; i < trendlines.length; i++) {
                            const t = trendlines[i];
                            const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                            const y1 = activeSeries.priceToCoordinate(t.p1.price);
                            const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                            const y2 = activeSeries.priceToCoordinate(t.p2.price);
                            if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                                if (i === selectedTrendlineIndex) {
                                    const pillPos = getTrendlineActionPillPos(x1, y1, x2, y2, chartContainer.clientWidth, chartContainer.clientHeight);
                                    if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_TL_DEL) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        trendlines.splice(i, 1);
                                        selectedTrendlineIndex = -1;
                                        renderFib();
                                        notifyTrendlinesChanged();
                                        return;
                                    }
                                    if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragTrendlineIndex = i;
                                        dragTrendlinePart = 1;
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }
                                    if (Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragTrendlineIndex = i;
                                        dragTrendlinePart = 2;
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }
                                    if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragTrendlineIndex = i;
                                        dragTrendlinePart = 3;
                                        dragTrendlineStartPos = {
                                            x, y,
                                            origP1: { time: t.p1.time, price: t.p1.price },
                                            origP2: { time: t.p2.time, price: t.p2.price }
                                        };
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }
                                } else {
                                    if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        selectedTrendlineIndex = i;
                                        dragTrendlineIndex = i;
                                        dragTrendlinePart = 3;
                                        dragTrendlineStartPos = {
                                            x, y,
                                            origP1: { time: t.p1.time, price: t.p1.price },
                                            origP2: { time: t.p2.time, price: t.p2.price }
                                        };
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }
                                }
                            }
                        }
                    }

                    // If tapped empty space on chart while a trendline, fib, or horizontal line was selected, deselect it
                    let needsDeselect = false;
                    if (selectedTrendlineIndex !== -1) {
                        selectedTrendlineIndex = -1;
                        needsDeselect = true;
                    }
                    if (isFibSelected) {
                        isFibSelected = false;
                        needsDeselect = true;
                    }
                    if (selectedHorizontalLineIndex !== -1) {
                        selectedHorizontalLineIndex = -1;
                        needsDeselect = true;
                    }
                    if (needsDeselect) {
                        renderFib();
                    }
                }, { capture: true });
            }

            canvas.addEventListener('pointerdown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                pointerDownPos = { x, y };
                pointerDownTime = Date.now();

                // 0. Horizontal Line Placement (One-Tap S/R)
                if (isDrawingHorizontalLine) {
                    const price = getPriceAtY(y);
                    crosshairPos = null;
                    if (price !== null) {
                        horizontalLines.push(price);
                        selectedHorizontalLineIndex = horizontalLines.length - 1; // Enter edit mode immediately upon placement!
                        selectedTrendlineIndex = -1;
                        isFibSelected = false;
                        isDrawingHorizontalLine = false;
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        renderFib();
                        notifyHorizontalLinesChanged();
                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onHorizontalLineAdded', price);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onHorizontalLineAdded', payload: price }), '*');
                    }
                    return;
                }

                // 0.1 Check if clicking on an existing horizontal line or its delete button
                const activeSeries = candleSeries || areaSeries;
                if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                    for (let i = 0; i < horizontalLines.length; i++) {
                        const lineY = activeSeries.priceToCoordinate(horizontalLines[i]);
                        if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                            if (i === selectedHorizontalLineIndex) {
                                // Check if clicked the delete button at the right edge
                                if (x >= rect.width - HITBOX_HLINE_DEL) {
                                    horizontalLines.splice(i, 1);
                                    selectedHorizontalLineIndex = -1;
                                    canvas.style.cursor = 'default';
                                    canvas.style.pointerEvents = 'none';
                                    renderFib();
                                    notifyHorizontalLinesChanged();
                                    return;
                                }
                                // Otherwise start vertical dragging
                                dragHorizontalLineIndex = i;
                                isPointerDown = true;
                                canvas.setPointerCapture?.(e.pointerId);
                                if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                canvas.style.cursor = 'ns-resize';
                                return;
                            } else {
                                // In non-edit mode: tap to enter edit mode!
                                selectedHorizontalLineIndex = i;
                                selectedTrendlineIndex = -1;
                                isFibSelected = false;
                                canvas.style.cursor = 'default';
                                renderFib();
                                return;
                            }
                        }
                    }
                }

                // 0.2 Trendline Placement (Two-Click Drawing Mode)
                if (isDrawingTrendline) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        if (trendlineDrawState === 1) {
                            // Click 1: Anchor 1 placed
                            tempTrendlineP1 = { time, price };
                            tempTrendlineP2 = { time, price };
                            trendlineDrawState = 2; // Waiting for Anchor 2
                            isPointerDown = true;
                            canvas.setPointerCapture?.(e.pointerId);
                            if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                            renderFib();
                            return;
                        } else if (trendlineDrawState === 2) {
                            // Click 2: Anchor 2 placed -> Lock trendline
                            if (tempTrendlineP1) {
                                const newLine = {
                                    p1: tempTrendlineP1,
                                    p2: { time, price }
                                };
                                trendlines.push(newLine);
                                selectedTrendlineIndex = trendlines.length - 1; // Enter edit mode upon placement
                                isDrawingTrendline = false;
                                trendlineDrawState = 0;
                                tempTrendlineP1 = null;
                                tempTrendlineP2 = null;
                                crosshairPos = null;
                                isPointerDown = false;
                                try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                                if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                                canvas.style.cursor = 'default';
                                canvas.style.pointerEvents = 'none';
                                renderFib();
                                notifyTrendlinesChanged();
                                if (window.flutter_inappwebview?.callHandler) {
                                    window.flutter_inappwebview.callHandler('onTrendlineAdded', newLine);
                                }
                                window.parent?.postMessage(JSON.stringify({ type: 'onTrendlineAdded', payload: newLine }), '*');
                                return;
                            }
                        }
                    }
                    return;
                }

                // 0.3 Check if clicking on an existing Trendline (midpoint delete button, anchors, or body)
                if (trendlines && trendlines.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < trendlines.length; i++) {
                        const t = trendlines[i];
                        const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                        const y1 = activeSeries.priceToCoordinate(t.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                        const y2 = activeSeries.priceToCoordinate(t.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            if (i === selectedTrendlineIndex) {
                                // Floating context action pill tap (TradingView Mobile Style)
                                const pillPos = getTrendlineActionPillPos(x1, y1, x2, y2, chartContainer.clientWidth, chartContainer.clientHeight);
                                if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_TL_DEL) {
                                    trendlines.splice(i, 1);
                                    selectedTrendlineIndex = -1;
                                    canvas.style.cursor = 'default';
                                    canvas.style.pointerEvents = 'none';
                                    renderFib();
                                    notifyTrendlinesChanged();
                                    return;
                                }
                                // Anchor 1 grab
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR) {
                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 1;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'grabbing';
                                    return;
                                }
                                // Anchor 2 grab
                                if (Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 2;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'grabbing';
                                    return;
                                }

                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 3;
                                    dragTrendlineStartPos = {
                                        x, y,
                                        origP1: { time: t.p1.time, price: t.p1.price },
                                        origP2: { time: t.p2.time, price: t.p2.price }
                                    };
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                // Click on unselected trendline body to select into Edit Mode!
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    selectedTrendlineIndex = i;
                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 3;
                                    dragTrendlineStartPos = {
                                        x, y,
                                        origP1: { time: t.p1.time, price: t.p1.price },
                                        origP2: { time: t.p2.time, price: t.p2.price }
                                    };
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'move';
                                    renderFib();
                                    return;
                                }
                            }
                        }
                    }
                }

                // 1. Check if clicking on an existing anchor handle to reposition (Fib)
                if (fibDrawState === 0 && fibPoint1 && fibPoint2) {
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = candleSeries.priceToCoordinate(fibPoint1.price);
                    const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                    const y2 = candleSeries.priceToCoordinate(fibPoint2.price);

                    if (x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR) {
                        dragMode = 1;
                        isPointerDown = true;
                        canvas.setPointerCapture?.(e.pointerId);
                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                        renderFib();
                        return;
                    }
                    if (x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR) {
                        dragMode = 2;
                        isPointerDown = true;
                        canvas.setPointerCapture?.(e.pointerId);
                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                        renderFib();
                        return;
                    }
                }

                // 2. Click 1: Place Anchor 1 (Fib)
                if (fibDrawState === 1) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint1 = { time, price };
                        fibPoint2 = { time, price };
                        fibDrawState = 2; // Now waiting for click 2 (Anchor 2)
                        isPointerDown = true;
                        canvas.setPointerCapture?.(e.pointerId);
                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                        renderFib();
                    }
                    return;
                }

                // 3. Click 2: Place Anchor 2 (Fib - No hold required!)
                if (fibDrawState === 2) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint2 = { time, price };
                        fibDrawState = 0;
                        isDrawingFib = false;
                        isFibSelected = true;
                        isPointerDown = false;
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        renderFib();

                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onFibDrawn', true);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: true }), '*');
                    }
                    return;
                }

                // If tapped on empty canvas space outside all drawings:
                let canvasNeedsDeselect = false;
                if (selectedTrendlineIndex !== -1) {
                    selectedTrendlineIndex = -1;
                    canvasNeedsDeselect = true;
                }
                if (isFibSelected) {
                    isFibSelected = false;
                    canvasNeedsDeselect = true;
                }
                if (selectedHorizontalLineIndex !== -1) {
                    selectedHorizontalLineIndex = -1;
                    canvasNeedsDeselect = true;
                }
                if (canvasNeedsDeselect) {
                    renderFib();
                }
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            });

            const onPointerMove = (e) => {
                if (!isDrawingHorizontalLine && !isDrawingTrendline && !isDrawingFib && fibDrawState === 0 && trendlineDrawState === 0 && !isPointerDown && dragHorizontalLineIndex === -1 && dragTrendlineIndex === -1 && dragMode === 0) {
                    updateHoverState(e);
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                // Tracking crosshair position during drawing tools (S/R, Fib, Trendline)
                if (isDrawingHorizontalLine || (isDrawingFib && fibDrawState > 0) || (isDrawingTrendline && trendlineDrawState > 0)) {
                    crosshairPos = { x, y };
                    if (isDrawingHorizontalLine || (isDrawingTrendline && trendlineDrawState === 1)) {
                        renderFib();
                        return;
                    }
                } else if (crosshairPos !== null && dragHorizontalLineIndex === -1 && dragTrendlineIndex === -1) {
                    crosshairPos = null;
                }

                // Live rubber-band preview during Trendline Anchor 2 aiming
                if (isDrawingTrendline && trendlineDrawState === 2) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        tempTrendlineP2 = { time, price };
                        renderFib();
                    }
                    return;
                }

                // Dragging Trendline (Anchor 1, Anchor 2, or Body)
                if (dragTrendlineIndex >= 0 && trendlines[dragTrendlineIndex]) {
                    crosshairPos = null;
                    const t = trendlines[dragTrendlineIndex];
                    if (dragTrendlinePart === 1) {
                        const time = getTimeAtX(x);
                        const price = getPriceAtY(y);
                        if (time && price !== null) {
                            t.p1 = { time, price };
                            renderFib();
                        }
                        return;
                    }
                    if (dragTrendlinePart === 2) {
                        const time = getTimeAtX(x);
                        const price = getPriceAtY(y);
                        if (time && price !== null) {
                            t.p2 = { time, price };
                            renderFib();
                        }
                        return;
                    }
                    if (dragTrendlinePart === 3 && dragTrendlineStartPos) {
                        const activeSeries = candleSeries || areaSeries;
                        if (!activeSeries || !chart) return;
                        const dx = x - dragTrendlineStartPos.x;
                        const dy = y - dragTrendlineStartPos.y;

                        const curX1 = chart.timeScale().timeToCoordinate(dragTrendlineStartPos.origP1.time);
                        const curY1 = activeSeries.priceToCoordinate(dragTrendlineStartPos.origP1.price);
                        const curX2 = chart.timeScale().timeToCoordinate(dragTrendlineStartPos.origP2.time);
                        const curY2 = activeSeries.priceToCoordinate(dragTrendlineStartPos.origP2.price);

                        if (curX1 !== null && curY1 !== null && curX2 !== null && curY2 !== null) {
                            const newTime1 = getTimeAtX(curX1 + dx);
                            const newPrice1 = getPriceAtY(curY1 + dy);
                            const newTime2 = getTimeAtX(curX2 + dx);
                            const newPrice2 = getPriceAtY(curY2 + dy);

                            if (newTime1 && newPrice1 !== null && newTime2 && newPrice2 !== null) {
                                t.p1 = { time: newTime1, price: newPrice1 };
                                t.p2 = { time: newTime2, price: newPrice2 };
                                renderFib();
                            }
                        }
                        return;
                    }
                }

                // Dragging Horizontal Line vertically
                if (dragHorizontalLineIndex >= 0 && horizontalLines && horizontalLines[dragHorizontalLineIndex] !== undefined) {
                    crosshairPos = null;
                    const price = getPriceAtY(y);
                    if (price !== null) {
                        horizontalLines[dragHorizontalLineIndex] = price;
                        renderFib();
                    }
                    return;
                }

                if (dragMode === 1) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint1 = { time, price };
                        renderFib();
                    }
                    return;
                }
                if (dragMode === 2) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint2 = { time, price };
                        renderFib();
                    }
                    return;
                }

                // While in state 2: live preview as cursor/finger moves (NO HOLDING NEEDED)
                if (fibDrawState === 2) {
                    const time = getTimeAtX(x);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint2 = { time, price };
                        renderFib();
                    }
                }
            };

            canvas.addEventListener('pointermove', onPointerMove);
            if (chartContainer) {
                chartContainer.addEventListener('pointermove', onPointerMove);
            }

            canvas.addEventListener('pointerleave', () => {
                if (crosshairPos !== null) {
                    crosshairPos = null;
                    renderFib();
                }
                if (!isDrawingHorizontalLine && !isDrawingTrendline && !isDrawingFib && !isPointerDown) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                }
            });

            const onPointerUp = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const dist = Math.hypot(x - pointerDownPos.x, y - pointerDownPos.y);

                if (dragTrendlineIndex >= 0) {
                    dragTrendlineIndex = -1;
                    dragTrendlinePart = 0;
                    dragTrendlineStartPos = null;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    notifyTrendlinesChanged();
                    return;
                }

                if (dragHorizontalLineIndex >= 0) {
                    dragHorizontalLineIndex = -1;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    notifyHorizontalLinesChanged();
                    return;
                }

                if (dragMode === 1 || dragMode === 2) {
                    dragMode = 0;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onFibDrawn', true);
                    }
                    window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: true }), '*');
                    return;
                }

                if (isDrawingTrendline && trendlineDrawState === 2) {
                    // If user dragged and released with distance >= 20px, finalize immediately (Drag gesture fallback)
                    if (dist >= 20 && tempTrendlineP1 && tempTrendlineP2) {
                        const newLine = { p1: tempTrendlineP1, p2: tempTrendlineP2 };
                        trendlines.push(newLine);
                        selectedTrendlineIndex = trendlines.length - 1; // Enter edit mode upon placement
                        isDrawingTrendline = false;
                        trendlineDrawState = 0;
                        tempTrendlineP1 = null;
                        tempTrendlineP2 = null;
                        crosshairPos = null;
                        isPointerDown = false;
                        try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        renderFib();
                        notifyTrendlinesChanged();
                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onTrendlineAdded', newLine);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onTrendlineAdded', payload: newLine }), '*');
                        return;
                    }

                    // If it was just a tap for Anchor 1:
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    renderFib();
                    return;
                }


                if (fibDrawState === 2) {
                    // If user dragged and released with distance >= 20px, finalize immediately (Drag gesture fallback)
                    if (dist >= 20 && fibPoint1 && fibPoint2 && Math.abs(fibPoint2.price - fibPoint1.price) > 0.001) {
                        fibDrawState = 0;
                        isDrawingFib = false;
                        isFibSelected = true;
                        isPointerDown = false;
                        try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        renderFib();

                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onFibDrawn', true);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: true }), '*');
                        return;
                    }

                    // If it was just a tap for Anchor 1:
                    // Release pointer capture so cursor/touch movement tracks freely WITHOUT needing to hold!
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
