                            rsiSeries.setData(currentRsiData);
                        }
                    } else if (rsiSeries.getPane && rsiSeries.getPane().paneIndex() !== targetRsiPane) {
                        rsiSeries.moveToPane(targetRsiPane);
                    }
                }

                // Create or position Volume series
                if (currentShowVolume) {
                    if (!volumeSeries) {
                        volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
                            priceFormat: { type: 'volume' },
                            priceScaleId: 'volume-scale',
                            title: 'VOL',
                        }, targetVolumePane);

                        volumeSeries.priceScale().applyOptions({
                            scaleMargins: { top: 0.15, bottom: 0 },
                        });

                        if (currentVolumeData && currentVolumeData.length > 0) {
                            volumeSeries.setData(currentVolumeData);
                        }
                    } else if (volumeSeries.getPane && volumeSeries.getPane().paneIndex() !== targetVolumePane) {
                        volumeSeries.moveToPane(targetVolumePane);
                    }
                }

                // Configure stretch factors based on active panes:
                try {
                    const panes = chart.panes();
                    if (panes && panes.length === 1) {
                        panes[0].setStretchFactor(1);
                    } else if (panes && panes.length === 2) {
                        panes[0].setStretchFactor(4);
                        panes[1].setStretchFactor(1.2);
                    } else if (panes && panes.length >= 3) {
                        panes[0].setStretchFactor(5);
                        panes[1].setStretchFactor(1.4);
                        panes[2].setStretchFactor(1.2);
                    }
                } catch (paneErr) {
                    console.warn("setStretchFactor warning:", paneErr);
                }

                candleSeries.priceScale().applyOptions({
                    scaleMargins: { top: 0.08, bottom: 0.08 }
                });

                renderFib();
            } catch (err) {
                console.error("updatePanes error:", err);
            }
        }

        function setIndicators(showSma, showRsi, showVolume) {
            currentShowSma = Boolean(showSma);
            currentShowRsi = Boolean(showRsi);
            if (showVolume !== undefined && showVolume !== null) {
                currentShowVolume = Boolean(showVolume);
            }

            if (smaSeries) {
                smaSeries.applyOptions({ visible: currentShowSma });
            }

            updatePanes();
        }

        function setData(candlesJson, volumesJson) {
            if (!chart) initChart();
            const candles = typeof candlesJson === 'string' ? JSON.parse(candlesJson) : candlesJson;
            rawCandlesData = candles;
            candleSeries.setData(candles);
            areaSeries.setData(candles.map(c => ({ time: c.time, value: c.close })));
            if (volumesJson) {
                const vols = typeof volumesJson === 'string' ? JSON.parse(volumesJson) : volumesJson;
                currentVolumeData = vols;
                if (volumeSeries) {
                    volumeSeries.setData(vols);
                }
            }
            if (currentShowFib && (!fibPoint1 || !fibPoint2)) {
                startFibDrawing();
            }
            updatePanes();
            chart.timeScale().fitContent();
            renderFib();
        }

        function setDataWithIndicators(payloadInput) {
            if (!chart) {
                pendingData = payloadInput;
                initChart();
                return;
            }

            const payload = typeof payloadInput === 'string' ? JSON.parse(payloadInput) : payloadInput;

            if (payload.candles && Array.isArray(payload.candles) && payload.candles.length > 0) {
                rawCandlesData = payload.candles;
                candleSeries.setData(payload.candles);
                areaSeries.setData(payload.candles.map(c => ({ time: c.time, value: c.close })));

                const volData = payload.candles.map(c => ({
                    time: c.time,
                    value: c.volume || 0,
                    color: c.close >= c.open ? '#26a69a88' : '#ef535088'
                }));
                currentVolumeData = volData;
                if (volumeSeries) {
                    volumeSeries.setData(volData);
                }
            }

            if (payload.indicators) {
                if (payload.indicators.sma20 && Array.isArray(payload.indicators.sma20)) {
                    smaSeries.setData(payload.indicators.sma20);
                }
                if (payload.indicators.rsi14 && Array.isArray(payload.indicators.rsi14)) {
                    currentRsiData = payload.indicators.rsi14;
                    if (rsiSeries) {
                        rsiSeries.setData(payload.indicators.rsi14);
                    }
                }
            }

            if (currentShowFib && (!fibPoint1 || !fibPoint2)) {
                startFibDrawing();
            }
            setIndicators(currentShowSma, currentShowRsi, currentShowVolume);
            chart.timeScale().fitContent();
            renderFib();
        }

        function updateBar(barInput, volBarInput) {
            if (!chart) return;
            const bar = typeof barInput === 'string' ? JSON.parse(barInput) : barInput;
            candleSeries.update(bar);
            areaSeries.update({ time: bar.time, value: bar.close });
            if (volBarInput) {
                const vol = typeof volBarInput === 'string' ? JSON.parse(volBarInput) : volBarInput;
                if (currentVolumeData && currentVolumeData.length > 0) {
                    const lastIdx = currentVolumeData.length - 1;
                    if (currentVolumeData[lastIdx].time === vol.time) {
                        currentVolumeData[lastIdx] = vol;
                    } else {
                        currentVolumeData.push(vol);
                    }
                }
                if (volumeSeries) {
                    volumeSeries.update(vol);
                }
            }
            renderFib();
        }

        function setVisibleRange(fromSec, toSec) {
            if (chart) chart.timeScale().setVisibleRange({ from: fromSec, to: toSec });
            renderFib();
        }

        // Auto-initialize when document loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => initChart());
        } else {
            initChart();
        }

        // Cross-window message listener for web compatibility
        window.addEventListener('message', function(event) {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (!data || !data.type) return;

                if (data.type === 'setDataWithIndicators') {
                    setDataWithIndicators(data.payload);
                } else if (data.type === 'setIndicators') {
                    setIndicators(data.showSma, data.showRsi, data.showVolume);
                } else if (data.type === 'setFibonacci') {
                    setFibonacci(data.showFib);
                } else if (data.type === 'resetFibonacci') {
                    resetFibonacci();
                } else if (data.type === 'startFibDrawing') {
                    startFibDrawing();
                } else if (data.type === 'cancelFibDrawing') {
                    cancelFibDrawing();
                } else if (data.type === 'startHorizontalLineDrawing') {
                    startHorizontalLineDrawing();
                } else if (data.type === 'cancelHorizontalLineDrawing') {
                    cancelHorizontalLineDrawing();
                } else if (data.type === 'setHorizontalLines') {
                    setHorizontalLines(data.lines);
                } else if (data.type === 'clearHorizontalLines') {
                    clearHorizontalLines();
                } else if (data.type === 'startTrendlineDrawing') {
                    startTrendlineDrawing();
                } else if (data.type === 'cancelTrendlineDrawing') {
                    cancelTrendlineDrawing();
                } else if (data.type === 'setTrendlines') {
                    setTrendlines(data.lines);
                } else if (data.type === 'clearTrendlines') {
                    clearTrendlines();
                } else if (data.type === 'startRectangleDrawing') {
                    startRectangleDrawing();
                } else if (data.type === 'cancelRectangleDrawing') {
                    cancelRectangleDrawing();
                } else if (data.type === 'setRectangles') {
                    setRectangles(data.rectangles);
                } else if (data.type === 'clearRectangles') {
                    clearRectangles();
                } else if (data.type === 'clearAllDrawings') {
                    clearAllDrawings();
                } else if (data.type === 'setData') {
                    setData(data.candles, data.volumes);
                } else if (data.type === 'setSeriesType') {
                    setSeriesType(data.seriesType);
                } else if (data.type === 'initChart') {
                    initChart(data.upColor, data.downColor, data.gridColor, data.interactive);
                }
            } catch (e) {
                console.error("tv_chart message error:", e);
            }
        });
    </script>
