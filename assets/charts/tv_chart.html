<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #chart-container,
        #chart,
        #fib-canvas {
            touch-action: none;
        }

        #chart {
            width: 100vw;
            height: 100vh;
        }

        #chart a {
            display: none !important;
            pointer-events: none !important;
        }

        /* TradingView Mobile Floating Toolbar Style */
        .tv-floating-toolbar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: #1E1E1E;
            border: 1px solid #2C2C2E;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            height: 38px;
            padding: 0 4px;
            z-index: 50;
            user-select: none;
            touch-action: none;
        }

        .tv-tb-drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 32px;
            cursor: grab;
            padding: 0 2px;
        }

        .tv-tb-drag-handle:active {
            cursor: grabbing;
        }

        .tv-tb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 32px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #B2B5BE;
            cursor: pointer;
            padding: 0;
            margin: 0 1px;
            outline: none;
            position: relative;
            transition: background 0.12s, color 0.12s;
            touch-action: manipulation;
        }

        .tv-tb-btn:active, .tv-tb-btn.active {
            background: #2B2B2B;
            color: #FFFFFF;
        }

        #tv-btn-angle.active {
            background: #2B2B2B;
            color: #00E5FF;
        }

        .tv-tb-btn-delete {
            color: #EF5350;
        }
        .tv-tb-btn-delete:active {
            background: rgba(239, 83, 80, 0.18);
            color: #FF5252;
        }

        .tv-tb-text-btn {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #FFFFFF;
            width: auto;
            padding: 0 7px;
        }

        .tv-btn-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tv-color-underline {
            width: 16px;
            height: 3px;
            border-radius: 1.5px;
            margin-top: 2px;
        }

        .tv-t-icon {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }

        .tv-style-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 14px;
        }

        .tv-style-line-solid {
            width: 18px;
            height: 2px;
            background: #FFFFFF;
            border-radius: 1px;
            display: block;
        }

        .tv-style-line-dashed {
            width: 18px;
            height: 0;
            border-top: 2px dashed #FFFFFF;
            display: block;
        }

        .tv-style-line-dotted {
            width: 18px;
            height: 0;
            border-top: 2px dotted #FFFFFF;
            display: block;
        }

        /* Common Popover Menu Style */
        .tv-popover {
            position: absolute;
            background: #1E1E1E;
            border: 1px solid #2C2C2E;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
            z-index: 60;
            user-select: none;
            touch-action: manipulation;
        }

        /* Width & Style Dropdowns */
        .tv-menu-list {
            display: flex;
            flex-direction: column;
            padding: 6px;
            min-width: 120px;
        }

        .tv-menu-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            color: #D1D4DC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            gap: 12px;
            transition: background 0.12s;
        }

        .tv-menu-item:active, .tv-menu-item.selected {
            background: #FFFFFF;
            color: #121212;
            font-weight: 700;
        }

        .tv-menu-item.selected .tv-menu-line {
            background: #121212 !important;
            border-color: #121212 !important;
        }

        .tv-menu-line {
            width: 22px;
            background: #D1D4DC;
            border-radius: 1px;
            display: inline-block;
        }

        /* Color Picker Popover (TradingView Exact Matrix) */
        .tv-color-picker {
            padding: 12px;
            width: 255px;
        }

        .tv-palette-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 12px;
        }

        .tv-color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            box-sizing: border-box;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tv-color-swatch.selected {
            box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #1E1E1E;
            z-index: 2;
        }

        .tv-custom-color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-top: 8px;
            border-top: 1px solid #2C2C2E;
        }

        .tv-custom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 1px dashed #50535E;
            color: #B2B5BE;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            position: relative;
        }

        .tv-opacity-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tv-opacity-label {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11.5px;
            color: #787B86;
            font-weight: 500;
        }

        .tv-opacity-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tv-slider-container {
            position: relative;
            flex: 1;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            background-image: repeating-linear-gradient(45deg, #2B2B2B 25%, transparent 25%, transparent 75%, #2B2B2B 75%, #2B2B2B), repeating-linear-gradient(45deg, #2B2B2B 25%, #1E1E1E 25%, #1E1E1E 75%, #2B2B2B 75%, #2B2B2B);
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            border: 1px solid #2C2C2E;
        }

        .tv-slider-gradient {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .tv-opacity-input {
            position: absolute;
            top: -4px;
            left: 0;
            width: 100%;
            height: 20px;
            margin: 0;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        .tv-opacity-val {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            color: #D1D4DC;
            padding: 3px 6px;
            background: #121212;
            border: 1px solid #2C2C2E;
            border-radius: 4px;
            min-width: 34px;
            text-align: center;
        }

        /* TradingView Mobile Bottom Sheet for More Options (•••) */
        .tv-sheet-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease;
            touch-action: none;
        }

        .tv-sheet-backdrop.visible {
            opacity: 1;
        }

        .tv-bottom-sheet {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 1001;
            box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.6);
            padding: 8px 0 20px 0;
            transform: translateY(100%);
            transition: transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        .tv-bottom-sheet.visible {
            transform: translateY(0);
        }

        .tv-sheet-handle {
            width: 36px;
            height: 4px;
            background: #50535E;
            border-radius: 2px;
            margin: 4px auto 10px auto;
        }

        .tv-sheet-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 13px 20px;
            color: #D1D4DC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            touch-action: manipulation;
        }

        .tv-sheet-item:active {
            background: #2B2B2B;
            color: #FFFFFF;
        }

        .tv-sheet-item svg {
            flex-shrink: 0;
            color: #868993;
            transition: color 0.12s;
        }

        .tv-sheet-item:active svg {
            color: #FFFFFF;
        }

        .tv-sheet-separator {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 6px 0;
        }

        /* TradingView Mobile Trendline Settings Modal */
        .tv-modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1050;
            opacity: 0;
            transition: opacity 0.22s ease;
            touch-action: none;
        }

        .tv-modal-backdrop.visible {
            opacity: 1;
        }

        .tv-settings-modal {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            max-height: 90vh;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 1060;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.75);
            transform: translateY(100%);
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .tv-settings-modal.visible {
            transform: translateY(0);
        }

        .tv-settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 12px 20px;
        }

        .tv-settings-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 600;
        }

        .tv-settings-close-btn {
            background: transparent;
            border: none;
            color: #868993;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.12s;
        }

        .tv-settings-close-btn:active {
            color: #FFFFFF;
        }

        .tv-settings-tabs {
            display: flex;
            border-bottom: 1px solid #2C2C2E;
            padding: 0 20px;
        }

        .tv-settings-tab {
            position: relative;
            color: #FFFFFF;
            font-size: 14.5px;
            font-weight: 600;
            padding: 10px 4px 12px 4px;
            cursor: pointer;
        }

        .tv-settings-tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2.5px;
            background: #FFFFFF;
            border-radius: 1.5px;
        }

        .tv-settings-body {
            padding: 18px 20px 12px 20px;
            overflow-y: auto;
            flex: 1;
            box-sizing: border-box;
            scrollbar-width: none;
        }

        .tv-settings-body::-webkit-scrollbar {
            display: none;
        }

        /* Formatting row: Swatch, Size, Bold, Italic */
        .tv-fmt-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tv-fmt-color-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 4px;
        }

        .tv-fmt-color-preview {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tv-fmt-select-wrap {
            position: relative;
            display: inline-block;
        }

        .tv-fmt-size-btn {
            height: 36px;
            min-width: 68px;
            padding: 0 10px 0 12px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            transition: border-color 0.15s;
        }

        .tv-fmt-size-btn:hover, .tv-fmt-size-btn:focus {
            border-color: #50535E;
        }

        .tv-size-chevron {
            color: #868993;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
        }

        .tv-size-chevron.open {
            transform: rotate(180deg);
        }

        /* Size Dropdown Overlay (TradingView Mobile Style) */
        .tv-size-dropdown-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 138px;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
            z-index: 30;
            overflow-y: auto;
            padding: 10px 14px 20px 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scrollbar-width: none;
        }

        .tv-size-dropdown-overlay::-webkit-scrollbar {
            display: none;
        }

        .tv-size-item {
            height: 42px;
            min-height: 42px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-radius: 8px;
            color: #D1D4DC;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.12s, color 0.12s;
            box-sizing: border-box;
        }

        .tv-size-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tv-size-item.selected {
            background: #F0F3FA;
            color: #121212;
            font-weight: 600;
        }

        .tv-select-arrow {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #868993;
            display: flex;
        }

        .tv-fmt-toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #D1D4DC;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s;
        }

        .tv-fmt-toggle-btn.active {
            background: #2B2B2B;
            border-color: #FFFFFF;
            color: #FFFFFF;
        }

        /* Textarea */
        .tv-settings-textarea {
            width: 100%;
            height: 110px;
            border-radius: 8px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            padding: 12px;
            box-sizing: border-box;
            outline: none;
            resize: none;
            margin-bottom: 18px;
            transition: border-color 0.15s;
            user-select: text;
            -webkit-user-select: text;
        }

        .tv-settings-textarea:focus {
            border-color: #2962FF;
        }

        .tv-settings-textarea::placeholder {
            color: #50535E;
        }

        /* Alignment row */
        .tv-align-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tv-align-label {
            color: #D1D4DC;
            font-size: 14px;
            font-weight: 400;
            flex: 1;
        }

        .tv-align-select {
            height: 36px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            padding: 0 30px 0 12px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            outline: none;
        }

        /* Footer */
        .tv-settings-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 14px 20px 20px 20px;
            border-top: 1px solid #2C2C2E;
            background: #1E1E1E;
        }

        .tv-footer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tv-footer-btn-cancel {
            height: 36px;
            padding: 0 16px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: transparent;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.12s;
        }

        .tv-footer-btn-cancel:active {
            background: #2B2B2B;
        }

        .tv-footer-btn-ok {
            height: 36px;
            padding: 0 20px;
            border-radius: 6px;
            border: none;
            background: #FFFFFF;
            color: #000000;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.12s;
        }

        .tv-footer-btn-ok:active {
            opacity: 0.85;
        }
    </style>
    <script src="lightweight-charts.standalone.production.js"></script>
</head>

<body>
    <div id="chart-container" style="position: relative; width: 100vw; height: 100vh; overflow: hidden;">
        <div id="chart" style="width: 100%; height: 100%;"></div>
        <canvas id="fib-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10;"></canvas>

        <!-- Floating Trendline Edit Toolbar (TradingView Mobile Style) -->
        <div id="tv-trendline-toolbar" class="tv-floating-toolbar" style="display: none;">
            <!-- Drag Handle -->
            <div class="tv-tb-drag-handle" id="tv-drag-handle" title="Geser Toolbar">
                <svg width="10" height="18" viewBox="0 0 10 18" fill="none">
                    <circle cx="3" cy="3" r="1.3" fill="#787B86" />
                    <circle cx="7" cy="3" r="1.3" fill="#787B86" />
                    <circle cx="3" cy="9" r="1.3" fill="#787B86" />
                    <circle cx="7" cy="9" r="1.3" fill="#787B86" />
                    <circle cx="3" cy="15" r="1.3" fill="#787B86" />
                    <circle cx="7" cy="15" r="1.3" fill="#787B86" />
                </svg>
            </div>

            <!-- Template / Clone Button -->
            <button class="tv-tb-btn" id="tv-btn-clone" title="Template">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6">
                    <rect x="2.5" y="2.5" width="5" height="5" rx="1" />
                    <rect x="10.5" y="2.5" width="5" height="5" rx="1" />
                    <rect x="2.5" y="10.5" width="5" height="5" rx="1" />
                    <rect x="10.5" y="10.5" width="5" height="5" rx="1" />
                    <path d="M13 11.5v3M11.5 13h3" stroke-linecap="round" />
                </svg>
            </button>

            <!-- Line Color Button (Pencil) -->
            <button class="tv-tb-btn" id="tv-btn-line-color" title="Warna Garis">
                <div class="tv-btn-icon-wrapper">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12.5 2.5l3 3L5.5 15.5H2.5v-3L12.5 2.5z" />
                    </svg>
                    <div id="tv-indicator-line-color" class="tv-color-underline" style="background-color: #7C4DFF;"></div>
                </div>
            </button>

            <!-- Text Color Button ('T') -->
            <button class="tv-tb-btn" id="tv-btn-text-color" title="Warna Teks">
                <div class="tv-btn-icon-wrapper">
                    <span class="tv-t-icon">T</span>
                    <div id="tv-indicator-text-color" class="tv-color-underline" style="background-color: #FFFFFF;"></div>
                </div>
            </button>

            <!-- Stroke Width Button (e.g. 4px) -->
            <button class="tv-tb-btn tv-tb-text-btn" id="tv-btn-width" title="Ketebalan Garis">
                <span id="tv-label-width">2px</span>
            </button>

            <!-- Line Style Button (e.g. —, ---, ····) -->
            <button class="tv-tb-btn" id="tv-btn-style" title="Gaya Garis">
                <div id="tv-indicator-line-style" class="tv-style-preview">
                    <span class="tv-style-line-solid"></span>
                </div>
            </button>

    <script>
        window.onerror = function(msg, url, lineNo, columnNo, error) {

        let chart = null;

        let isDrawingTrendline = false;
        let trendlineDrawState = 0; // 0: idle, 1: waiting for p1, 2: waiting for p2

        let dragTrendlineIndex = -1;

        let dragTrendlineStartPos = null;

        let isDrawingRectangle = false;

        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        let fibDrawState = 0; // 0: idle, 1: waiting for anchor 1, 2: waiting for anchor 2
        let pointerDownPos = { x: 0, y: 0 };
        let pointerDownTime = 0;
        let dragMode = 0; // 0: none, 1: reposition anchor 1, 2: reposition anchor 2
        let isPointerDown = false;

        const FIB_LEVELS = [
            { level: -0.27, label: '-27.00%', color: '#26A69A', fill: 'transparent' },
            { level: 0.0,   label: '0.00%',   color: '#787B86', fill: 'rgba(120, 123, 134, 0.05)' },
            { level: 0.236, label: '23.60%',  color: '#F23645', fill: 'rgba(242, 54, 69, 0.06)' },
            { level: 0.382, label: '38.20%',  color: '#FF9800', fill: 'rgba(255, 152, 0, 0.06)' },
            { level: 0.5,   label: '50.00%',  color: '#4CAF50', fill: 'rgba(76, 175, 80, 0.06)' },
            { level: 0.618, label: '61.80%',  color: '#089981', fill: 'rgba(8, 153, 129, 0.08)' },

        ];

        function resizeFibCanvas() {
            const canvas = document.getElementById('fib-canvas');
            if (!canvas) return;
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            const ctx = canvas.getContext('2d');
            ctx.resetTransform?.();
            ctx.scale(dpr, dpr);
            renderFib();
        }
        window.addEventListener('resize', resizeFibCanvas);

        function getChartContentWidth() {
            try {
                if (chart && chart.timeScale && typeof chart.timeScale().width === 'function') {
                    const w = chart.timeScale().width();
                    if (w && w > 0) return w;
                }
            } catch (_) {}
            try {
                if (chart && chart.priceScale && typeof chart.priceScale('right').width === 'function') {
                    const pw = chart.priceScale('right').width();
                    const container = document.getElementById('chart-container');
                    const totalW = container ? container.clientWidth : (window.innerWidth || 360);
                    if (pw && pw > 0) return Math.max(50, totalW - pw);
                }
            } catch (_) {}
            const container = document.getElementById('chart-container');
            const totalW = container ? container.clientWidth : (window.innerWidth || 360);
            return Math.max(50, totalW - 55);
        }

        function getTimeAtX(x) {
            if (!chart) return null;
            const maxW = getChartContentWidth();
            const clampedX = Math.max(0, Math.min(x, maxW));
            const t = chart.timeScale().coordinateToTime(clampedX);
            if (t !== null && t !== undefined) {
                if (typeof t === 'number') return t;
                if (typeof t === 'object' && t.year) {
                    return Math.floor(Date.UTC(t.year, t.month - 1, t.day) / 1000);
                }
            }
            if (rawCandlesData && rawCandlesData.length > 0) {
                let closest = rawCandlesData[0];
                let minDist = Infinity;
                for (let i = 0; i < rawCandlesData.length; i++) {
                    const cx = chart.timeScale().timeToCoordinate(rawCandlesData[i].time);
                    if (cx !== null) {
                        const dist = Math.abs(cx - clampedX);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = rawCandlesData[i];
                        }
                    }
                }
                return closest.time;
            }
            return null;
        }

        function getPriceAtY(y) {
            const series = candleSeries || areaSeries;
            if (!series) return null;
            if (chart && chart.panes && chart.panes().length > 1) {
                const pane0Height = chart.panes()[0]?.getHeight();
                if (pane0Height && y > pane0Height) return null;
            }
            return series.coordinateToPrice(y);
        }

        function getTrendlineActionPillPos(x1, y1, x2, y2, containerWidth, containerHeight) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            const maxW = containerWidth || getChartContentWidth();
            const maxH = containerHeight || 500;

            const dx = x2 - x1;
            const dy = y2 - y1;
            let len = Math.hypot(dx, dy);
            if (len < 1) len = 1;

            // Perpendicular unit normal vector (nx, ny)
            let nx = -dy / len;
            let ny = dx / len;

            // Standardize normal to point "upward" (negative Y) away from the line
            if (Math.abs(ny) < 0.05) {
                // For steep or purely vertical lines: offset horizontally into open space
                nx = (mx > maxW / 2) ? -1 : 1;
                ny = 0;
            } else if (ny > 0) {
                // Invert downwards-pointing normal so it points upwards away from line
                nx = -nx;
                ny = -ny;
            }

            const offsetDist = 38;
            let px = mx + (nx * offsetDist);
            let py = my + (ny * offsetDist);

            // If too close to the top boundary (< 42px), flip normal to opposite side of line
            if (py < 42) {
                px = mx - (nx * offsetDist);
                py = my - (ny * offsetDist);
            }
            // If flipped below chart bottom edge, push back up
            if (py > maxH - 35) {
                px = mx + (nx * offsetDist);
                py = my + (ny * offsetDist);
            }

            // Clamp coordinates safely within content bounds (mentok before price scale)
            px = Math.max(35, Math.min(maxW - 25, px));
            py = Math.max(25, Math.min(maxH - 25, py));

            return { x: px, y: py, mx, my };
        }

        function getRectangleActionPillPos(left, top, right, bottom, maxW, maxH) {
            let px = (left + right) / 2;
            let py = top - 24;
            if (py < 25) {
                py = bottom + 24;
            }
            const limitW = maxW || getChartContentWidth();
            px = Math.max(35, Math.min(limitW - 25, px));
            py = Math.max(25, Math.min((maxH || 500) - 25, py));
            return { x: px, y: py };
        }

        function hexToRgba(hex, alpha = 1.0) {
            if (!hex) hex = '#7C4DFF';
            let c = hex.replace('#', '');
            if (c.length === 3) {
                c = c.split('').map(char => char + char).join('');
            }
            const num = parseInt(c, 16);
            if (isNaN(num)) return `rgba(124, 77, 255, ${alpha})`;
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function positionPopover(popover, targetBtn) {
            if (!popover || !targetBtn) return;
            const btnRect = targetBtn.getBoundingClientRect();
            const container = document.getElementById('chart-container');
            const cRect = container ? container.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };

            popover.style.display = 'block';
            const popW = popover.offsetWidth || 255;
            const popH = popover.offsetHeight || 280;

            let left = btnRect.left + (btnRect.width / 2) - (popW / 2);
            if (left < 8) left = 8;
            if (left + popW > cRect.width - 8) {
                left = cRect.width - popW - 8;
            }

            let top = btnRect.bottom + 8;
            if (top + popH > cRect.height - 8) {
                top = Math.max(8, btnRect.top - popH - 8);
            }

            popover.style.left = Math.round(left) + 'px';
            popover.style.top = Math.round(top) + 'px';
        }

        function cloneSelectedTrendline() {
            if (selectedTrendlineIndex >= 0 && selectedTrendlineIndex < trendlines.length) {
                const src = trendlines[selectedTrendlineIndex];
                const activeSeries = candleSeries || areaSeries;
                let priceOffset = 0;
                if (activeSeries && chart) {
                    const y1 = activeSeries.priceToCoordinate(src.p1.price);

                        if (targetPrice !== null && !isNaN(targetPrice)) {

                    }

                if (!priceOffset) {
                    priceOffset = -(src.p1.price || 100) * 0.005;
                }
                const cloned = {
                    id: 'tl_' + Date.now(),
                    p1: { time: src.p1.time, price: src.p1.price + priceOffset },
                    p2: { time: src.p2.time, price: src.p2.price + priceOffset },
                    color: src.color || '#7C4DFF',

                renderFib();
                notifyTrendlinesChanged();
            }
        }

        function snapCoordinateTo45Degrees(originX, originY, targetX, targetY) {
            const dx = targetX - originX;
            const dy = targetY - originY;
            const dist = Math.hypot(dx, dy);
            if (dist < 2) return { x: targetX, y: targetY };

            // Angle in degrees from origin to target in screen coords
            const deg = Math.atan2(dy, dx) * (180 / Math.PI);
            // Snap to nearest 45 degree multiple: 0 (horizontal), 45, 90 (vertical), 135, 180 (horizontal), -45, -90, -135
            const snappedDeg = Math.round(deg / 45) * 45;
            const snappedRad = snappedDeg * (Math.PI / 180);

            return {
                x: originX + dist * Math.cos(snappedRad),
                y: originY + dist * Math.sin(snappedRad)
            };
        }

        function getTrendlineAngle(t) {
            const activeSeries = candleSeries || areaSeries;
            if (!chart || !activeSeries) return 0;
            const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
            const y1 = activeSeries.priceToCoordinate(t.p1.price);
            const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
            const y2 = activeSeries.priceToCoordinate(t.p2.price);
            if (x1 === null || y1 === null || x2 === null || y2 === null) return 0;
            const rad = Math.atan2(y1 - y2, x2 - x1);
            return Math.round(rad * (180 / Math.PI));
        }

            if (toolbar && dragHandle) {

                dragHandle.onpointerdown = (e) => {
                    e.stopPropagation();
                    isDraggingTb = true;
                    tbStartX = e.clientX;
                    tbStartY = e.clientY;
                    const rect = toolbar.getBoundingClientRect();
                    tbInitLeft = rect.left;
                    tbInitTop = rect.top;
                    toolbar.style.left = tbInitLeft + 'px';
                    toolbar.style.top = tbInitTop + 'px';
                    toolbar.style.transform = 'none';
                    try { dragHandle.setPointerCapture(e.pointerId); } catch (_) {}
                };

                dragHandle.onpointermove = (e) => {
                    if (!isDraggingTb) return;
                    e.stopPropagation();
                    const dx = e.clientX - tbStartX;
                    const dy = e.clientY - tbStartY;
                    const container = document.getElementById('chart-container');
                    const cRect = container ? container.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };

                    let newL = Math.max(5, Math.min(tbInitLeft + dx, cRect.width - toolbar.offsetWidth - 5));
                    let newT = Math.max(5, Math.min(tbInitTop + dy, cRect.height - toolbar.offsetHeight - 5));

                    toolbar.style.left = Math.round(newL) + 'px';
                    toolbar.style.top = Math.round(newT) + 'px';

                    // Reposition open popover
                    if (popColor && popColor.style.display === 'block') {

                    } else if (popWidth && popWidth.style.display === 'block') {

                        positionPopover(popStyle, btnStyle);
                    }
                };

                const endTbDrag = (e) => {
                    if (!isDraggingTb) return;
                    isDraggingTb = false;
                    try { dragHandle.releasePointerCapture(e.pointerId); } catch (_) {}
                };

                dragHandle.onpointerup = endTbDrag;
                dragHandle.onpointercancel = endTbDrag;
            }
        }

        function initFibPointerEvents() {
            const canvas = document.getElementById('fib-canvas');
            const chartContainer = document.getElementById('chart-container');
            if (!canvas || !chartContainer) return;

            // Ergonomic Hitbox Constants (Generous sizes optimized for smartphone touchscreens)
            const HITBOX_FIB_ANCHOR = 38; // 38px radius (76px diameter touch target for mobile fingers/thumbs)
            const HITBOX_HLINE = 28;      // 28px vertical distance (56px tall touch target)
            const HITBOX_HLINE_DEL = 36;  // 36px touch zone at right edge for delete
            const HITBOX_TL_ANCHOR = 32;  // 32px radius for trendline anchors
            const HITBOX_TL_DEL = 28;     // 28px radius for trendline delete button
            const HITBOX_TL_BODY = 22;    // 22px distance for trendline body
            const HITBOX_RECT_CORNER = 30; // 30px radius for rectangle corner handles
            const HITBOX_RECT_DEL = 28;    // 28px radius for rectangle delete button

            // Hover detection to allow grabbing existing anchor handles, trendlines, & horizontal lines on desktop
            function updateHoverState(e) {
                if (isDrawingHorizontalLine || isDrawingTrendline || isDrawingRectangle || isDrawingFib || fibDrawState !== 0 || trendlineDrawState !== 0 || rectangleDrawState !== 0 || isPointerDown || dragHorizontalLineIndex !== -1 || dragTrendlineIndex !== -1 || dragRectangleIndex !== -1 || dragMode !== 0) {
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const maxContentX = getChartContentWidth();

                if (x < 0 || y < 0 || x > maxContentX || y > rect.height) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                    return;
                }

                const activeSeries = candleSeries || areaSeries;

                // 1. Check proximity to horizontal lines (vertical drag or delete button)
                if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                    for (let i = 0; i < horizontalLines.length; i++) {
                        const lineY = activeSeries.priceToCoordinate(horizontalLines[i]);
                        if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                            canvas.style.pointerEvents = 'auto';
                            if (i === selectedHorizontalLineIndex) {
                                if (x >= maxContentX - HITBOX_HLINE_DEL) {
                                    canvas.style.cursor = 'pointer';
                                } else {
                                    canvas.style.cursor = 'ns-resize';
                                }
                            } else {
                                canvas.style.cursor = 'pointer';
                            }
                            return;
                        }
                    }
                }

                // 2. Check proximity to Trendlines (anchors, delete button, or body)
                if (trendlines && trendlines.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < trendlines.length; i++) {
                        const t = trendlines[i];
                        const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                        const y1 = activeSeries.priceToCoordinate(t.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                        const y2 = activeSeries.priceToCoordinate(t.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            if (i === selectedTrendlineIndex) {
                                const pillPos = getTrendlineActionPillPos(x1, y1, x2, y2, maxContentX, rect.height);
                                if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_TL_DEL) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR || Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'grab';
                                    return;
                                }
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                            }
                        }
                    }
                }

                // 2.5 Check proximity to Rectangles (corners, delete button, or body)
                if (rectangles && rectangles.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < rectangles.length; i++) {
                        const r = rectangles[i];
                        const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                        const y1 = activeSeries.priceToCoordinate(r.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                        const y2 = activeSeries.priceToCoordinate(r.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            const left = Math.min(x1, x2);
                            const right = Math.max(x1, x2);
                            const top = Math.min(y1, y2);
                            const bottom = Math.max(y1, y2);

                            if (i === selectedRectangleIndex) {
                                const pillPos = getRectangleActionPillPos(left, top, right, bottom, maxContentX, rect.height);
                                if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_RECT_DEL) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_RECT_CORNER ||
                                    Math.hypot(x - x2, y - y2) <= HITBOX_RECT_CORNER ||
                                    Math.hypot(x - x1, y - y2) <= HITBOX_RECT_CORNER ||
                                    Math.hypot(x - x2, y - y1) <= HITBOX_RECT_CORNER) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'crosshair';
                                    return;
                                }
                                if (x >= left && x <= right && y >= top && y <= bottom) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                            }
                        }
                    }
                }

                // 3. Check proximity to Fibonacci anchors
                if (currentShowFib && fibPoint1 && fibPoint2 && chart && activeSeries) {
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = activeSeries.priceToCoordinate(fibPoint1.price);
                    const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                    const y2 = activeSeries.priceToCoordinate(fibPoint2.price);

                    const near1 = x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR;
                    const near2 = x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR;

                    if (near1 || near2) {
                        canvas.style.pointerEvents = 'auto';
                        canvas.style.cursor = 'grab';
                        return;
                    }
                }

                // Default when not hovering directly over any drawing element
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }

            if (chartContainer) {
                chartContainer.addEventListener('pointermove', (e) => {
                    if (e.target && e.target.closest && e.target.closest('#tv-trendline-toolbar, .tv-popover, #tv-more-bottom-sheet, #tv-more-sheet-backdrop, #tv-settings-modal, #tv-settings-backdrop')) {
                        return;
                    }
                    updateHoverState(e);
                });

                // Mobile-first capture-phase touch interceptor:
                // Intercepts touches on drawing elements BEFORE LightweightCharts can handle them as pan/scroll!
                chartContainer.addEventListener('pointerdown', (e) => {
                    // If touch was on the floating toolbar, popover, bottom sheet, or settings modal, DO NOT INTERCEPT AT ALL!
                    if (e.target && e.target.closest && e.target.closest('#tv-trendline-toolbar, .tv-popover, #tv-more-bottom-sheet, #tv-more-sheet-backdrop, #tv-settings-modal, #tv-settings-backdrop')) {
                        return;
                    }

                    // If user is placing a brand new tool, let canvas handle placement
                    if (isDrawingHorizontalLine || isDrawingTrendline || isDrawingRectangle || isDrawingFib || fibDrawState !== 0 || trendlineDrawState !== 0 || rectangleDrawState !== 0) {
                        return;
                    }

                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const maxContentX = getChartContentWidth();

                    // If touch starts on the right price scale, do NOT intercept, let chart handle price scaling!
                    if (x > maxContentX) {
                        return;
                    }

                    pointerDownPos = { x, y };
                    pointerDownTime = Date.now();

                    const activeSeries = candleSeries || areaSeries;
                    if (!activeSeries || !chart) return;

                    // 1. FIBONACCI RESIZE HIT TEST (Comfortable 76px touch zone)
                    if (currentShowFib && fibPoint1 && fibPoint2) {
                        const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                        const y1 = activeSeries.priceToCoordinate(fibPoint1.price);
                        const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                        const y2 = activeSeries.priceToCoordinate(fibPoint2.price);

                        const hit1 = x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR;
                        const hit2 = x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR;
                        const hitDiagonal = (x1 !== null && y1 !== null && x2 !== null && y2 !== null) && distToSegment(x, y, x1, y1, x2, y2) <= 24;

                        if (hit1 || hit2) {
                            e.stopPropagation();
                            e.stopImmediatePropagation();
                            e.preventDefault();

                            isFibSelected = true;
                            selectedTrendlineIndex = -1;
                            hideTrendlineToolbar();
                            selectedHorizontalLineIndex = -1;
                            selectedRectangleIndex = -1;
                            dragMode = hit1 ? 1 : 2;
                            isPointerDown = true;
                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                            chart.applyOptions({ handleScroll: false, handleScale: false });
                            renderFib();
                            return;
                        } else if (hitDiagonal) {
                            e.stopPropagation();
                            e.stopImmediatePropagation();
                            e.preventDefault();

                            isFibSelected = true;
                            selectedTrendlineIndex = -1;
                            hideTrendlineToolbar();
                            selectedHorizontalLineIndex = -1;
                            selectedRectangleIndex = -1;
                            renderFib();
                            return;
                        }
                    }

                    // 2. HORIZONTAL LINE HIT TEST (56px tall vertical touch zone)
                    if (horizontalLines && horizontalLines.length > 0) {
                        for (let i = 0; i < horizontalLines.length; i++) {
                            const lineY = activeSeries.priceToCoordinate(horizontalLines[i]);
                            if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                                e.stopPropagation();
                                e.stopImmediatePropagation();
                                e.preventDefault();

                                if (i === selectedHorizontalLineIndex) {
                                    // In edit mode: check if tapped the delete button
                                    if (x >= maxContentX - HITBOX_HLINE_DEL) {
                                        horizontalLines.splice(i, 1);
                                        selectedHorizontalLineIndex = -1;
                                        renderFib();
                                        notifyHorizontalLinesChanged();
                                        return;
                                    }

                                    // In edit mode: allow dragging vertically
                                    dragHorizontalLineIndex = i;
                                    isPointerDown = true;
                                    try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                    chart.applyOptions({ handleScroll: false, handleScale: false });
                                    renderFib();
                                    return;
                                } else {
                                    // In non-edit mode: tap to enter edit mode!
                                    selectedHorizontalLineIndex = i;
                                    selectedTrendlineIndex = -1;
                                    hideTrendlineToolbar();
                                    selectedRectangleIndex = -1;
                                    isFibSelected = false;
                                    renderFib();
                                    return;
                                }
                            }
                        }
                    }

                    // 3. TRENDLINE HIT TEST (Generous touch zones for anchors, delete button, and body)
                    if (trendlines && trendlines.length > 0) {
                        for (let i = 0; i < trendlines.length; i++) {
                            const t = trendlines[i];
                            if (t.hidden) continue;
                            const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                            const y1 = activeSeries.priceToCoordinate(t.p1.price);
                            const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                            const y2 = activeSeries.priceToCoordinate(t.p2.price);
                            if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                                if (i === selectedTrendlineIndex) {
                                    if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 1;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                    if (Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 2;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                    if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 3;
                                            dragTrendlineStartPos = {
                                                x, y,
                                                origP1: { time: t.p1.time, price: t.p1.price },
                                                origP2: { time: t.p2.time, price: t.p2.price }
                                            };
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                } else {
                                    if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        selectedTrendlineIndex = i;
                                        selectedRectangleIndex = -1;
                                        selectedHorizontalLineIndex = -1;
                                        isFibSelected = false;
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 3;
                                            dragTrendlineStartPos = {
                                                x, y,
                                                origP1: { time: t.p1.time, price: t.p1.price },
                                                origP2: { time: t.p2.time, price: t.p2.price }
                                            };
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                }
                            }
                        }
                    }

                    // 4. RECTANGLE HIT TEST (Body, corner handles, and action pill delete button)
                    if (rectangles && rectangles.length > 0) {
                        for (let i = 0; i < rectangles.length; i++) {
                            const r = rectangles[i];
                            const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                            const y1 = activeSeries.priceToCoordinate(r.p1.price);
                            const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                            const y2 = activeSeries.priceToCoordinate(r.p2.price);
                            if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                                const left = Math.min(x1, x2);
                                const right = Math.max(x1, x2);
                                const top = Math.min(y1, y2);
                                const bottom = Math.max(y1, y2);

                                if (i === selectedRectangleIndex) {
                                    const pillPos = getRectangleActionPillPos(left, top, right, bottom, maxContentX, chartContainer.clientHeight);
                                    if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_RECT_DEL) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();

                                        selectedRectangleIndex = -1;
                                        renderFib();
