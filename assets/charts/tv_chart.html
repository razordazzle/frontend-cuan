                                    }

                                    // Corner 1 grab (p1)
                                    if (Math.hypot(x - x1, y - y1) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragRectangleIndex = i;
                                        dragRectanglePart = 1;
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }

                                    // Corner 2 grab (p2)
                                    if (Math.hypot(x - x2, y - y2) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragRectangleIndex = i;
                                        dragRectanglePart = 2;
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }

                                    // Corner 3 grab (x1, y2)
                                    if (Math.hypot(x - x1, y - y2) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragRectangleIndex = i;
                                        dragRectanglePart = 4;
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }

                                    // Corner 4 grab (x2, y1)
                                    if (Math.hypot(x - x2, y - y1) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragRectangleIndex = i;
                                        dragRectanglePart = 5;
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }

                                    // Inside rectangle body -> translate entire box
                                    if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        dragRectangleIndex = i;
                                        dragRectanglePart = 3;
                                        dragRectangleStartPos = {
                                            x, y,
                                            origP1: { time: r.p1.time, price: r.p1.price },
                                            origP2: { time: r.p2.time, price: r.p2.price }
                                        };
                                        isPointerDown = true;
                                        try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                        chart.applyOptions({ handleScroll: false, handleScale: false });
                                        renderFib();
                                        return;
                                    }
                                } else {
                                    // In non-edit mode: tap inside or on border to select into Edit Mode!
                                    if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        selectedRectangleIndex = i;
                                        selectedTrendlineIndex = -1;
                                        hideTrendlineToolbar();
                                        selectedHorizontalLineIndex = -1;
                                        isFibSelected = false;
                                        renderFib();
                                        return;
                                    }
                                }
                            }
                        }
                    }

                    // If tapped empty space on chart while a trendline, fib, horizontal line, or rectangle was selected, deselect it
                    let needsDeselect = false;
                    if (selectedTrendlineIndex !== -1) {
                        selectedTrendlineIndex = -1;
                        hideTrendlineToolbar();
                        needsDeselect = true;
                    }
                    if (isFibSelected) {
                        isFibSelected = false;
                        needsDeselect = true;
                    }
                    if (selectedHorizontalLineIndex !== -1) {
                        selectedHorizontalLineIndex = -1;
                        needsDeselect = true;
                    }
                    if (selectedRectangleIndex !== -1) {
                        selectedRectangleIndex = -1;
                        needsDeselect = true;
                    }
                    if (needsDeselect) {
                        hideTrendlineToolbar();
                        renderFib();
                    }
                }, { capture: true });
            }

            canvas.addEventListener('pointerdown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const maxContentX = getChartContentWidth();
                const clampedX = Math.max(0, Math.min(x, maxContentX));
                pointerDownPos = { x: clampedX, y };
                pointerDownTime = Date.now();

                // 0. Horizontal Line Placement (One-Tap S/R)
                if (isDrawingHorizontalLine) {
                    const price = getPriceAtY(y);
                    crosshairPos = null;
                    if (price !== null) {
                        horizontalLines.push(price);
                        selectedHorizontalLineIndex = horizontalLines.length - 1; // Enter edit mode immediately upon placement!
                        selectedTrendlineIndex = -1;
                        isFibSelected = false;
                        isDrawingHorizontalLine = false;
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        renderFib();
                        notifyHorizontalLinesChanged();
                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onHorizontalLineAdded', price);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onHorizontalLineAdded', payload: price }), '*');
                    }
                    return;
                }

                // 0.1 Check if clicking on an existing horizontal line or its delete button
                const activeSeries = candleSeries || areaSeries;
                if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                    for (let i = 0; i < horizontalLines.length; i++) {
                        const lineY = activeSeries.priceToCoordinate(horizontalLines[i]);
                        if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                            if (i === selectedHorizontalLineIndex) {
                                // Check if clicked the delete button at the right edge
                                if (x >= maxContentX - HITBOX_HLINE_DEL) {
                                    horizontalLines.splice(i, 1);
                                    selectedHorizontalLineIndex = -1;
                                    canvas.style.cursor = 'default';
                                    canvas.style.pointerEvents = 'none';
                                    renderFib();
                                    notifyHorizontalLinesChanged();
                                    return;
                                }
                                // Otherwise start vertical dragging
                                dragHorizontalLineIndex = i;
                                isPointerDown = true;
                                canvas.setPointerCapture?.(e.pointerId);
                                if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                canvas.style.cursor = 'ns-resize';
                                return;
                            } else {
                                // In non-edit mode: tap to enter edit mode!
                                selectedHorizontalLineIndex = i;
                                selectedTrendlineIndex = -1;
                                isFibSelected = false;
                                canvas.style.cursor = 'default';
                                renderFib();
                                return;
                            }
                        }
                    }
                }

                // 0.2 Trendline Placement (Two-Click Drawing Mode)
                if (isDrawingTrendline) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        if (trendlineDrawState === 1) {
                            // Click 1: Anchor 1 placed
                            tempTrendlineP1 = { time, price };
                            tempTrendlineP2 = { time, price };
                            trendlineDrawState = 2; // Waiting for Anchor 2
                            isPointerDown = true;
                            canvas.setPointerCapture?.(e.pointerId);
                            if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                            renderFib();
                            return;
                        } else if (trendlineDrawState === 2) {
                            // Click 2: Anchor 2 placed -> Lock trendline
                            if (tempTrendlineP1) {
                                let finalTime = time;
                                let finalPrice = price;
                                if (globalAngleLock) {
                                    const activeSeries = candleSeries || areaSeries;
                                    if (activeSeries && chart) {
                                        const ox = chart.timeScale().timeToCoordinate(tempTrendlineP1.time);
                                        const oy = activeSeries.priceToCoordinate(tempTrendlineP1.price);
                                        if (ox !== null && oy !== null) {
                                            const snapped = snapCoordinateTo45Degrees(ox, oy, clampedX, y);
                                            const st = getTimeAtX(snapped.x);
                                            const sp = getPriceAtY(snapped.y);
                                            if (st && sp !== null) {
                                                finalTime = st;
                                                finalPrice = sp;
                                            }
                                        }
                                    }
                                }
                                const newLine = {
                                    id: 'tl_' + Date.now(),
                                    p1: tempTrendlineP1,
                                    p2: { time: finalTime, price: finalPrice },
                                    color: '#7C4DFF',
                                    width: 2,
                                    style: 'solid',
                                    opacity: 1.0,
                                    textColor: '#FFFFFF',
                                    lockAngle: false
                                };
                                trendlines.push(newLine);
                                globalAngleLock = false;
                                selectedTrendlineIndex = trendlines.length - 1; // Enter edit mode upon placement
                                isDrawingTrendline = false;
                                trendlineDrawState = 0;
                                tempTrendlineP1 = null;
                                tempTrendlineP2 = null;
                                crosshairPos = null;
                                isPointerDown = false;
                                try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                                if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                                canvas.style.cursor = 'default';
                                canvas.style.pointerEvents = 'none';
                                showTrendlineToolbar(selectedTrendlineIndex);
                                renderFib();
                                notifyTrendlinesChanged();
                                if (window.flutter_inappwebview?.callHandler) {
                                    window.flutter_inappwebview.callHandler('onTrendlineAdded', newLine);
                                }
                                window.parent?.postMessage(JSON.stringify({ type: 'onTrendlineAdded', payload: newLine }), '*');
                                return;
                            }
                        }
                    }
                    return;
                }

                // 0.25 Rectangle Placement (Two-Click Drawing Mode)
                if (isDrawingRectangle) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        if (rectangleDrawState === 1) {
                            // Click 1: Anchor 1 placed
                            tempRectangleP1 = { time, price };
                            tempRectangleP2 = { time, price };
                            rectangleDrawState = 2; // Waiting for Anchor 2
                            isPointerDown = true;
                            canvas.setPointerCapture?.(e.pointerId);
                            if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                            renderFib();
                            return;
                        } else if (rectangleDrawState === 2) {
                            // Click 2: Anchor 2 placed -> Lock rectangle
                            if (tempRectangleP1) {
                                const newRect = {
                                    id: 'rect_' + Date.now(),
                                    p1: tempRectangleP1,
                                    p2: { time, price }
                                };
                                rectangles.push(newRect);
                                selectedRectangleIndex = rectangles.length - 1; // Enter edit mode upon placement
                                selectedTrendlineIndex = -1;
                                selectedHorizontalLineIndex = -1;
                                isFibSelected = false;
                                isDrawingRectangle = false;
                                rectangleDrawState = 0;
                                tempRectangleP1 = null;
                                tempRectangleP2 = null;
                                crosshairPos = null;
                                isPointerDown = false;
                                try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                                if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                                canvas.style.cursor = 'default';
                                canvas.style.pointerEvents = 'none';
                                renderFib();
                                notifyRectanglesChanged();
                                if (window.flutter_inappwebview?.callHandler) {
                                    window.flutter_inappwebview.callHandler('onRectangleAdded', newRect);
                                }
                                window.parent?.postMessage(JSON.stringify({ type: 'onRectangleAdded', payload: newRect }), '*');
                                return;
                            }
                        }
                    }
                    return;
                }

                // 0.26 Check if clicking on an existing Rectangle (action pill delete button, corner anchors, or body)
                if (rectangles && rectangles.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < rectangles.length; i++) {
                        const r = rectangles[i];
                        const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                        const y1 = activeSeries.priceToCoordinate(r.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                        const y2 = activeSeries.priceToCoordinate(r.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            const left = Math.min(x1, x2);
                            const right = Math.max(x1, x2);
                            const top = Math.min(y1, y2);
                            const bottom = Math.max(y1, y2);

                            if (i === selectedRectangleIndex) {
                                // Floating context action pill tap
                                const pillPos = getRectangleActionPillPos(left, top, right, bottom, maxContentX, chartContainer.clientHeight);
                                if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_RECT_DEL) {
                                    rectangles.splice(i, 1);
                                    selectedRectangleIndex = -1;
                                    canvas.style.cursor = 'default';
                                    canvas.style.pointerEvents = 'none';
                                    renderFib();
                                    notifyRectanglesChanged();
                                    return;
                                }
                                // Corner 1 grab (p1)
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_RECT_CORNER) {
                                    dragRectangleIndex = i;
                                    dragRectanglePart = 1;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'crosshair';
                                    return;
                                }
                                // Corner 2 grab (p2)
                                if (Math.hypot(x - x2, y - y2) <= HITBOX_RECT_CORNER) {
                                    dragRectangleIndex = i;
                                    dragRectanglePart = 2;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'crosshair';
                                    return;
                                }
                                // Corner 3 grab (x1, y2)
                                if (Math.hypot(x - x1, y - y2) <= HITBOX_RECT_CORNER) {
                                    dragRectangleIndex = i;
                                    dragRectanglePart = 4;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'crosshair';
                                    return;
                                }
                                // Corner 4 grab (x2, y1)
                                if (Math.hypot(x - x2, y - y1) <= HITBOX_RECT_CORNER) {
                                    dragRectangleIndex = i;
                                    dragRectanglePart = 5;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'crosshair';
                                    return;
                                }
                                // Body translation
                                if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                    dragRectangleIndex = i;
                                    dragRectanglePart = 3;
                                    dragRectangleStartPos = {
                                        x, y,
                                        origP1: { time: r.p1.time, price: r.p1.price },
                                        origP2: { time: r.p2.time, price: r.p2.price }
                                    };
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                // Tap to enter Edit Mode
                                if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                    selectedRectangleIndex = i;
                                    selectedTrendlineIndex = -1;
                                    selectedHorizontalLineIndex = -1;
                                    isFibSelected = false;
                                    dragRectangleIndex = i;
                                    dragRectanglePart = 3;
                                    dragRectangleStartPos = {
                                        x, y,
                                        origP1: { time: r.p1.time, price: r.p1.price },
                                        origP2: { time: r.p2.time, price: r.p2.price }
                                    };
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'move';
                                    renderFib();
                                    return;
                                }
                            }
                        }
                    }
                }

                // 0.3 Check if clicking on an existing Trendline (midpoint delete button, anchors, or body)
                if (trendlines && trendlines.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < trendlines.length; i++) {
                        const t = trendlines[i];
                        if (t.hidden) continue;
                        const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                        const y1 = activeSeries.priceToCoordinate(t.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                        const y2 = activeSeries.priceToCoordinate(t.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            if (i === selectedTrendlineIndex) {
                                if (t.isLocked) {
                                    showTrendlineToolbar(i);
                                    return;
                                }
                                // Anchor 1 grab
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR) {
                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 1;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'grabbing';
                                    showTrendlineToolbar(i);
                                    return;
                                }
                                // Anchor 2 grab
                                if (Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 2;
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'grabbing';
                                    showTrendlineToolbar(i);
                                    return;
                                }
                                // Line body grab (parallel translation)
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    dragTrendlineIndex = i;
                                    dragTrendlinePart = 3;
                                    dragTrendlineStartPos = {
                                        x, y,
                                        origP1: { time: t.p1.time, price: t.p1.price },
                                        origP2: { time: t.p2.time, price: t.p2.price }
                                    };
                                    isPointerDown = true;
                                    canvas.setPointerCapture?.(e.pointerId);
                                    if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                    canvas.style.cursor = 'move';
                                    showTrendlineToolbar(i);
                                    return;
                                }
                            } else {
                                // Click on unselected trendline body to select into Edit Mode!
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    selectedTrendlineIndex = i;
                                    selectedRectangleIndex = -1;
                                    selectedHorizontalLineIndex = -1;
                                    isFibSelected = false;
                                    if (!t.isLocked) {
                                        dragTrendlineIndex = i;
                                        dragTrendlinePart = 3;
                                        dragTrendlineStartPos = {
                                            x, y,
                                            origP1: { time: t.p1.time, price: t.p1.price },
                                            origP2: { time: t.p2.time, price: t.p2.price }
                                        };
                                        isPointerDown = true;
                                        canvas.setPointerCapture?.(e.pointerId);
                                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                        canvas.style.cursor = 'move';
                                    }
                                    showTrendlineToolbar(i);
                                    renderFib();
                                    return;
                                }
                            }
                        }
                    }
                }

                // 1. Check if clicking on an existing anchor handle to reposition (Fib)
                if (fibDrawState === 0 && fibPoint1 && fibPoint2) {
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = candleSeries.priceToCoordinate(fibPoint1.price);
                    const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                    const y2 = candleSeries.priceToCoordinate(fibPoint2.price);

                    if (x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR) {
                        dragMode = 1;
                        isPointerDown = true;
                        canvas.setPointerCapture?.(e.pointerId);
                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                        renderFib();
                        return;
                    }
                    if (x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR) {
                        dragMode = 2;
                        isPointerDown = true;
                        canvas.setPointerCapture?.(e.pointerId);
                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                        renderFib();
                        return;
                    }
                }

                // 2. Click 1: Place Anchor 1 (Fib)
                if (fibDrawState === 1) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint1 = { time, price };
                        fibPoint2 = { time, price };
                        fibDrawState = 2; // Now waiting for click 2 (Anchor 2)
                        isPointerDown = true;
                        canvas.setPointerCapture?.(e.pointerId);
                        if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                        renderFib();
                    }
                    return;
                }

                // 3. Click 2: Place Anchor 2 (Fib - No hold required!)
                if (fibDrawState === 2) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint2 = { time, price };
                        fibDrawState = 0;
                        isDrawingFib = false;
                        isFibSelected = true;
                        isPointerDown = false;
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        renderFib();

                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onFibDrawn', true);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: true }), '*');
                    }
