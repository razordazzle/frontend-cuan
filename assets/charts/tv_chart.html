                        ctx.lineTo(delCenterX - 1.4, delCenterY + 3);
                        ctx.moveTo(delCenterX + 1.4, delCenterY - 1);
                        ctx.lineTo(delCenterX + 1.4, delCenterY + 3);
                        ctx.stroke();

                        ctx.restore();
                    } else {
                        // NON-EDIT MODE: Clean, subtle price pill without delete button
                        const badgeX = maxContentX - badgeWidth - 6;
                        const badgeY = y - (badgeHeight / 2);

                        ctx.fillStyle = 'rgba(0, 229, 255, 0.9)';
                        if (ctx.roundRect) {
                            ctx.beginPath();
                            ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, 4);
                            ctx.fill();
                        } else {
                            ctx.fillRect(badgeX, badgeY, badgeWidth, badgeHeight);
                        }

                        ctx.fillStyle = '#051B24';
                        ctx.fillText(text, badgeX + 5, y);
                    }
                }
                ctx.restore();
            }

            // 1.5 Render Trendlines
            if (trendlines && trendlines.length > 0 && chart) {
                ctx.save();
                for (let i = 0; i < trendlines.length; i++) {
                    const t = trendlines[i];
                    if (t.hidden) continue;
                    const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                    const y1 = activeSeries.priceToCoordinate(t.p1.price);
                    const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                    const y2 = activeSeries.priceToCoordinate(t.p2.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;

                    const isSelected = (i === selectedTrendlineIndex);
                    const lineColor = t.color || '#7C4DFF';
                    const lineWidth = t.width || 2;
                    const lineStyle = t.style || 'solid';
                    const lineOpacity = (t.opacity !== undefined) ? t.opacity : 1.0;

                    // Dash pattern
                    if (lineStyle === 'dashed') {
                        ctx.lineCap = 'butt';
                        ctx.setLineDash([Math.max(6, lineWidth * 3), Math.max(4, lineWidth * 2)]);
                    } else if (lineStyle === 'dotted') {
                        ctx.lineCap = 'round';
                        ctx.setLineDash([0, Math.max(6, lineWidth * 2.5)]);
                    } else {
                        ctx.lineCap = 'round';
                        ctx.setLineDash([]);
                    }

                    ctx.beginPath();
                    ctx.strokeStyle = hexToRgba(lineColor, lineOpacity);
                    ctx.lineWidth = lineWidth;
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.setLineDash([]); // Reset dash for anchors & labels

                    // Render optional text label
                    if (t.text) {
                        ctx.save();
                        const fontSize = t.textSize || 14;
                        const isBold = !!t.textBold;
                        const isItalic = !!t.textItalic;
                        ctx.font = `${isItalic ? 'italic ' : ''}${isBold ? 'bold ' : '500 '}${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                        ctx.fillStyle = t.textColor || '#FFFFFF';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                        ctx.shadowBlur = 4;

                        // Normalize anchors left to right for positioning
                        let leftX = x1, leftY = y1, rightX = x2, rightY = y2;
                        if (leftX > rightX) {
                            leftX = x2; leftY = y2;
                            rightX = x1; rightY = y1;
                        }

                        const halign = t.textHalign || 'center';
                        let baseX = (leftX + rightX) / 2;
                        let baseY = (leftY + rightY) / 2;

                        if (halign === 'left') {
                            baseX = leftX + 16;
                            const progress = Math.min(1, 16 / Math.max(1, rightX - leftX));
                            baseY = leftY + (rightY - leftY) * progress;
                            ctx.textAlign = 'left';
                        } else if (halign === 'right') {
                            baseX = rightX - 16;
                            const progress = Math.max(0, 1 - (16 / Math.max(1, rightX - leftX)));
                            baseY = leftY + (rightY - leftY) * progress;
                            ctx.textAlign = 'right';
                        } else {
                            ctx.textAlign = 'center';
                        }

                        const valign = t.textValign || 'top';
                        const lines = String(t.text).split('\n');
                        const lineHeight = Math.round(fontSize * 1.3);

                        let startY = baseY;
                        if (valign === 'top') {
                            // Position above line
                            startY = baseY - 8 - ((lines.length - 1) * lineHeight);
                            ctx.textBaseline = 'bottom';
                        } else if (valign === 'bottom') {
                            // Position below line
                            startY = baseY + 12;
                            ctx.textBaseline = 'top';
                        } else {
                            // Middle
                            const totalH = lines.length * lineHeight;
                            startY = baseY - (totalH / 2) + (lineHeight / 2);
                            ctx.textBaseline = 'middle';
                        }

                        for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
                            ctx.fillText(lines[lineIdx], baseX, startY + (lineIdx * lineHeight));
                        }
                        ctx.restore();
                    }

                    // Render optional angle
                    if (t.showAngle) {
                        const deg = getTrendlineAngle(t);
                        ctx.save();
                        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                        ctx.fillStyle = lineColor;
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                        ctx.shadowBlur = 3;
                        ctx.fillText(deg + '°', x2 + 10, y2);
                        ctx.restore();
                    }

                    // Only render anchor handles when in EDIT MODE (isSelected)
                    if (isSelected) {
                        // Anchor 1 handle
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x1, y1, 8, 0, Math.PI * 2);
                        ctx.fillStyle = hexToRgba(lineColor, 0.25);
                        ctx.fill();
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(x1, y1, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x1, y1, 2, 0, Math.PI * 2);
                        ctx.fillStyle = lineColor;
                        ctx.fill();
                        ctx.restore();

                        // Anchor 2 handle
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x2, y2, 8, 0, Math.PI * 2);
                        ctx.fillStyle = hexToRgba(lineColor, 0.25);
                        ctx.fill();
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(x2, y2, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x2, y2, 2, 0, Math.PI * 2);
                        ctx.fillStyle = lineColor;
                        ctx.fill();
                        ctx.restore();
                    }
                }
                ctx.restore();
            }

            // 1.6 Render Trendline Live Rubber-band Preview during Anchor 2 aiming
            if (isDrawingTrendline && trendlineDrawState === 2 && tempTrendlineP1 && tempTrendlineP2 && chart) {
                const x1 = chart.timeScale().timeToCoordinate(tempTrendlineP1.time);
                const y1 = activeSeries.priceToCoordinate(tempTrendlineP1.price);
                const x2 = chart.timeScale().timeToCoordinate(tempTrendlineP2.time);
                const y2 = activeSeries.priceToCoordinate(tempTrendlineP2.price);
                if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                    ctx.save();
                    // Live rubber band line
                    ctx.beginPath();
                    ctx.strokeStyle = '#7C4DFF';
                    ctx.lineWidth = 2.0;
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    // Anchor 1
                    ctx.fillStyle = '#7C4DFF';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Live cursor Anchor 2
                    ctx.fillStyle = '#7C4DFF';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 1.7 Render Rectangles (Box Area - Supply/Demand, Consolidation)
            if (rectangles && rectangles.length > 0 && chart) {
                ctx.save();
                for (let i = 0; i < rectangles.length; i++) {
                    const r = rectangles[i];
                    const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                    const y1 = activeSeries.priceToCoordinate(r.p1.price);
                    const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                    const y2 = activeSeries.priceToCoordinate(r.p2.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;

                    const left = Math.min(x1, x2);
                    const right = Math.max(x1, x2);
                    const top = Math.min(y1, y2);
                    const bottom = Math.max(y1, y2);
                    const boxW = Math.max(1, right - left);
                    const boxH = Math.max(1, bottom - top);

                    const isSelected = (i === selectedRectangleIndex);

                    // Translucent fill
                    ctx.fillStyle = isSelected ? 'rgba(171, 71, 188, 0.22)' : 'rgba(171, 71, 188, 0.14)';
                    ctx.fillRect(left, top, boxW, boxH);

                    // Solid border
                    ctx.beginPath();
                    ctx.strokeStyle = '#AB47BC';
                    ctx.lineWidth = isSelected ? 2.0 : 1.5;
                    ctx.strokeRect(left, top, boxW, boxH);

                    // EDIT MODE: 4 Corner handles and Floating Action Pill
                    if (isSelected) {
                        const corners = [
                            { x: left, y: top },
                            { x: right, y: top },
                            { x: right, y: bottom },
                            { x: left, y: bottom }
                        ];

                        corners.forEach(c => {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                            ctx.fillStyle = 'rgba(171, 71, 188, 0.3)';
                            ctx.fill();
                            ctx.strokeStyle = '#AB47BC';
                            ctx.lineWidth = 1.5;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(c.x, c.y, 3.5, 0, Math.PI * 2);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(c.x, c.y, 1.8, 0, Math.PI * 2);
                            ctx.fillStyle = '#AB47BC';
                            ctx.fill();
                            ctx.restore();
                        });

                        // Floating Context Action Pill
                        const pillPos = getRectangleActionPillPos(left, top, right, bottom, maxContentX, height);
                        const px = pillPos.x;
                        const py = pillPos.y;

                        ctx.save();
                        // Capsule shadow
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                        ctx.shadowBlur = 8;
                        ctx.shadowOffsetY = 2;

                        const pw = 40;
                        const ph = 28;
                        const pr = 14;
                        const pillLeft = px - (pw / 2);
                        const pillTop = py - (ph / 2);

                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(pillLeft, pillTop, pw, ph, pr);
                        } else {
                            ctx.arc(pillLeft + pr, py, pr, Math.PI / 2, Math.PI * 1.5);
                            ctx.lineTo(pillLeft + pw - pr, pillTop);
                            ctx.arc(pillLeft + pw - pr, py, pr, -Math.PI / 2, Math.PI / 2);
                            ctx.lineTo(pillLeft + pr, pillTop + ph);
                        }
                        ctx.fillStyle = '#1E222D';
                        ctx.fill();

                        // Border stroke
                        ctx.shadowColor = 'transparent';
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
                        ctx.lineWidth = 1.2;
                        ctx.stroke();

                        // Vector Trash Can Icon inside pill
                        ctx.save();
                        ctx.strokeStyle = '#EF5350';
                        ctx.lineWidth = 1.6;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        // Lid handle
                        ctx.beginPath();
                        ctx.moveTo(px - 2.5, py - 6);
                        ctx.lineTo(px + 2.5, py - 6);
                        ctx.stroke();

                        // Lid rim
                        ctx.beginPath();
                        ctx.moveTo(px - 6.5, py - 4);
                        ctx.lineTo(px + 6.5, py - 4);
                        ctx.stroke();

                        // Can body
                        ctx.beginPath();
                        ctx.moveTo(px - 5, py - 3);
                        ctx.lineTo(px - 4, py + 5.5);
                        ctx.lineTo(px + 4, py + 5.5);
                        ctx.lineTo(px + 5, py - 3);
                        ctx.stroke();

                        // 2 inner ribs
                        ctx.beginPath();
                        ctx.moveTo(px - 1.8, py - 1.5);
                        ctx.lineTo(px - 1.8, py + 3.5);
                        ctx.moveTo(px + 1.8, py - 1.5);
                        ctx.lineTo(px + 1.8, py + 3.5);
                        ctx.stroke();

                        ctx.restore();
                        ctx.restore();
                    }
                }
                ctx.restore();
            }

            // 1.8 Render Rectangle Live Rubber-band Preview during Corner 2 aiming
            if (isDrawingRectangle && rectangleDrawState === 2 && tempRectangleP1 && tempRectangleP2 && chart) {
                const x1 = chart.timeScale().timeToCoordinate(tempRectangleP1.time);
                const y1 = activeSeries.priceToCoordinate(tempRectangleP1.price);
                const x2 = chart.timeScale().timeToCoordinate(tempRectangleP2.time);
                const y2 = activeSeries.priceToCoordinate(tempRectangleP2.price);
                if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                    ctx.save();
                    const left = Math.min(x1, x2);
                    const right = Math.max(x1, x2);
                    const top = Math.min(y1, y2);
                    const bottom = Math.max(y1, y2);
                    const boxW = Math.max(1, right - left);
                    const boxH = Math.max(1, bottom - top);

                    // Fill preview
                    ctx.fillStyle = 'rgba(171, 71, 188, 0.16)';
                    ctx.fillRect(left, top, boxW, boxH);

                    // Dashed border preview
                    ctx.beginPath();
                    ctx.setLineDash([5, 4]);
                    ctx.strokeStyle = '#AB47BC';
                    ctx.lineWidth = 1.8;
                    ctx.strokeRect(left, top, boxW, boxH);
                    ctx.setLineDash([]);

                    // Corner 1 dot
                    ctx.fillStyle = '#AB47BC';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Corner 2 (cursor) dot
                    ctx.fillStyle = '#AB47BC';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // 2. Render Fibonacci Retracement
            if (!currentShowFib) return;

            if (isDrawingFib) {
                // If Anchor 1 is set and waiting for Anchor 2, render Anchor 1 handle
                if (fibPoint1 && fibDrawState === 2 && (!fibPoint2 || Math.abs(fibPoint2.price - fibPoint1.price) < 0.001)) {
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = candleSeries.priceToCoordinate(fibPoint1.price);
                    if (x1 !== null && y1 !== null) {
                        ctx.fillStyle = '#FFB300';
                        ctx.beginPath();
                        ctx.arc(x1, y1, 7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(x1, y1, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    return;
                }
            }

            if (!fibPoint1 || !fibPoint2) return;

            const priceDiff = fibPoint1.price - fibPoint2.price;
            if (Math.abs(priceDiff) < 0.001) return;

            const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
            const y1 = candleSeries.priceToCoordinate(fibPoint1.price);
            const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
            const y2 = candleSeries.priceToCoordinate(fibPoint2.price);

            if (x1 === null || y1 === null || x2 === null || y2 === null) return;

            // In TradingView: Horizontal lines span between the X coordinates of the anchors!
            const minX = Math.min(x1, x2);
            const maxX = Math.max(x1, x2);
            const lineStartX = Math.max(0, Math.min(minX, maxContentX));
            const lineEndX = Math.min(maxContentX, Math.max(minX + 40, maxX));
            const lineWidth = Math.max(0, lineEndX - lineStartX);

            // Calculate Y positions for all levels:
            // Anchor 2 = 0.00% (end of move)
            // Anchor 1 = 100.00% (origin of move)
            // price = p2 + (p1 - p2) * level
            const levelYs = [];
            for (let i = 0; i < FIB_LEVELS.length; i++) {
                const item = FIB_LEVELS[i];
                const price = fibPoint2.price + (priceDiff * item.level);
                const y = candleSeries.priceToCoordinate(price);
                levelYs.push({ ...item, price, y });
            }

            // Draw filled zones between levels (from lineStartX to lineEndX)
            // Sort by level to get consecutive bands
            const sortedLevels = [...levelYs].sort((a, b) => b.level - a.level);
            for (let i = 0; i < sortedLevels.length - 1; i++) {
                const curr = sortedLevels[i];
                const next = sortedLevels[i + 1];
                if (curr.y !== null && next.y !== null && curr.fill !== 'transparent') {
                    ctx.fillStyle = curr.fill;
                    const topY = Math.min(curr.y, next.y);
                    const bandHeight = Math.abs(curr.y - next.y);
                    ctx.fillRect(lineStartX, topY, lineWidth, bandHeight);
                }
            }

            // Draw level lines and TradingView-style clean text labels
            ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
            ctx.textBaseline = 'bottom';

            for (let i = 0; i < levelYs.length; i++) {
                const item = levelYs[i];
                if (item.y === null || item.y < 0 || item.y > height) continue;

                // Horizontal line (between anchors)
                ctx.beginPath();
                ctx.strokeStyle = item.color;
                ctx.lineWidth = 1.0;
                ctx.moveTo(lineStartX, item.y);
                ctx.lineTo(lineEndX, item.y);
                ctx.stroke();

                // TradingView label text: positioned at lineStartX above the line
                const priceFormatted = item.price >= 1000
                    ? Math.round(item.price).toLocaleString('en-US')
                    : item.price.toFixed(2);
                const text = `${item.label} (${priceFormatted})`;

                ctx.fillStyle = item.color;
                ctx.fillText(text, lineStartX + 4, item.y - 3);
            }

            // In Edit mode, show guideline and prominent grab handles; in non-edit mode, show subtle minimal endpoint dots
            if (isFibSelected) {
                // Trendline connecting Anchor 1 and Anchor 2
                ctx.beginPath();
                ctx.strokeStyle = '#9E9E9E';
                ctx.lineWidth = 1.4;
                ctx.setLineDash([5, 4]);
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
                ctx.setLineDash([]);

                // Anchor 1 Handle (Edit mode: large ergonomic grab handle)
                const isA1Active = (dragMode === 1);
                ctx.save();
                ctx.beginPath();
                ctx.arc(x1, y1, isA1Active ? 12 : 9, 0, Math.PI * 2);
                ctx.fillStyle = isA1Active ? 'rgba(255, 179, 0, 0.45)' : 'rgba(255, 179, 0, 0.25)';
                ctx.fill();
                ctx.strokeStyle = '#FFB300';
                ctx.lineWidth = isA1Active ? 2 : 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x1, y1, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x1, y1, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFB300';
                ctx.fill();
                ctx.restore();

                // Anchor 2 Handle (Edit mode: large ergonomic grab handle)
                const isA2Active = (dragMode === 2);
                ctx.save();
                ctx.beginPath();
                ctx.arc(x2, y2, isA2Active ? 12 : 9, 0, Math.PI * 2);
                ctx.fillStyle = isA2Active ? 'rgba(255, 179, 0, 0.45)' : 'rgba(255, 179, 0, 0.25)';
                ctx.fill();
                ctx.strokeStyle = '#FFB300';
                ctx.lineWidth = isA2Active ? 2 : 1.5;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x2, y2, 4.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFFFFF';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x2, y2, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFB300';
                ctx.fill();
                ctx.restore();
            } else {
                // Non-Edit Mode: Small, clean, non-intrusive endpoint dots
                ctx.save();
                ctx.beginPath();
                ctx.arc(x1, y1, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFB300';
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 1.0;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x2, y2, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = '#FFB300';
                ctx.fill();
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 1.0;
                ctx.stroke();
                ctx.restore();
            }

            } finally {
                // Restore clipping state
                ctx.restore();
            }
        }

        function setFibonacci(showFib) {
            currentShowFib = Boolean(showFib);
            const canvas = document.getElementById('fib-canvas');
            if (currentShowFib) {
                if (!fibPoint1 || !fibPoint2) {
                    startFibDrawing();
                } else {
                    renderFib();
                }
            } else {
                isDrawingFib = false;
                fibDrawState = 0;
                fibPoint1 = null;
                fibPoint2 = null;
                if (canvas) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                }
                renderFib();
            }
        }

        function clearFibonacci() {
            setFibonacci(false);
        }

        function resetFibonacci() {
            startFibDrawing();
        }

        function startFibDrawing() {
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            cancelTrendlineDrawing();
            cancelRectangleDrawing();
            isDrawingFib = true;
            currentShowFib = true;
            fibPoint1 = null;
            fibPoint2 = null;
            fibDrawState = 1; // Waiting for Anchor 1 click
            dragMode = 0;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            renderFib();
        }

        function startHorizontalLineDrawing() {
            isDrawingFib = false;
            fibDrawState = 0;
            selectedHorizontalLineIndex = -1;
            cancelTrendlineDrawing();
            cancelRectangleDrawing();
            isDrawingHorizontalLine = true;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
        }

        function cancelHorizontalLineDrawing() {
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            crosshairPos = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingTrendline && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            renderFib();
        }

        function setHorizontalLines(linesInput) {
            const lines = typeof linesInput === 'string' ? JSON.parse(linesInput) : linesInput;
            horizontalLines = Array.isArray(lines) ? lines : [];
            if (selectedHorizontalLineIndex >= horizontalLines.length) {
                selectedHorizontalLineIndex = -1;
            }
            renderFib();
        }

        function clearHorizontalLines() {
            horizontalLines = [];
            selectedHorizontalLineIndex = -1;
            isDrawingHorizontalLine = false;
            crosshairPos = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingTrendline && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            renderFib();
            notifyHorizontalLinesChanged();
        }

        function startTrendlineDrawing() {
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            isDrawingFib = false;
            fibDrawState = 0;
            selectedTrendlineIndex = -1;
            globalAngleLock = false;
            hideTrendlineToolbar();
            cancelRectangleDrawing();
            isDrawingTrendline = true;
            trendlineDrawState = 1; // Waiting for Anchor 1 click
            tempTrendlineP1 = null;
            tempTrendlineP2 = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            renderFib();
        }

        function cancelTrendlineDrawing() {
            isDrawingTrendline = false;
            trendlineDrawState = 0;
            tempTrendlineP1 = null;
            tempTrendlineP2 = null;
            crosshairPos = null;
            selectedTrendlineIndex = -1;
            globalAngleLock = false;
            hideTrendlineToolbar();
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingHorizontalLine && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
            renderFib();
        }

        function setTrendlines(linesInput) {
            const lines = typeof linesInput === 'string' ? JSON.parse(linesInput) : linesInput;
            trendlines = Array.isArray(lines) ? lines : [];
            if (selectedTrendlineIndex >= trendlines.length) {
                selectedTrendlineIndex = -1;
                hideTrendlineToolbar();
            } else if (selectedTrendlineIndex >= 0) {
                showTrendlineToolbar(selectedTrendlineIndex);
            }
            renderFib();
        }

        function clearTrendlines() {
            trendlines = [];
            selectedTrendlineIndex = -1;
            globalAngleLock = false;
            hideTrendlineToolbar();
            cancelTrendlineDrawing();
            notifyTrendlinesChanged();
        }

        function startRectangleDrawing() {
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            isDrawingFib = false;
            fibDrawState = 0;
            cancelTrendlineDrawing();
            selectedRectangleIndex = -1;
            isDrawingRectangle = true;
            rectangleDrawState = 1; // Waiting for Corner 1 click
            tempRectangleP1 = null;
            tempRectangleP2 = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            renderFib();
        }

        function cancelRectangleDrawing() {
            isDrawingRectangle = false;
            rectangleDrawState = 0;
            tempRectangleP1 = null;
            tempRectangleP2 = null;
            crosshairPos = null;
            selectedRectangleIndex = -1;
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingHorizontalLine && !isDrawingTrendline) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
            renderFib();
        }

        function setRectangles(rectsInput) {
            const rects = typeof rectsInput === 'string' ? JSON.parse(rectsInput) : rectsInput;
            rectangles = Array.isArray(rects) ? rects : [];
            if (selectedRectangleIndex >= rectangles.length) {
                selectedRectangleIndex = -1;
            }
            renderFib();
        }

        function clearRectangles() {
            rectangles = [];
            selectedRectangleIndex = -1;
            cancelRectangleDrawing();
            notifyRectanglesChanged();
        }

        function clearAllDrawings() {
            clearFibonacci();
            clearHorizontalLines();
            clearTrendlines();
            clearRectangles();
        }

        function initChart(upColor, downColor, gridColor, interactive, crosshairColor) {
            if (chart) return;
            upColor = upColor || '#21C07A';
            downColor = downColor || '#E53935';
            gridColor = gridColor || 'rgba(128, 128, 128, 0.15)';
            if (interactive === undefined || interactive === null) interactive = true;
            if (crosshairColor) currentCrosshairColor = crosshairColor;

            const container = document.getElementById('chart');
            if (!container) return;

            chart = LightweightCharts.createChart(container, {
                autoSize: true,
                layout: {
                    background: { color: 'transparent' },
                    textColor: '#9aa0a6',
                    fontSize: 11,
                    panes: {
                        enableResize: true,
                        separatorColor: 'rgba(128, 128, 128, 0.25)',
                        separatorHoverColor: '#2962FF',
                    },
                },
                grid: {
                    vertLines: { color: gridColor },
                    horzLines: { color: gridColor },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                    borderVisible: false,
                    rightOffset: 5,
                    barSpacing: 8,
                    minBarSpacing: 3,
                },
                rightPriceScale: {
                    borderVisible: false,
                    scaleMargins: { top: 0.08, bottom: 0.08 },
                    autoScale: true,
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        visible: interactive,
                        labelVisible: interactive,
                        color: currentCrosshairColor,
                        width: 1,
                        style: LightweightCharts.LineStyle.LargeDashed,
                        labelBackgroundColor: '#2962FF',
                    },
                    horzLine: {
                        visible: interactive,
                        labelVisible: interactive,
                        color: currentCrosshairColor,
                        width: 1,
                        style: LightweightCharts.LineStyle.LargeDashed,
                        labelBackgroundColor: '#2962FF',
                    },
                },
                handleScroll: interactive ? {
                    mouseWheel: true,
                    pressedMouseMove: true,
                    horzTouchDrag: true,
                    vertTouchDrag: true,
                } : false,
                handleScale: interactive ? {
                    axisPressedMouseMove: {
                        time: true,
                        price: true,
                    },
                    axisDoubleClickReset: {
                        time: true,
                        price: true,
                    },
                    mouseWheel: true,
                    pinch: true,
                } : false,
            });

            candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: upColor,
                downColor: downColor,
                borderVisible: false,
                wickUpColor: upColor,
                wickDownColor: downColor,
                priceFormat: { type: 'price', precision: 0, minMove: 1 },
            }, 0);

            areaSeries = chart.addSeries(LightweightCharts.AreaSeries, {
                lineColor: upColor,
                topColor: upColor + '55',
                bottomColor: upColor + '05',
                lineWidth: 2,
            }, 0);

            // Initialize SMA series in pane 0
            smaSeries = chart.addSeries(LightweightCharts.LineSeries, {
                color: '#2962FF',
                lineWidth: 2,
                title: 'SMA 20',
                visible: currentShowSma,
            }, 0);

            setSeriesType(currentType);
            updatePanes();

            chart.subscribeCrosshairMove(param => {
                if (!param.time) {
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onCrosshair', null);
                    }
                    window.parent?.postMessage(JSON.stringify({ type: 'onCrosshair', payload: null }), '*');
                    return;
                }
                const bar = param.seriesData.get(candleSeries) || param.seriesData.get(areaSeries);
                if (bar) {
                    const payloadStr = JSON.stringify({ time: param.time, ...bar });
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onCrosshair', payloadStr);
                    }
                    window.parent?.postMessage(JSON.stringify({ type: 'onCrosshair', payload: payloadStr }), '*');
                }
            });

            // Subscriptions to keep Fibonacci canvas locked with chart movements at 60fps
            chart.timeScale().subscribeVisibleTimeRangeChange(() => renderFib());
            chart.timeScale().subscribeVisibleLogicalRangeChange(() => renderFib());

            // Real-time synchronization during vertical price scale dragging, pinch zoom, & inertia
            let isUserInteractingWithChart = false;
            let priceScaleRafId = null;
            let lastKnownPriceY = null;

            function syncDrawingsOnPriceScaleChange() {
                const activeSeries = candleSeries || areaSeries;
                if (activeSeries && chart) {
                    const testPrice = (rawCandlesData && rawCandlesData.length > 0) ? rawCandlesData[0].close : 1000;
                    const curY = activeSeries.priceToCoordinate(testPrice);
                    if (curY !== null && curY !== lastKnownPriceY) {
                        lastKnownPriceY = curY;
                        renderFib();
                    }
                }
                if (isUserInteractingWithChart) {
                    priceScaleRafId = requestAnimationFrame(syncDrawingsOnPriceScaleChange);
                }
            }

            const chartWrapper = document.getElementById('chart-container');
            if (chartWrapper) {
                chartWrapper.addEventListener('pointerdown', () => {
                    isUserInteractingWithChart = true;
                    if (priceScaleRafId) cancelAnimationFrame(priceScaleRafId);
                    priceScaleRafId = requestAnimationFrame(syncDrawingsOnPriceScaleChange);
                }, { passive: true });

                chartWrapper.addEventListener('touchstart', () => {
                    isUserInteractingWithChart = true;
                    if (priceScaleRafId) cancelAnimationFrame(priceScaleRafId);
                    priceScaleRafId = requestAnimationFrame(syncDrawingsOnPriceScaleChange);
                }, { passive: true });

                chartWrapper.addEventListener('touchmove', () => {
                    renderFib();
                }, { passive: true });

                window.addEventListener('pointerup', () => {
                    isUserInteractingWithChart = false;
                    let decayFrames = 30;
                    function postReleaseSync() {
                        if (isUserInteractingWithChart) return;
                        const activeSeries = candleSeries || areaSeries;
                        if (activeSeries && chart) {
                            const testPrice = (rawCandlesData && rawCandlesData.length > 0) ? rawCandlesData[0].close : 1000;
                            const curY = activeSeries.priceToCoordinate(testPrice);
                            if (curY !== null && curY !== lastKnownPriceY) {
                                lastKnownPriceY = curY;
                                renderFib();
                            }
                        }
                        if (--decayFrames > 0) {
                            requestAnimationFrame(postReleaseSync);
                        }
                    }
                    requestAnimationFrame(postReleaseSync);
                }, { passive: true });

                window.addEventListener('touchend', () => {
                    isUserInteractingWithChart = false;
                }, { passive: true });

                chartWrapper.addEventListener('wheel', () => {
                    renderFib();
                }, { passive: true });
            }

            // Click listener for interactive tap-to-draw
            chart.subscribeClick(param => {
                if (!isDrawingFib || !param.time || !param.point) return;
                const price = candleSeries.coordinateToPrice(param.point.y);
                if (price === null) return;

                if (!fibPoint1) {
                    fibPoint1 = { time: param.time, price: price };
                    renderFib();
                } else {
                    fibPoint2 = { time: param.time, price: price };
                    isDrawingFib = false;
                    isFibSelected = true;
                    renderFib();
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onFibDrawn', JSON.stringify({ p1: fibPoint1, p2: fibPoint2 }));
                    }
                }
            });

            setTimeout(resizeFibCanvas, 100);
            initFibPointerEvents();

            if (pendingData) {
                const p = pendingData;
                pendingData = null;
                setDataWithIndicators(p);
            }
        }

        function setSeriesType(type) {
            currentType = type;
            if (candleSeries) candleSeries.applyOptions({ visible: type === 'candle' });
            if (areaSeries) areaSeries.applyOptions({ visible: type === 'area' });
        }

        function setCrosshairColor(color) {
            if (!color) return;
            currentCrosshairColor = color;
            if (chart) {
                chart.applyOptions({
                    crosshair: {
                        vertLine: {
                            color: color,
                            style: LightweightCharts.LineStyle.LargeDashed,
                        },
                        horzLine: {
                            color: color,
                            style: LightweightCharts.LineStyle.LargeDashed,
                        },
                    }
                });
            }
            renderFib();
        }

        function updatePanes() {
            try {
                if (!chart || !candleSeries) return;

                // Remove series that are toggled off
                if (!currentShowRsi && rsiSeries) {
                    try { chart.removeSeries(rsiSeries); } catch (_) {}
                    rsiSeries = null;
                }
                if (!currentShowVolume && volumeSeries) {
                    try { chart.removeSeries(volumeSeries); } catch (_) {}
                    volumeSeries = null;
                }

                // Determine dynamic pane indices
                let nextPaneIndex = 1;
                let targetRsiPane = null;
                let targetVolumePane = null;

                if (currentShowRsi) {
                    targetRsiPane = nextPaneIndex++;
                }
                if (currentShowVolume) {
                    targetVolumePane = nextPaneIndex++;
                }

                // Create or position RSI series
                if (currentShowRsi) {
                    if (!rsiSeries) {
                        rsiSeries = chart.addSeries(LightweightCharts.LineSeries, {
                            color: '#E91E63',
                            lineWidth: 2,
                            title: 'RSI 14',
                            priceScaleId: 'rsi-scale',
                            priceFormat: {
                                type: 'custom',
                                minMove: 0.01,
                                formatter: (p) => p.toFixed(1),
                            },
                        }, targetRsiPane);

                        rsiSeries.createPriceLine({
                            price: 70,
                            color: 'rgba(233, 30, 99, 0.4)',
                            lineWidth: 1,
                            lineStyle: LightweightCharts.LineStyle.Dashed,
                            axisLabelVisible: true,
                            title: '70',
                        });
                        rsiSeries.createPriceLine({
                            price: 30,
                            color: 'rgba(233, 30, 99, 0.4)',
                            lineWidth: 1,
                            lineStyle: LightweightCharts.LineStyle.Dashed,
                            axisLabelVisible: true,
                            title: '30',
                        });
                        rsiSeries.priceScale().applyOptions({
                            scaleMargins: { top: 0.1, bottom: 0.1 },
                        });

                        if (currentRsiData && currentRsiData.length > 0) {
                            rsiSeries.setData(currentRsiData);
                        }
                    } else if (rsiSeries.getPane && rsiSeries.getPane().paneIndex() !== targetRsiPane) {
                        rsiSeries.moveToPane(targetRsiPane);
                    }
                }

                // Create or position Volume series
                if (currentShowVolume) {
                    if (!volumeSeries) {
                        volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
                            priceFormat: { type: 'volume' },
                            priceScaleId: 'volume-scale',
                            title: 'VOL',
                        }, targetVolumePane);

                        volumeSeries.priceScale().applyOptions({
                            scaleMargins: { top: 0.15, bottom: 0 },
                        });

                        if (currentVolumeData && currentVolumeData.length > 0) {
                            volumeSeries.setData(currentVolumeData);
                        }
                    } else if (volumeSeries.getPane && volumeSeries.getPane().paneIndex() !== targetVolumePane) {
                        volumeSeries.moveToPane(targetVolumePane);
                    }
                }

                // Configure stretch factors based on active panes:
                try {
                    const panes = chart.panes();
                    if (panes && panes.length === 1) {
                        panes[0].setStretchFactor(1);
                    } else if (panes && panes.length === 2) {
                        panes[0].setStretchFactor(4);
                        panes[1].setStretchFactor(1.2);
                    } else if (panes && panes.length >= 3) {
                        panes[0].setStretchFactor(5);
                        panes[1].setStretchFactor(1.4);
                        panes[2].setStretchFactor(1.2);
                    }
                } catch (paneErr) {
                    console.warn("setStretchFactor warning:", paneErr);
                }

                candleSeries.priceScale().applyOptions({
                    scaleMargins: { top: 0.08, bottom: 0.08 }
                });

                renderFib();
            } catch (err) {
                console.error("updatePanes error:", err);
            }
        }

        function setIndicators(showSma, showRsi, showVolume) {
            currentShowSma = Boolean(showSma);
            currentShowRsi = Boolean(showRsi);
            if (showVolume !== undefined && showVolume !== null) {
                currentShowVolume = Boolean(showVolume);
            }

            if (smaSeries) {
                smaSeries.applyOptions({ visible: currentShowSma });
            }

            updatePanes();
        }

        function setData(candlesJson, volumesJson) {
            if (!chart) initChart();
            const candles = typeof candlesJson === 'string' ? JSON.parse(candlesJson) : candlesJson;
            rawCandlesData = candles;
            candleSeries.setData(candles);
            areaSeries.setData(candles.map(c => ({ time: c.time, value: c.close })));
            if (volumesJson) {
                const vols = typeof volumesJson === 'string' ? JSON.parse(volumesJson) : volumesJson;
                currentVolumeData = vols;
                if (volumeSeries) {
                    volumeSeries.setData(vols);
                }
            }
            if (currentShowFib && (!fibPoint1 || !fibPoint2)) {
                startFibDrawing();
            }
            updatePanes();
            chart.timeScale().fitContent();
            renderFib();
        }

        function setDataWithIndicators(payloadInput) {
            if (!chart) {
                pendingData = payloadInput;
                initChart();
                return;
            }

            const payload = typeof payloadInput === 'string' ? JSON.parse(payloadInput) : payloadInput;

            if (payload.candles && Array.isArray(payload.candles) && payload.candles.length > 0) {
                rawCandlesData = payload.candles;
                candleSeries.setData(payload.candles);
                areaSeries.setData(payload.candles.map(c => ({ time: c.time, value: c.close })));

                const volData = payload.candles.map(c => ({
                    time: c.time,
                    value: c.volume || 0,
                    color: c.close >= c.open ? '#26a69a88' : '#ef535088'
                }));
                currentVolumeData = volData;
                if (volumeSeries) {
                    volumeSeries.setData(volData);
                }
            }

            if (payload.indicators) {
                if (payload.indicators.sma20 && Array.isArray(payload.indicators.sma20)) {
                    smaSeries.setData(payload.indicators.sma20);
                }
                if (payload.indicators.rsi14 && Array.isArray(payload.indicators.rsi14)) {
                    currentRsiData = payload.indicators.rsi14;
                    if (rsiSeries) {
                        rsiSeries.setData(payload.indicators.rsi14);
                    }
                }
            }

            if (currentShowFib && (!fibPoint1 || !fibPoint2)) {
                startFibDrawing();
            }
            setIndicators(currentShowSma, currentShowRsi, currentShowVolume);
            chart.timeScale().fitContent();
            renderFib();
        }

        function updateBar(barInput, volBarInput) {
            if (!chart) return;
            const bar = typeof barInput === 'string' ? JSON.parse(barInput) : barInput;
            candleSeries.update(bar);
            areaSeries.update({ time: bar.time, value: bar.close });
            if (volBarInput) {
                const vol = typeof volBarInput === 'string' ? JSON.parse(volBarInput) : volBarInput;
                if (currentVolumeData && currentVolumeData.length > 0) {
                    const lastIdx = currentVolumeData.length - 1;
                    if (currentVolumeData[lastIdx].time === vol.time) {
                        currentVolumeData[lastIdx] = vol;
                    } else {
                        currentVolumeData.push(vol);
                    }
                }
                if (volumeSeries) {
                    volumeSeries.update(vol);
                }
            }
            renderFib();
        }

        function setVisibleRange(fromSec, toSec) {
            if (chart) chart.timeScale().setVisibleRange({ from: fromSec, to: toSec });
            renderFib();
        }

        // Auto-initialize when document loads
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => initChart());
        } else {
            initChart();
        }

        // Cross-window message listener for web compatibility
        window.addEventListener('message', function(event) {
            try {
                const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
                if (!data || !data.type) return;

                if (data.type === 'setDataWithIndicators') {
                    setDataWithIndicators(data.payload);
                } else if (data.type === 'setIndicators') {
                    setIndicators(data.showSma, data.showRsi, data.showVolume);
                } else if (data.type === 'setFibonacci') {
                    setFibonacci(data.showFib);
                } else if (data.type === 'resetFibonacci') {
                    resetFibonacci();
                } else if (data.type === 'startFibDrawing') {
                    startFibDrawing();
                } else if (data.type === 'startHorizontalLineDrawing') {
                    startHorizontalLineDrawing();
                } else if (data.type === 'cancelHorizontalLineDrawing') {
                    cancelHorizontalLineDrawing();
                } else if (data.type === 'setHorizontalLines') {
                    setHorizontalLines(data.lines);
                } else if (data.type === 'clearHorizontalLines') {
                    clearHorizontalLines();
                } else if (data.type === 'startTrendlineDrawing') {
                    startTrendlineDrawing();
                } else if (data.type === 'cancelTrendlineDrawing') {
                    cancelTrendlineDrawing();
                } else if (data.type === 'setTrendlines') {
                    setTrendlines(data.lines);
                } else if (data.type === 'clearTrendlines') {
                    clearTrendlines();
                } else if (data.type === 'startRectangleDrawing') {
                    startRectangleDrawing();
                } else if (data.type === 'cancelRectangleDrawing') {
                    cancelRectangleDrawing();
                } else if (data.type === 'setRectangles') {
                    setRectangles(data.rectangles);
                } else if (data.type === 'clearRectangles') {
                    clearRectangles();
                } else if (data.type === 'clearAllDrawings') {
                    clearAllDrawings();
                } else if (data.type === 'setData') {
                    setData(data.candles, data.volumes);
                } else if (data.type === 'setSeriesType') {
                    setSeriesType(data.seriesType);
                } else if (data.type === 'initChart') {
                    initChart(data.upColor, data.downColor, data.gridColor, data.interactive);
                }
            } catch (e) {
                console.error("tv_chart message error:", e);
            }
        });
    </script>
