<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #chart-container,
        #chart,
        #fib-canvas {
            touch-action: none;
        }

        #chart {
            width: 100vw;
            height: 100vh;
        }

        #chart a {
            display: none !important;
            pointer-events: none !important;
        }

        /* TradingView Mobile Floating Toolbar Style */
        .tv-floating-toolbar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            background: #1E1E1E;
            border: 1px solid #2C2C2E;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            height: 38px;
            padding: 0 4px;
            z-index: 50;
            user-select: none;
            touch-action: none;
        }

        .tv-tb-drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 32px;
            cursor: grab;
            padding: 0 2px;
        }

        .tv-tb-drag-handle:active {
            cursor: grabbing;
        }

        .tv-tb-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 32px;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: #B2B5BE;
            cursor: pointer;
            padding: 0;
            margin: 0 1px;
            outline: none;
            position: relative;
            transition: background 0.12s, color 0.12s;
            touch-action: manipulation;
        }

        .tv-tb-btn:active, .tv-tb-btn.active {
            background: #2B2B2B;
            color: #FFFFFF;
        }

        #tv-btn-angle.active {
            background: #2B2B2B;
            color: #00E5FF;
        }

        .tv-tb-btn-delete {
            color: #EF5350;
        }
        .tv-tb-btn-delete:active {
            background: rgba(239, 83, 80, 0.18);
            color: #FF5252;
        }

        .tv-tb-text-btn {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #FFFFFF;
            width: auto;
            padding: 0 7px;
        }

        .tv-btn-icon-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .tv-color-underline {
            width: 16px;
            height: 3px;
            border-radius: 1.5px;
            margin-top: 2px;
        }

        .tv-t-icon {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }

        .tv-style-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 14px;
        }

        .tv-style-line-solid {
            width: 18px;
            height: 2px;
            background: #FFFFFF;
            border-radius: 1px;
            display: block;
        }

        .tv-style-line-dashed {
            width: 18px;
            height: 0;
            border-top: 2px dashed #FFFFFF;
            display: block;
        }

        .tv-style-line-dotted {
            width: 18px;
            height: 0;
            border-top: 2px dotted #FFFFFF;
            display: block;
        }

        /* Common Popover Menu Style */
        .tv-popover {
            position: absolute;
            background: #1E1E1E;
            border: 1px solid #2C2C2E;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
            z-index: 60;
            user-select: none;
            touch-action: manipulation;
        }

        /* Width & Style Dropdowns */
        .tv-menu-list {
            display: flex;
            flex-direction: column;
            padding: 6px;
            min-width: 120px;
        }

        .tv-menu-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 6px;
            color: #D1D4DC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            gap: 12px;
            transition: background 0.12s;
        }

        .tv-menu-item:active, .tv-menu-item.selected {
            background: #FFFFFF;
            color: #121212;
            font-weight: 700;
        }

        .tv-menu-item.selected .tv-menu-line {
            background: #121212 !important;
            border-color: #121212 !important;
        }

        .tv-menu-line {
            width: 22px;
            background: #D1D4DC;
            border-radius: 1px;
            display: inline-block;
        }

        /* Color Picker Popover (TradingView Exact Matrix) */
        .tv-color-picker {
            padding: 12px;
            width: 255px;
        }

        .tv-palette-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 12px;
        }

        .tv-color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            cursor: pointer;
            box-sizing: border-box;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tv-color-swatch.selected {
            box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 3.5px #1E1E1E;
            z-index: 2;
        }

        .tv-custom-color-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            padding-top: 8px;
            border-top: 1px solid #2C2C2E;
        }

        .tv-custom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 4px;
            border: 1px dashed #50535E;
            color: #B2B5BE;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            position: relative;
        }

        .tv-opacity-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tv-opacity-label {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11.5px;
            color: #787B86;
            font-weight: 500;
        }

        .tv-opacity-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tv-slider-container {
            position: relative;
            flex: 1;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            background-image: repeating-linear-gradient(45deg, #2B2B2B 25%, transparent 25%, transparent 75%, #2B2B2B 75%, #2B2B2B), repeating-linear-gradient(45deg, #2B2B2B 25%, #1E1E1E 25%, #1E1E1E 75%, #2B2B2B 75%, #2B2B2B);
            background-position: 0 0, 4px 4px;
            background-size: 8px 8px;
            border: 1px solid #2C2C2E;
        }

        .tv-slider-gradient {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }

        .tv-opacity-input {
            position: absolute;
            top: -4px;
            left: 0;
            width: 100%;
            height: 20px;
            margin: 0;
            opacity: 0;
            cursor: pointer;
            z-index: 5;
        }

        .tv-opacity-val {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11.5px;
            font-weight: 600;
            color: #D1D4DC;
            padding: 3px 6px;
            background: #121212;
            border: 1px solid #2C2C2E;
            border-radius: 4px;
            min-width: 34px;
            text-align: center;
        }

        /* TradingView Mobile Bottom Sheet for More Options (•••) */
        .tv-sheet-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s ease;
            touch-action: none;
        }

        .tv-sheet-backdrop.visible {
            opacity: 1;
        }

        .tv-bottom-sheet {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 1001;
            box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.6);
            padding: 8px 0 20px 0;
            transform: translateY(100%);
            transition: transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        .tv-bottom-sheet.visible {
            transform: translateY(0);
        }

        .tv-sheet-handle {
            width: 36px;
            height: 4px;
            background: #50535E;
            border-radius: 2px;
            margin: 4px auto 10px auto;
        }

        .tv-sheet-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 13px 20px;
            color: #D1D4DC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
            touch-action: manipulation;
        }

        .tv-sheet-item:active {
            background: #2B2B2B;
            color: #FFFFFF;
        }

        .tv-sheet-item svg {
            flex-shrink: 0;
            color: #868993;
            transition: color 0.12s;
        }

        .tv-sheet-item:active svg {
            color: #FFFFFF;
        }

        .tv-sheet-separator {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 6px 0;
        }

        /* TradingView Mobile Trendline Settings Modal */
        .tv-modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1050;
            opacity: 0;
            transition: opacity 0.22s ease;
            touch-action: none;
        }

        .tv-modal-backdrop.visible {
            opacity: 1;
        }

        .tv-settings-modal {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            max-height: 90vh;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 1060;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.75);
            transform: translateY(100%);
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .tv-settings-modal.visible {
            transform: translateY(0);
        }

        .tv-settings-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 12px 20px;
        }

        .tv-settings-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 600;
        }

        .tv-settings-close-btn {
            background: transparent;
            border: none;
            color: #868993;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.12s;
        }

        .tv-settings-close-btn:active {
            color: #FFFFFF;
        }

        .tv-settings-tabs {
            display: flex;
            border-bottom: 1px solid #2C2C2E;
            padding: 0 20px;
        }

        .tv-settings-tab {
            position: relative;
            color: #FFFFFF;
            font-size: 14.5px;
            font-weight: 600;
            padding: 10px 4px 12px 4px;
            cursor: pointer;
        }

        .tv-settings-tab-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2.5px;
            background: #FFFFFF;
            border-radius: 1.5px;
        }

        .tv-settings-body {
            padding: 18px 20px 12px 20px;
            overflow-y: auto;
            flex: 1;
            box-sizing: border-box;
            scrollbar-width: none;
        }

        .tv-settings-body::-webkit-scrollbar {
            display: none;
        }

        /* Formatting row: Swatch, Size, Bold, Italic */
        .tv-fmt-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        .tv-fmt-color-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 4px;
        }

        .tv-fmt-color-preview {
            width: 100%;
            height: 100%;
            border-radius: 4px;
            background: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tv-fmt-select-wrap {
            position: relative;
            display: inline-block;
        }

        .tv-fmt-size-btn {
            height: 36px;
            min-width: 68px;
            padding: 0 10px 0 12px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            transition: border-color 0.15s;
        }

        .tv-fmt-size-btn:hover, .tv-fmt-size-btn:focus {
            border-color: #50535E;
        }

        .tv-size-chevron {
            color: #868993;
            transition: transform 0.2s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            align-items: center;
        }

        .tv-size-chevron.open {
            transform: rotate(180deg);
        }

        /* Size Dropdown Overlay (TradingView Mobile Style) */
        .tv-size-dropdown-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 138px;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 14px;
            border-top-right-radius: 14px;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.7);
            z-index: 30;
            overflow-y: auto;
            padding: 10px 14px 20px 14px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 2px;
            scrollbar-width: none;
        }

        .tv-size-dropdown-overlay::-webkit-scrollbar {
            display: none;
        }

        .tv-size-item {
            height: 42px;
            min-height: 42px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-radius: 8px;
            color: #D1D4DC;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.12s, color 0.12s;
            box-sizing: border-box;
        }

        .tv-size-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .tv-size-item.selected {
            background: #F0F3FA;
            color: #121212;
            font-weight: 600;
        }

        .tv-select-arrow {
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #868993;
            display: flex;
        }

        .tv-fmt-toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #D1D4DC;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.12s;
        }

        .tv-fmt-toggle-btn.active {
            background: #2B2B2B;
            border-color: #FFFFFF;
            color: #FFFFFF;
        }

        /* Textarea */
        .tv-settings-textarea {
            width: 100%;
            height: 110px;
            border-radius: 8px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            padding: 12px;
            box-sizing: border-box;
            outline: none;
            resize: none;
            margin-bottom: 18px;
            transition: border-color 0.15s;
            user-select: text;
            -webkit-user-select: text;
        }

        .tv-settings-textarea:focus {
            border-color: #2962FF;
        }

        .tv-settings-textarea::placeholder {
            color: #50535E;
        }

        /* Alignment row */
        .tv-align-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .tv-align-label {
            color: #D1D4DC;
            font-size: 14px;
            font-weight: 400;
            flex: 1;
        }

        .tv-align-btn {
            min-width: 96px;
        }

        .tv-align-select {
            height: 36px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: #1E1E1E;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 13.5px;
            font-weight: 500;
            padding: 0 30px 0 12px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            outline: none;
        }

        /* Footer */
        .tv-settings-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 14px 20px 20px 20px;
            border-top: 1px solid #2C2C2E;
            background: #1E1E1E;
        }

        .tv-footer-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tv-footer-btn-cancel {
            height: 36px;
            padding: 0 16px;
            border-radius: 6px;
            border: 1px solid #3A3A3C;
            background: transparent;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.12s;
        }

        .tv-footer-btn-cancel:active {
            background: #2B2B2B;
        }

        .tv-footer-btn-ok {
            height: 36px;
            padding: 0 20px;
            border-radius: 6px;
            border: none;
            background: #FFFFFF;
            color: #000000;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.12s;
        }

        .tv-footer-btn-ok:active {
            opacity: 0.85;
        }

        /* Object Tree Modal (TradingView Mobile Style) */
        .tv-object-tree-modal {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 80vh;
            max-height: 85vh;
            background: #1E1E1E;
            border-top: 1px solid #2C2C2E;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            z-index: 1060;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.75);
            transform: translateY(100%);
            transition: transform 0.26s cubic-bezier(0.2, 0.9, 0.3, 1);
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .tv-object-tree-modal.visible {
            transform: translateY(0);
        }

        .tv-object-tree-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px 14px 20px;
            border-bottom: 1px solid #2C2C2E;
        }

        .tv-object-tree-title {
            color: #FFFFFF;
            font-size: 19px;
            font-weight: 600;
        }

        .tv-object-tree-header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .tv-tree-header-btn {
            background: transparent;
            border: none;
            color: #868993;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.12s;
        }

        .tv-tree-header-btn:active {
            color: #FFFFFF;
        }

        .tv-object-tree-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 20px 0;
            box-sizing: border-box;
            scrollbar-width: none;
        }

        .tv-object-tree-body::-webkit-scrollbar {
            display: none;
        }

        .tv-tree-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            cursor: pointer;
            transition: background 0.12s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            user-select: none;
            -webkit-user-select: none;
        }

        .tv-tree-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .tv-tree-info-row, .tv-tree-info-row:hover {
            background: transparent !important;
            cursor: default !important;
        }

        .tv-tree-item.selected {
            background: #1B365D; /* TradingView mobile active row highlight */
        }

        .tv-tree-item.hidden-item {
            opacity: 0.6;
        }

        .tv-tree-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .tv-tree-item-icon {
            color: #868993;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tv-tree-item.selected .tv-tree-item-icon {
            color: #2962FF;
        }

        .tv-tree-item-label {
            color: #FFFFFF;
            font-size: 14.5px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tv-tree-item-sub {
            color: #868993;
            font-size: 12px;
            margin-left: 6px;

            console.error("TV_CHART_JS_ERROR: " + msg + " at " + lineNo + ":" + columnNo + (error ? " " + error.stack : ""));
            return false;
        };
        window.onunhandledrejection = function(event) {
            console.error("TV_CHART_JS_REJECTION: " + event.reason);
        };

        let chart = null;
        let candleSeries = null;
        let areaSeries = null;
        let volumeSeries = null;
        let smaSeries = null;
        let rsiSeries = null;
        let currentType = 'candle';
        let currentShowSma = false;
        let currentShowRsi = false;
        let currentShowVolume = false;
        let currentShowFib = false;
        let isDrawingFib = false;
        let isFibSelected = false; // true: Edit Mode (large handles, dashed line), false: Non-Edit Mode (subtle dots)
        let fibPoint1 = null; // { time, price }
        let fibPoint2 = null; // { time, price }
        let fibCustomColor = null; // null: rainbow default per line, hex: uniform custom color
        let fibLineWidth = 2;
        let fibIsLocked = false;
        let fibDragStartPos = null;
        let rawCandlesData = [];
        let currentRsiData = [];
        let currentVolumeData = [];
        let pendingData = null;

        let horizontalLines = []; // Array of prices: [7650, 7820]
        let isDrawingHorizontalLine = false;
        let selectedHorizontalLineIndex = -1; // -1: none, >= 0: index of horizontal line in edit mode
        let dragHorizontalLineIndex = -1;
        let crosshairPos = null;
        let currentCrosshairColor = 'rgba(255, 255, 255, 0.75)';

        let trendlines = []; // Array of { id, p1: { time, price }, p2: { time, price } }
        let isDrawingTrendline = false;
        let trendlineDrawState = 0; // 0: idle, 1: waiting for p1, 2: waiting for p2
        let tempTrendlineP1 = null;
        let tempTrendlineP2 = null;
        let selectedTrendlineIndex = -1; // -1: none, >= 0: trendline index in edit mode
        let dragTrendlineIndex = -1;
        let dragTrendlinePart = 0; // 0: none, 1: p1, 2: p2, 3: body
        let dragTrendlineStartPos = null;
        let globalAngleLock = false;

        function notifyHorizontalLinesChanged() {
            if (window.flutter_inappwebview?.callHandler) {
                window.flutter_inappwebview.callHandler('onHorizontalLinesChanged', horizontalLines);
            }
            window.parent?.postMessage(JSON.stringify({ type: 'onHorizontalLinesChanged', payload: horizontalLines }), '*');
        }

        function notifyTrendlinesChanged() {
            if (window.flutter_inappwebview?.callHandler) {
                window.flutter_inappwebview.callHandler('onTrendlinesChanged', trendlines);
            }

        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            if (lenSq === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        function getTimeAtX(x) {
            if (!chart) return null;
            const maxW = getChartContentWidth();
            const clampedX = Math.max(0, Math.min(x, maxW));
            const t = chart.timeScale().coordinateToTime(clampedX);
            if (t !== null && t !== undefined) {
                if (typeof t === 'number') return t;
                if (typeof t === 'object' && t.year) {
                    return Math.floor(Date.UTC(t.year, t.month - 1, t.day) / 1000);
                }
            }
            if (rawCandlesData && rawCandlesData.length > 0) {
                let closest = rawCandlesData[0];
                let minDist = Infinity;
                for (let i = 0; i < rawCandlesData.length; i++) {
                    const cx = chart.timeScale().timeToCoordinate(rawCandlesData[i].time);
                    if (cx !== null) {
                        const dist = Math.abs(cx - clampedX);
                        if (dist < minDist) {
                            minDist = dist;
                            closest = rawCandlesData[i];
                        }
                    }
                }
                return closest.time;
            }
            return null;
        }

        function getTrendlineActionPillPos(x1, y1, x2, y2, containerWidth, containerHeight) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2;
            const maxW = containerWidth || getChartContentWidth();
            const maxH = containerHeight || 500;

            const dx = x2 - x1;
            const dy = y2 - y1;
            let len = Math.hypot(dx, dy);
            if (len < 1) len = 1;

            // Perpendicular unit normal vector (nx, ny)
            let nx = -dy / len;
            let ny = dx / len;

            // Standardize normal to point "upward" (negative Y) away from the line
            if (Math.abs(ny) < 0.05) {
                // For steep or purely vertical lines: offset horizontally into open space
                nx = (mx > maxW / 2) ? -1 : 1;
                ny = 0;
            } else if (ny > 0) {
                // Invert downwards-pointing normal so it points upwards away from line
                nx = -nx;
                ny = -ny;
            }

            const offsetDist = 38;
            let px = mx + (nx * offsetDist);
            let py = my + (ny * offsetDist);

            // If too close to the top boundary (< 42px), flip normal to opposite side of line
            if (py < 42) {
                px = mx - (nx * offsetDist);
                py = my - (ny * offsetDist);
            }
            // If flipped below chart bottom edge, push back up
            if (py > maxH - 35) {
                px = mx + (nx * offsetDist);
                py = my + (ny * offsetDist);
            }

            // Clamp coordinates safely within content bounds (mentok before price scale)
            px = Math.max(35, Math.min(maxW - 25, px));
            py = Math.max(25, Math.min(maxH - 25, py));

            return { x: px, y: py, mx, my };
        }

        function getRectangleActionPillPos(left, top, right, bottom, maxW, maxH) {
            let px = (left + right) / 2;

            const limitW = maxW || getChartContentWidth();
            px = Math.max(35, Math.min(limitW - 25, px));
            py = Math.max(25, Math.min((maxH || 500) - 25, py));
            return { x: px, y: py };
        }

        function hexToRgba(hex, alpha = 1.0) {
            if (!hex) hex = '#7C4DFF';
            let c = hex.replace('#', '');
            if (c.length === 3) {
                c = c.split('').map(char => char + char).join('');
            }
            const num = parseInt(c, 16);
            if (isNaN(num)) return `rgba(124, 77, 255, ${alpha})`;
            const r = (num >> 16) & 255;
            const g = (num >> 8) & 255;
            const b = num & 255;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function positionPopover(popover, targetBtn) {
            if (!popover || !targetBtn) return;
            const btnRect = targetBtn.getBoundingClientRect();
            const container = document.getElementById('chart-container');
            const cRect = container ? container.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };

            popover.style.display = 'block';
            const popW = popover.offsetWidth || 255;
            const popH = popover.offsetHeight || 280;

            let left = btnRect.left + (btnRect.width / 2) - (popW / 2);
            if (left < 8) left = 8;
            if (left + popW > cRect.width - 8) {
                left = cRect.width - popW - 8;
            }

            let top = btnRect.bottom + 8;
            if (top + popH > cRect.height - 8) {
                top = Math.max(8, btnRect.top - popH - 8);
            }

            popover.style.left = Math.round(left) + 'px';
            popover.style.top = Math.round(top) + 'px';
        }

        function updateSliderGradient(colorHex) {
            const grad = document.getElementById('tv-slider-gradient');
            if (!grad) return;
            grad.style.background = `linear-gradient(to right, ${hexToRgba(colorHex, 0)}, ${hexToRgba(colorHex, 1)})`;
        }

        function applySelectedColor(colorHex, opacityVal) {
            if (isFibSelected && currentShowFib && fibPoint1 && fibPoint2) {
                if (colorHex) {
                    fibCustomColor = colorHex;
                    const lineInd = document.getElementById('tv-indicator-line-color');
                    if (lineInd) lineInd.style.background = fibCustomColor;
                    updateSliderGradient(fibCustomColor);
                } else if (colorHex === null) {
                    // Reset to rainbow
                    fibCustomColor = null;
                    const lineInd = document.getElementById('tv-indicator-line-color');
                    if (lineInd) lineInd.style.background = 'linear-gradient(90deg, #00B0FF 0%, #00E676 35%, #FFEB3B 65%, #FF5722 100%)';
                }
                document.querySelectorAll('#tv-palette-grid .tv-color-swatch').forEach(sw => {
                    sw.classList.toggle('selected', !!fibCustomColor && sw.getAttribute('data-color')?.toUpperCase() === fibCustomColor.toUpperCase());
                });
                renderFib();
                refreshObjectTree();
                return;
            }

            let drawing = null;
            let isHLine = false;
            let isRect = false;
            if (selectedHorizontalLineIndex >= 0 && horizontalLines[selectedHorizontalLineIndex]) {
                drawing = horizontalLines[selectedHorizontalLineIndex];
                isHLine = true;
            } else if (selectedTrendlineIndex >= 0 && trendlines[selectedTrendlineIndex]) {
                drawing = trendlines[selectedTrendlineIndex];
                isHLine = false;
            } else if (selectedRectangleIndex >= 0 && rectangles[selectedRectangleIndex]) {
                drawing = rectangles[selectedRectangleIndex];
                isRect = true;
            } else {
                return;
            }

            if (activeColorPickerTarget === 'line') {
                if (colorHex) drawing.color = colorHex;
                if (opacityVal !== undefined) drawing.opacity = opacityVal;
                const lineInd = document.getElementById('tv-indicator-line-color');
                if (lineInd && drawing.color) lineInd.style.backgroundColor = drawing.color;
                updateSliderGradient(drawing.color || (isHLine ? '#00E5FF' : (isRect ? '#AB47BC' : '#7C4DFF')));
            } else if (activeColorPickerTarget === 'fill') {
                if (colorHex) drawing.fillColor = colorHex;
                if (opacityVal !== undefined) drawing.fillOpacity = opacityVal;
                const fillInd = document.getElementById('tv-indicator-fill-color');
                if (fillInd) {
                    const curFill = drawing.fillColor || '#AB47BC';
                    const curOp = drawing.fillOpacity !== undefined ? drawing.fillOpacity : 0.2;
                    fillInd.style.backgroundColor = hexToRgba(curFill, curOp);
                }
                updateSliderGradient(drawing.fillColor || '#AB47BC');
            } else if (activeColorPickerTarget === 'text') {
                if (colorHex) {
                    drawing.textColor = colorHex;
                    modalPendingTextColor = colorHex;

                if (textInd && drawing.textColor) textInd.style.backgroundColor = drawing.textColor;
                const preview = document.getElementById('tv-text-color-preview');
                if (preview && drawing.textColor) preview.style.backgroundColor = drawing.textColor;

                    p2: { time: src.p2.time, price: src.p2.price + priceOffset },
                    color: src.color || '#AB47BC',
                    width: src.width || 2,
                    style: src.style || 'solid',
                    fillColor: src.fillColor || '#AB47BC',
                    fillOpacity: (src.fillOpacity !== undefined) ? src.fillOpacity : 0.2,

        function snapCoordinateTo45Degrees(originX, originY, targetX, targetY) {
            const dx = targetX - originX;
            const dy = targetY - originY;
            const dist = Math.hypot(dx, dy);
            if (dist < 2) return { x: targetX, y: targetY };

            // Angle in degrees from origin to target in screen coords
            const deg = Math.atan2(dy, dx) * (180 / Math.PI);
            // Snap to nearest 45 degree multiple: 0 (horizontal), 45, 90 (vertical), 135, 180 (horizontal), -45, -90, -135
            const snappedDeg = Math.round(deg / 45) * 45;
            const snappedRad = snappedDeg * (Math.PI / 180);

            return {
                x: originX + dist * Math.cos(snappedRad),
                y: originY + dist * Math.sin(snappedRad)
            };
        }

        function getTrendlineAngle(t) {
            const activeSeries = candleSeries || areaSeries;
            if (!chart || !activeSeries) return 0;
            const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
            const y1 = activeSeries.priceToCoordinate(t.p1.price);
            const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
            const y2 = activeSeries.priceToCoordinate(t.p2.price);
            if (x1 === null || y1 === null || x2 === null || y2 === null) return 0;
            const rad = Math.atan2(y1 - y2, x2 - x1);
            return Math.round(rad * (180 / Math.PI));
        }

                    const dx = e.clientX - tbStartX;

                };

                const endTbDrag = (e) => {
                    if (!isDraggingTb) return;
                    isDraggingTb = false;
                    try { dragHandle.releasePointerCapture(e.pointerId); } catch (_) {}
                };

                dragHandle.onpointerup = endTbDrag;

        function initFibPointerEvents() {
            const canvas = document.getElementById('fib-canvas');
            const chartContainer = document.getElementById('chart-container');
            if (!canvas || !chartContainer) return;

            // Ergonomic Hitbox Constants (Generous sizes optimized for smartphone touchscreens)
            const HITBOX_FIB_ANCHOR = 38; // 38px radius (76px diameter touch target for mobile fingers/thumbs)
            const HITBOX_HLINE = 28;      // 28px vertical distance (56px tall touch target)
            const HITBOX_HLINE_DEL = 36;  // 36px touch zone at right edge for delete
            const HITBOX_TL_ANCHOR = 32;  // 32px radius for trendline anchors
            const HITBOX_TL_DEL = 28;     // 28px radius for trendline delete button
            const HITBOX_TL_BODY = 22;    // 22px distance for trendline body
            const HITBOX_RECT_CORNER = 30; // 30px radius for rectangle corner handles
            const HITBOX_RECT_DEL = 28;    // 28px radius for rectangle delete button

            // Hover detection to allow grabbing existing anchor handles, trendlines, & horizontal lines on desktop
            function updateHoverState(e) {
                if (isDrawingHorizontalLine || isDrawingTrendline || isDrawingRectangle || isDrawingFib || fibDrawState !== 0 || trendlineDrawState !== 0 || rectangleDrawState !== 0 || isPointerDown || dragHorizontalLineIndex !== -1 || dragTrendlineIndex !== -1 || dragRectangleIndex !== -1 || dragMode !== 0) {
                    return;
                }

                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const maxContentX = getChartContentWidth();

                if (x < 0 || y < 0 || x > maxContentX || y > rect.height) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                    return;
                }

                const activeSeries = candleSeries || areaSeries;

                // 1. Check proximity to horizontal lines (vertical drag or cursor)
                if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                    for (let i = 0; i < horizontalLines.length; i++) {
                        const h = horizontalLines[i];
                        if (h && h.hidden) continue;
                        const price = typeof h === 'object' ? h.price : h;
                        const lineY = activeSeries.priceToCoordinate(price);
                        if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                            canvas.style.pointerEvents = 'auto';
                            if (i === selectedHorizontalLineIndex) {
                                canvas.style.cursor = (h && h.isLocked) ? 'pointer' : 'ns-resize';
                            } else {
                                canvas.style.cursor = 'pointer';
                            }
                            return;
                        }
                    }
                }

                // 2. Check proximity to Trendlines (anchors, delete button, or body)
                if (trendlines && trendlines.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < trendlines.length; i++) {
                        const t = trendlines[i];
                        const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                        const y1 = activeSeries.priceToCoordinate(t.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                        const y2 = activeSeries.priceToCoordinate(t.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            if (i === selectedTrendlineIndex) {
                                const pillPos = getTrendlineActionPillPos(x1, y1, x2, y2, maxContentX, rect.height);
                                if (Math.hypot(x - pillPos.x, y - pillPos.y) <= HITBOX_TL_DEL) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR || Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'grab';
                                    return;
                                }
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                            }
                        }
                    }
                }

                // 2.5 Check proximity to Rectangles (corners, delete button, or body)
                if (rectangles && rectangles.length > 0 && activeSeries && chart) {
                    for (let i = 0; i < rectangles.length; i++) {
                        const r = rectangles[i];
                        const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                        const y1 = activeSeries.priceToCoordinate(r.p1.price);
                        const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                        const y2 = activeSeries.priceToCoordinate(r.p2.price);
                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            const left = Math.min(x1, x2);
                            const right = Math.max(x1, x2);
                            const top = Math.min(y1, y2);
                            const bottom = Math.max(y1, y2);

                            if (i === selectedRectangleIndex) {
                                if (Math.hypot(x - x1, y - y1) <= HITBOX_RECT_CORNER ||
                                    Math.hypot(x - x2, y - y2) <= HITBOX_RECT_CORNER ||
                                    Math.hypot(x - x1, y - y2) <= HITBOX_RECT_CORNER ||
                                    Math.hypot(x - x2, y - y1) <= HITBOX_RECT_CORNER) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'crosshair';
                                    return;
                                }
                                if (x >= left && x <= right && y >= top && y <= bottom) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'move';
                                    return;
                                }
                            } else {
                                if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                    canvas.style.pointerEvents = 'auto';
                                    canvas.style.cursor = 'pointer';
                                    return;
                                }
                            }
                        }
                    }
                }

                // 3. Check proximity to Fibonacci anchors
                if (currentShowFib && fibPoint1 && fibPoint2 && chart && activeSeries) {
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = activeSeries.priceToCoordinate(fibPoint1.price);
                    const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                    const y2 = activeSeries.priceToCoordinate(fibPoint2.price);

                    const near1 = x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR;
                    const near2 = x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR;

                    if (near1 || near2) {
                        canvas.style.pointerEvents = 'auto';
                        canvas.style.cursor = 'grab';
                        return;
                    }
                }

                // Default when not hovering directly over any drawing element
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }

            if (chartContainer) {
                chartContainer.addEventListener('pointermove', (e) => {
                    if (e.target && e.target.closest && e.target.closest('#tv-trendline-toolbar, .tv-popover, #tv-more-bottom-sheet, #tv-more-sheet-backdrop, #tv-settings-modal, #tv-settings-backdrop, #tv-object-tree-modal, #tv-object-tree-backdrop')) {
                        return;
                    }
                    updateHoverState(e);
                });

                // Mobile-first capture-phase touch interceptor:
                // Intercepts touches on drawing elements BEFORE LightweightCharts can handle them as pan/scroll!
                chartContainer.addEventListener('pointerdown', (e) => {
                    // If touch was on the floating toolbar, popover, bottom sheet, settings modal, or object tree, DO NOT INTERCEPT AT ALL!
                    if (e.target && e.target.closest && e.target.closest('#tv-trendline-toolbar, .tv-popover, #tv-more-bottom-sheet, #tv-more-sheet-backdrop, #tv-settings-modal, #tv-settings-backdrop, #tv-object-tree-modal, #tv-object-tree-backdrop')) {
                        return;
                    }

                    // If user is placing a brand new tool, let canvas handle placement
                    if (isDrawingHorizontalLine || isDrawingTrendline || isDrawingRectangle || isDrawingFib || fibDrawState !== 0 || trendlineDrawState !== 0 || rectangleDrawState !== 0) {
                        return;
                    }

                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    const maxContentX = getChartContentWidth();

                    // If touch starts on the right price scale, do NOT intercept, let chart handle price scaling!
                    if (x > maxContentX) {
                        return;
                    }

                    pointerDownPos = { x, y };
                    pointerDownTime = Date.now();

                    const activeSeries = candleSeries || areaSeries;
                    if (!activeSeries || !chart) return;

                    // 1. FIBONACCI RESIZE HIT TEST (Comfortable 76px touch zone)
                    if (currentShowFib && fibPoint1 && fibPoint2) {
                        const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                        const y1 = activeSeries.priceToCoordinate(fibPoint1.price);
                        const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                        const y2 = activeSeries.priceToCoordinate(fibPoint2.price);

                        const hit1 = x1 !== null && y1 !== null && Math.hypot(x - x1, y - y1) <= HITBOX_FIB_ANCHOR;
                        const hit2 = x2 !== null && y2 !== null && Math.hypot(x - x2, y - y2) <= HITBOX_FIB_ANCHOR;
                        const hitDiagonal = (x1 !== null && y1 !== null && x2 !== null && y2 !== null) && distToSegment(x, y, x1, y1, x2, y2) <= 24;
                        const minX = (x1 !== null && x2 !== null) ? Math.min(x1, x2) : 0;
                        const maxX = (x1 !== null && x2 !== null) ? Math.max(x1, x2) : 0;
                        const minY = (y1 !== null && y2 !== null) ? Math.min(y1, y2) : 0;
                        const maxY = (y1 !== null && y2 !== null) ? Math.max(y1, y2) : 0;
                        const hitInsideBox = (x1 !== null && y1 !== null && x2 !== null && y2 !== null) &&
                            (x >= minX - 10 && x <= maxX + 10 && y >= minY - 10 && y <= maxY + 10);

                        if (hit1 || hit2) {
                            e.stopPropagation();
                            e.stopImmediatePropagation();
                            e.preventDefault();

                            isFibSelected = true;
                            selectedTrendlineIndex = -1;
                            selectedHorizontalLineIndex = -1;
                            selectedRectangleIndex = -1;
                            if (!fibIsLocked) {
                                dragMode = hit1 ? 1 : 2;
                                isPointerDown = true;
                                try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                chart.applyOptions({ handleScroll: false, handleScale: false });
                            }
                            showFibToolbar();
                            renderFib();
                            return;
                        } else if (hitDiagonal || hitInsideBox) {
                            e.stopPropagation();
                            e.stopImmediatePropagation();
                            e.preventDefault();

                            isFibSelected = true;
                            selectedTrendlineIndex = -1;
                            selectedHorizontalLineIndex = -1;
                            selectedRectangleIndex = -1;
                            if (!fibIsLocked) {
                                dragMode = 3;
                                fibDragStartPos = {
                                    x, y,
                                    origP1: { time: fibPoint1.time, price: fibPoint1.price },
                                    origP2: { time: fibPoint2.time, price: fibPoint2.price }
                                };
                                isPointerDown = true;
                                try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                chart.applyOptions({ handleScroll: false, handleScale: false });
                            }
                            showFibToolbar();
                            renderFib();
                            return;

                    // 2. HORIZONTAL LINE HIT TEST (56px tall vertical touch zone)

                        for (let i = 0; i < horizontalLines.length; i++) {
                            const h = horizontalLines[i];
                            if (h.hidden) continue;
                            const price = typeof h === 'object' ? h.price : h;
                            const lineY = activeSeries.priceToCoordinate(price);
                            if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                                e.stopPropagation();
                                e.stopImmediatePropagation();
                                e.preventDefault();

                                selectedHorizontalLineIndex = i;
                                selectedTrendlineIndex = -1;
                                selectedRectangleIndex = -1;
                                isFibSelected = false;

                                if (!h.isLocked) {
                                    dragHorizontalLineIndex = i;
                                    isPointerDown = true;
                                    try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                    chart.applyOptions({ handleScroll: false, handleScale: false });
                                }
                                showHorizontalLineToolbar(i);
                                renderFib();
                                return;
                            }

                    // 3. TRENDLINE HIT TEST (Generous touch zones for anchors, delete button, and body)
                    if (trendlines && trendlines.length > 0) {
                        for (let i = 0; i < trendlines.length; i++) {
                            const t = trendlines[i];
                            if (t.hidden) continue;
                            const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                            const y1 = activeSeries.priceToCoordinate(t.p1.price);
                            const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                            const y2 = activeSeries.priceToCoordinate(t.p2.price);
                            if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                                if (i === selectedTrendlineIndex) {
                                    if (Math.hypot(x - x1, y - y1) <= HITBOX_TL_ANCHOR) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 1;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                    if (Math.hypot(x - x2, y - y2) <= HITBOX_TL_ANCHOR) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 2;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                    if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 3;
                                            dragTrendlineStartPos = {

                                                origP1: { time: t.p1.time, price: t.p1.price },
                                                origP2: { time: t.p2.time, price: t.p2.price }
                                            };
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                } else {
                                    if (distToSegment(x, y, x1, y1, x2, y2) <= HITBOX_TL_BODY) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        selectedTrendlineIndex = i;
                                        selectedRectangleIndex = -1;
                                        selectedHorizontalLineIndex = -1;
                                        isFibSelected = false;
                                        if (!t.isLocked) {
                                            dragTrendlineIndex = i;
                                            dragTrendlinePart = 3;
                                            dragTrendlineStartPos = {
                                                x, y,
                                                origP1: { time: t.p1.time, price: t.p1.price },
                                                origP2: { time: t.p2.time, price: t.p2.price }
                                            };
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showTrendlineToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                }
                            }
                        }
                    }

                    // 4. RECTANGLE HIT TEST (Body and corner handles)
                    if (rectangles && rectangles.length > 0) {
                        for (let i = 0; i < rectangles.length; i++) {
                            const r = rectangles[i];
                            if (r.hidden) continue;
                            const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                            const y1 = activeSeries.priceToCoordinate(r.p1.price);
                            const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                            const y2 = activeSeries.priceToCoordinate(r.p2.price);
                            if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                                const left = Math.min(x1, x2);
                                const right = Math.max(x1, x2);
                                const top = Math.min(y1, y2);
                                const bottom = Math.max(y1, y2);

                                const startPosData = {
                                    x, y,
                                    origP1: { time: r.p1.time, price: r.p1.price },
                                    origP2: { time: r.p2.time, price: r.p2.price },
                                    origX1: x1,
                                    origY1: y1,
                                    origX2: x2,
                                    origY2: y2
                                };

                                if (i === selectedRectangleIndex) {
                                    // Corner 1 grab (p1)
                                    if (Math.hypot(x - x1, y - y1) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!r.isLocked) {
                                            dragRectangleIndex = i;
                                            dragRectanglePart = 1;
                                            dragRectangleStartPos = startPosData;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showRectangleToolbar(i);
                                        renderFib();
                                        return;
                                    }

                                    // Corner 2 grab (p2)
                                    if (Math.hypot(x - x2, y - y2) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!r.isLocked) {
                                            dragRectangleIndex = i;
                                            dragRectanglePart = 2;
                                            dragRectangleStartPos = startPosData;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showRectangleToolbar(i);
                                        renderFib();
                                        return;
                                    }

                                    // Corner 3 grab (x1, y2)
                                    if (Math.hypot(x - x1, y - y2) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!r.isLocked) {
                                            dragRectangleIndex = i;
                                            dragRectanglePart = 4;
                                            dragRectangleStartPos = startPosData;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showRectangleToolbar(i);
                                        renderFib();
                                        return;
                                    }

                                    // Corner 4 grab (x2, y1)
                                    if (Math.hypot(x - x2, y - y1) <= HITBOX_RECT_CORNER) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!r.isLocked) {
                                            dragRectangleIndex = i;
                                            dragRectanglePart = 5;
                                            dragRectangleStartPos = startPosData;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showRectangleToolbar(i);
                                        renderFib();
                                        return;
                                    }

                                    // Inside rectangle body -> translate entire box
                                    if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        if (!r.isLocked) {
                                            dragRectangleIndex = i;
                                            dragRectanglePart = 3;
                                            dragRectangleStartPos = startPosData;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showRectangleToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                } else {
                                    // In non-edit mode: tap inside or on border to select into Edit Mode!
                                    if (x >= left - 6 && x <= right + 6 && y >= top - 6 && y <= bottom + 6) {
                                        e.stopPropagation();
                                        e.stopImmediatePropagation();
                                        e.preventDefault();
                                        selectedRectangleIndex = i;
                                        selectedTrendlineIndex = -1;
                                        selectedHorizontalLineIndex = -1;
                                        isFibSelected = false;
                                        if (!r.isLocked) {
                                            dragRectangleIndex = i;
                                            dragRectanglePart = 3;
                                            dragRectangleStartPos = startPosData;
                                            isPointerDown = true;
                                            try { chartContainer.setPointerCapture?.(e.pointerId); } catch (_) {}
                                            chart.applyOptions({ handleScroll: false, handleScale: false });
                                        }
                                        showRectangleToolbar(i);
                                        renderFib();
                                        return;
                                    }
                                }
                            }
                        }
                    }

                    // If tapped empty space on chart while a trendline, fib, horizontal line, or rectangle was selected, deselect it
                    let needsDeselect = false;
                    if (selectedTrendlineIndex !== -1) {
                        selectedTrendlineIndex = -1;
                        hideTrendlineToolbar();
                        needsDeselect = true;
                    }
                    if (isFibSelected) {
                        isFibSelected = false;
                        needsDeselect = true;
                    }
                    if (selectedHorizontalLineIndex !== -1) {
                        selectedHorizontalLineIndex = -1;
                        needsDeselect = true;
                    }
                    if (selectedRectangleIndex !== -1) {
                        selectedRectangleIndex = -1;
                        needsDeselect = true;
                    }
                    if (needsDeselect) {
                        hideTrendlineToolbar();
                        renderFib();
                    }
                }, { capture: true });
            }

            canvas.addEventListener('pointerdown', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const maxContentX = getChartContentWidth();
                const clampedX = Math.max(0, Math.min(x, maxContentX));
                pointerDownPos = { x: clampedX, y };
                pointerDownTime = Date.now();

                // 0. Horizontal Line Placement (One-Tap S/R)
                if (isDrawingHorizontalLine) {
                    const price = getPriceAtY(y);
                    crosshairPos = null;
                    if (price !== null) {
                        const newHLine = normalizeHorizontalLine({
                            id: 'hl_' + Date.now(),
                            price: price,
                            color: '#00E5FF',
                            width: 2,
                            style: 'solid',
                            opacity: 1.0,
                            text: '',
                            textColor: '#FFFFFF',
                            textSize: 14,
                            textBold: false,
                            textItalic: false,
                            textValign: 'top',
                            textHalign: 'center',
                            isLocked: false,
                            hidden: false
                        });
                        horizontalLines.push(newHLine);
                        selectedHorizontalLineIndex = horizontalLines.length - 1; // Enter edit mode immediately upon placement!
                        selectedTrendlineIndex = -1;
                        selectedRectangleIndex = -1;
                        isFibSelected = false;
                        isDrawingHorizontalLine = false;
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        showHorizontalLineToolbar(selectedHorizontalLineIndex);
                        renderFib();
                        notifyHorizontalLinesChanged();
                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onHorizontalLineAdded', newHLine);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onHorizontalLineAdded', payload: newHLine }), '*');
                    }
                    return;
                }

                // 0.1 Check if clicking on an existing horizontal line
                const activeSeries = candleSeries || areaSeries;
                if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                    for (let i = 0; i < horizontalLines.length; i++) {
                        const h = horizontalLines[i];
                        if (h.hidden) continue;
                        const price = typeof h === 'object' ? h.price : h;
                        const lineY = activeSeries.priceToCoordinate(price);
                        if (lineY !== null && Math.abs(y - lineY) <= HITBOX_HLINE) {
                            selectedHorizontalLineIndex = i;
                            selectedTrendlineIndex = -1;
                            selectedRectangleIndex = -1;
                            isFibSelected = false;
                            if (!h.isLocked) {
                                dragHorizontalLineIndex = i;
                                isPointerDown = true;
                                canvas.setPointerCapture?.(e.pointerId);
                                if (chart) chart.applyOptions({ handleScroll: false, handleScale: false });
                                canvas.style.cursor = 'ns-resize';
                            }
                            showHorizontalLineToolbar(i);
                            renderFib();
                            return;
                        }
                    }
                }

                // 0.2 Trendline Placement (Two-Click Drawing Mode)

                        } else if (dragRectanglePart === 5) { // Corner 4 (ox2, oy1) -> fixed anchor is Corner 3 (ox1, oy2)
                            fixX = ox1; fixY = oy2;
                        }

                        const dx = clampedX - fixX;
                        const dy = y - fixY;
                        const scale = Math.max(0.05, Math.max(Math.abs(dx) / origW, Math.abs(dy) / origH));
                        const newW = origW * scale;
                        const newH = origH * scale;

                        const signX = (dx >= 0) ? 1 : -1;
                        const signY = (dy >= 0) ? 1 : -1;

                        const targetX = Math.max(0, Math.min(maxContentX, fixX + (signX * newW)));
                        const targetY = fixY + (signY * newH);

                        const time = getTimeAtX(targetX);
                        const price = getPriceAtY(targetY);

                        if (time && price !== null) {
                            if (dragRectanglePart === 1) {
                                r.p1 = { time, price };
                            } else if (dragRectanglePart === 2) {
                                r.p2 = { time, price };
                            } else if (dragRectanglePart === 4) {
                                r.p1.time = time;
                                r.p2.price = price;
                            } else if (dragRectanglePart === 5) {
                                r.p2.time = time;
                                r.p1.price = price;
                            }
                            renderFib();
                        }
                        return;
                    }

                    if (dragRectanglePart === 1) { // Corner 1 (p1: time, price)
                        const time = getTimeAtX(clampedX);
                        const price = getPriceAtY(y);
                        if (time && price !== null) {
                            r.p1 = { time, price };
                            renderFib();
                        }
                        return;
                    }
                    if (dragRectanglePart === 2) { // Corner 2 (p2: time, price)
                        const time = getTimeAtX(clampedX);
                        const price = getPriceAtY(y);
                        if (time && price !== null) {
                            r.p2 = { time, price };
                            renderFib();
                        }
                        return;
                    }
                    if (dragRectanglePart === 4) { // Corner 3 (p1.time, p2.price)
                        const time = getTimeAtX(clampedX);
                        const price = getPriceAtY(y);
                        if (time && price !== null) {
                            r.p1.time = time;
                            r.p2.price = price;
                            renderFib();
                        }
                        return;
                    }
                    if (dragRectanglePart === 5) { // Corner 4 (p2.time, p1.price)
                        const time = getTimeAtX(clampedX);
                        const price = getPriceAtY(y);
                        if (time && price !== null) {
                            r.p2.time = time;
                            r.p1.price = price;
                            renderFib();
                        }
                        return;
                    }
                    if (dragRectanglePart === 3 && dragRectangleStartPos) { // Translate entire rectangle
                        const activeSeries = candleSeries || areaSeries;
                        if (!activeSeries || !chart) return;
                        let dx = x - dragRectangleStartPos.x;
                        const dy = y - dragRectangleStartPos.y;

                        const curX1 = chart.timeScale().timeToCoordinate(dragRectangleStartPos.origP1.time);
                        const curY1 = activeSeries.priceToCoordinate(dragRectangleStartPos.origP1.price);
