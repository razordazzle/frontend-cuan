                        const curX2 = chart.timeScale().timeToCoordinate(dragRectangleStartPos.origP2.time);
                        const curY2 = activeSeries.priceToCoordinate(dragRectangleStartPos.origP2.price);

                        if (curX1 !== null && curY1 !== null && curX2 !== null && curY2 !== null) {
                            const maxRectX = Math.max(curX1, curX2);
                            if (maxRectX + dx > maxContentX) {
                                dx = maxContentX - maxRectX;
                            }
                            const minRectX = Math.min(curX1, curX2);
                            if (minRectX + dx < 0) {
                                dx = -minRectX;
                            }

                            const newTime1 = getTimeAtX(curX1 + dx);
                            const newPrice1 = getPriceAtY(curY1 + dy);
                            const newTime2 = getTimeAtX(curX2 + dx);
                            const newPrice2 = getPriceAtY(curY2 + dy);

                            if (newTime1 && newPrice1 !== null && newTime2 && newPrice2 !== null) {
                                r.p1 = { time: newTime1, price: newPrice1 };
                                r.p2 = { time: newTime2, price: newPrice2 };
                                renderFib();
                            }
                        }
                        return;
                    }
                }

                if (dragMode === 1) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint1 = { time, price };
                        renderFib();
                    }
                    return;
                }
                if (dragMode === 2) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint2 = { time, price };
                        renderFib();
                    }
                    return;
                }
                if (dragMode === 3 && fibDragStartPos) {
                    const activeSeries = candleSeries || areaSeries;
                    if (!activeSeries || !chart) return;
                    let dx = x - fibDragStartPos.x;
                    const dy = y - fibDragStartPos.y;

                    const curX1 = chart.timeScale().timeToCoordinate(fibDragStartPos.origP1.time);
                    const curY1 = activeSeries.priceToCoordinate(fibDragStartPos.origP1.price);
                    const curX2 = chart.timeScale().timeToCoordinate(fibDragStartPos.origP2.time);
                    const curY2 = activeSeries.priceToCoordinate(fibDragStartPos.origP2.price);

                    if (curX1 !== null && curY1 !== null && curX2 !== null && curY2 !== null) {
                        const maxFibX = Math.max(curX1, curX2);
                        if (maxFibX + dx > maxContentX) dx = maxContentX - maxFibX;
                        const minFibX = Math.min(curX1, curX2);
                        if (minFibX + dx < 0) dx = -minFibX;

                        const newTime1 = getTimeAtX(curX1 + dx);
                        const newPrice1 = getPriceAtY(curY1 + dy);
                        const newTime2 = getTimeAtX(curX2 + dx);
                        const newPrice2 = getPriceAtY(curY2 + dy);

                        if (newTime1 && newPrice1 !== null && newTime2 && newPrice2 !== null) {
                            fibPoint1 = { time: newTime1, price: newPrice1 };
                            fibPoint2 = { time: newTime2, price: newPrice2 };
                            renderFib();
                        }
                    }
                    return;
                }

                // While in state 2: live preview as cursor/finger moves (NO HOLDING NEEDED)
                if (fibDrawState === 2) {
                    const time = getTimeAtX(clampedX);
                    const price = getPriceAtY(y);
                    if (time && price !== null) {
                        fibPoint2 = { time, price };
                        renderFib();
                    }
                }
            };

            canvas.addEventListener('pointermove', onPointerMove);
            if (chartContainer) {
                chartContainer.addEventListener('pointermove', onPointerMove);
            }

            canvas.addEventListener('pointerleave', () => {
                if (crosshairPos !== null) {
                    crosshairPos = null;
                    renderFib();
                }
                if (!isDrawingHorizontalLine && !isDrawingTrendline && !isDrawingRectangle && !isDrawingFib && !isPointerDown) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                }
            });

            const onPointerUp = (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const dist = Math.hypot(x - pointerDownPos.x, y - pointerDownPos.y);

                if (dragTrendlineIndex >= 0) {
                    dragTrendlineIndex = -1;
                    dragTrendlinePart = 0;
                    dragTrendlineStartPos = null;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    notifyTrendlinesChanged();
                    return;
                }

                if (dragHorizontalLineIndex >= 0) {
                    dragHorizontalLineIndex = -1;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    notifyHorizontalLinesChanged();
                    return;
                }

                if (dragRectangleIndex >= 0) {
                    dragRectangleIndex = -1;
                    dragRectanglePart = 0;
                    dragRectangleStartPos = null;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    notifyRectanglesChanged();
                    return;
                }

                if (dragMode > 0) {
                    dragMode = 0;
                    fibDragStartPos = null;
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                    canvas.style.cursor = 'default';
                    canvas.style.pointerEvents = 'none';
                    renderFib();
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onFibDrawn', true);
                    }
                    window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: true }), '*');
                    return;
                }

                if (isDrawingTrendline && trendlineDrawState === 2) {
                    // If user dragged and released with distance >= 20px, finalize immediately (Drag gesture fallback)
                    if (dist >= 20 && tempTrendlineP1 && tempTrendlineP2) {
                        const newLine = {
                            id: 'tl_' + Date.now(),
                            p1: tempTrendlineP1,
                            p2: tempTrendlineP2,
                            color: '#7C4DFF',
                            width: 2,
                            style: 'solid',
                            opacity: 1.0,
                            textColor: '#FFFFFF',
                            lockAngle: false
                        };
                        trendlines.push(newLine);
                        globalAngleLock = false;
                        selectedTrendlineIndex = trendlines.length - 1; // Enter edit mode upon placement
                        isDrawingTrendline = false;
                        trendlineDrawState = 0;
                        tempTrendlineP1 = null;
                        tempTrendlineP2 = null;
                        crosshairPos = null;
                        isPointerDown = false;
                        try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        showTrendlineToolbar(selectedTrendlineIndex);
                        renderFib();
                        notifyTrendlinesChanged();
                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onTrendlineAdded', newLine);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onTrendlineAdded', payload: newLine }), '*');
                        return;
                    }

                    // If it was just a tap for Anchor 1:
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    renderFib();
                    return;
                }

                if (isDrawingRectangle && rectangleDrawState === 2) {
                    // If user dragged and released with distance >= 20px, finalize immediately (Drag gesture fallback)
                    if (dist >= 20 && tempRectangleP1 && tempRectangleP2) {
                        const newRect = {
                            id: 'rect_' + Date.now(),
                            p1: tempRectangleP1,
                            p2: tempRectangleP2,
                            color: '#AB47BC',
                            width: 2,
                            style: 'solid',
                            fillColor: '#AB47BC',
                            fillOpacity: 0.2,
                            text: '',
                            textColor: '#FFFFFF',
                            textSize: 14,
                            textBold: false,
                            textItalic: false,
                            textValign: 'middle',
                            textHalign: 'center',
                            lockAspect: false,
                            isLocked: false,
                            hidden: false
                        };
                        rectangles.push(newRect);
                        selectedRectangleIndex = rectangles.length - 1; // Enter edit mode upon placement
                        selectedTrendlineIndex = -1;
                        selectedHorizontalLineIndex = -1;
                        isFibSelected = false;
                        isDrawingRectangle = false;
                        rectangleDrawState = 0;
                        tempRectangleP1 = null;
                        tempRectangleP2 = null;
                        crosshairPos = null;
                        isPointerDown = false;
                        try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        showRectangleToolbar(selectedRectangleIndex);
                        renderFib();
                        notifyRectanglesChanged();
                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onRectangleAdded', newRect);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onRectangleAdded', payload: newRect }), '*');
                        return;
                    }

                    // If it was just a tap for Corner 1:
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    renderFib();
                    return;
                }


                if (fibDrawState === 2) {
                    // If user dragged and released with distance >= 20px, finalize immediately (Drag gesture fallback)
                    if (dist >= 20 && fibPoint1 && fibPoint2 && Math.abs(fibPoint2.price - fibPoint1.price) > 0.001) {
                        fibDrawState = 0;
                        isDrawingFib = false;
                        isFibSelected = true;
                        isPointerDown = false;
                        try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                        if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
                        canvas.style.cursor = 'default';
                        canvas.style.pointerEvents = 'none';
                        showFibToolbar();
                        renderFib();

                        if (window.flutter_inappwebview?.callHandler) {
                            window.flutter_inappwebview.callHandler('onFibDrawn', true);
                        }
                        window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: true }), '*');
                        return;
                    }

                    // If it was just a tap for Anchor 1:
                    // Release pointer capture so cursor/touch movement tracks freely WITHOUT needing to hold!
                    isPointerDown = false;
                    try { canvas.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    try { chartContainer.releasePointerCapture?.(e.pointerId); } catch (_) {}
                    renderFib();
                    return;
                }
            };

            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);
            if (chartContainer) {
                chartContainer.addEventListener('pointerup', onPointerUp);
                chartContainer.addEventListener('pointercancel', onPointerUp);
            }
            initTrendlineToolbarEvents();
        }

        function renderFib() {
            const canvas = document.getElementById('fib-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const width = canvas.width / dpr;
            const height = canvas.height / dpr;

            ctx.clearRect(0, 0, width, height);

            const activeSeries = candleSeries || areaSeries;
            if (!chart || !activeSeries) return;

            // Clip all drawings strictly to Pane 0 and inside Candle Chart area (never spill into sub-panes or right price scale)
            let pane0Height = height;
            try {
                if (typeof chart.panes === 'function' && chart.panes().length > 0) {
                    const p0 = chart.panes()[0]?.getHeight();
                    if (p0 && p0 > 0) pane0Height = p0;
                }
            } catch (_) {}

            const maxContentX = getChartContentWidth();

            ctx.save();
            ctx.beginPath();
            ctx.rect(0, 0, maxContentX, pane0Height);
            ctx.clip();

            try {

            // 0. Render Crosshair Guidelines during tool drawing (like TradingView)
            if ((isDrawingHorizontalLine || (isDrawingFib && fibDrawState > 0) || (isDrawingTrendline && trendlineDrawState > 0) || (isDrawingRectangle && rectangleDrawState > 0)) && crosshairPos) {
                const hx = crosshairPos.x;
                const hy = crosshairPos.y;
                const price = getPriceAtY(hy);

                ctx.save();
                ctx.strokeStyle = isDrawingTrendline ? 'rgba(124, 77, 255, 0.85)' : (isDrawingRectangle ? 'rgba(171, 71, 188, 0.85)' : (currentCrosshairColor || 'rgba(255, 255, 255, 0.85)'));
                ctx.lineWidth = 1;
                ctx.setLineDash([6, 6]);

                // Horizontal dashed guideline
                ctx.beginPath();
                ctx.moveTo(0, hy);
                ctx.lineTo(maxContentX, hy);
                ctx.stroke();

                // Vertical dashed guideline
                if (hx <= maxContentX) {
                    ctx.beginPath();
                    ctx.moveTo(hx, 0);
                    ctx.lineTo(hx, pane0Height);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                ctx.restore();
            }

            // 1. Render Horizontal Lines (Support & Resistance)
            if (horizontalLines && horizontalLines.length > 0) {
                ctx.save();
                for (let i = 0; i < horizontalLines.length; i++) {
                    const h = horizontalLines[i];
                    if (h.hidden) continue;
                    const price = typeof h === 'object' ? h.price : h;
                    const y = activeSeries.priceToCoordinate(price);
                    if (y === null || y < 0 || y > height) continue;

                    const isSelected = (i === selectedHorizontalLineIndex);
                    const lineColor = (typeof h === 'object' && h.color) ? h.color : '#00E5FF';
                    const lineWidth = (typeof h === 'object' && h.width) ? h.width : 2;
                    const lineOpacity = (typeof h === 'object' && h.opacity !== undefined) ? h.opacity : 1.0;
                    const lineStyle = (typeof h === 'object' && h.style) ? h.style : 'solid';

                    // Calculate badge position for seamless connection
                    const badgeText = formatHorizontalLinePrice(price);
                    let badgeX = maxContentX;
                    if (badgeText) {
                        ctx.save();
                        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                        const textW = ctx.measureText(badgeText).width;
                        ctx.restore();
                        const neededW = textW + 14;
                        badgeX = Math.min(maxContentX, Math.round(width - 2 - neededW));
                    }

                    // Horizontal line stroke across chart content width (stops cleanly at badge left edge)
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = hexToRgba(lineColor, lineOpacity);
                    ctx.lineWidth = isSelected ? (lineWidth + 0.5) : lineWidth;
                    if (lineStyle === 'dashed') {
                        ctx.setLineDash([6, 4]);
                    } else if (lineStyle === 'dotted') {
                        ctx.setLineDash([2, 3]);
                    } else {
                        ctx.setLineDash([]);
                    }
                    ctx.moveTo(0, y);
                    ctx.lineTo(badgeX, y);
                    ctx.stroke();
                    ctx.restore();

                    // Render custom text label along the horizontal line if provided
                    if (typeof h === 'object' && h.text) {
                        ctx.save();
                        const fontSize = h.textSize || 14;
                        const isBold = !!h.textBold;
                        const isItalic = !!h.textItalic;
                        ctx.font = `${isItalic ? 'italic ' : ''}${isBold ? 'bold ' : '500 '}${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                        ctx.fillStyle = h.textColor || '#FFFFFF';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                        ctx.shadowBlur = 4;

                        const halign = h.textHalign || 'center';
                        let baseX = maxContentX / 2;
                        if (halign === 'left') {
                            baseX = 16;
                            ctx.textAlign = 'left';
                        } else if (halign === 'right') {
                            baseX = maxContentX - 16;
                            ctx.textAlign = 'right';
                        } else {
                            ctx.textAlign = 'center';
                        }

                        const valign = h.textValign || 'top';
                        const lines = String(h.text).split('\n');
                        const lineHeight = Math.round(fontSize * 1.3);
                        let startY = y;
                        if (valign === 'top') {
                            startY = y - 8 - ((lines.length - 1) * lineHeight);
                            ctx.textBaseline = 'bottom';
                        } else if (valign === 'bottom') {
                            startY = y + 12;
                            ctx.textBaseline = 'top';
                        } else {
                            const totalH = lines.length * lineHeight;
                            startY = y - (totalH / 2) + (lineHeight / 2);
                            ctx.textBaseline = 'middle';
                        }

                        for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
                            ctx.fillText(lines[lineIdx], baseX, startY + (lineIdx * lineHeight));
                        }
                        ctx.restore();
                    }

                    // Midpoint anchor handle when in EDIT MODE (isSelected)
                    if (isSelected) {
                        const midX = Math.round(maxContentX / 2);
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(midX, y, 8, 0, Math.PI * 2);
                        ctx.fillStyle = hexToRgba(lineColor, 0.25);
                        ctx.fill();
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(midX, y, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(midX, y, 2, 0, Math.PI * 2);
                        ctx.fillStyle = lineColor;
                        ctx.fill();
                        ctx.restore();
                    }
                }
                ctx.restore();
            }

            // 1.5 Render Trendlines
            if (trendlines && trendlines.length > 0 && chart) {
                ctx.save();
                for (let i = 0; i < trendlines.length; i++) {
                    const t = trendlines[i];
                    if (t.hidden) continue;
                    const x1 = chart.timeScale().timeToCoordinate(t.p1.time);
                    const y1 = activeSeries.priceToCoordinate(t.p1.price);
                    const x2 = chart.timeScale().timeToCoordinate(t.p2.time);
                    const y2 = activeSeries.priceToCoordinate(t.p2.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;

                    const isSelected = (i === selectedTrendlineIndex);
                    const lineColor = t.color || '#7C4DFF';
                    const lineWidth = t.width || 2;
                    const lineStyle = t.style || 'solid';
                    const lineOpacity = (t.opacity !== undefined) ? t.opacity : 1.0;

                    // Dash pattern
                    if (lineStyle === 'dashed') {
                        ctx.lineCap = 'butt';
                        ctx.setLineDash([Math.max(6, lineWidth * 3), Math.max(4, lineWidth * 2)]);
                    } else if (lineStyle === 'dotted') {
                        ctx.lineCap = 'round';
                        ctx.setLineDash([0, Math.max(6, lineWidth * 2.5)]);
                    } else {
                        ctx.lineCap = 'round';
                        ctx.setLineDash([]);
                    }

                    ctx.beginPath();
                    ctx.strokeStyle = hexToRgba(lineColor, lineOpacity);
                    ctx.lineWidth = lineWidth;
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                    ctx.setLineDash([]); // Reset dash for anchors & labels

                    // Render optional text label rotated parallel to trendline (never upside down)
                    if (t.text) {
                        ctx.save();
                        const fontSize = t.textSize || 14;
                        const isBold = !!t.textBold;
                        const isItalic = !!t.textItalic;
                        ctx.font = `${isItalic ? 'italic ' : ''}${isBold ? 'bold ' : '500 '}${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                        ctx.fillStyle = t.textColor || '#FFFFFF';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
                        ctx.shadowBlur = 4;

                        // Normalize direction: text must ALWAYS be readable left-to-right (never upside down)
                        let pStart = { x: x1, y: y1 };
                        let pEnd = { x: x2, y: y2 };

                        if (pStart.x > pEnd.x) {
                            const tmp = pStart; pStart = pEnd; pEnd = tmp;
                        } else if (pStart.x === pEnd.x) {
                            // For vertical lines, orient bottom-to-top so text reads upward (-90 deg)
                            if (pStart.y < pEnd.y) {
                                const tmp = pStart; pStart = pEnd; pEnd = tmp;
                            }
                        }

                        const dx = pEnd.x - pStart.x;
                        const dy = pEnd.y - pStart.y;
                        const len = Math.hypot(dx, dy);
                        const angle = Math.atan2(dy, dx); // Strictly within [-PI/2, PI/2]!

                        const halign = t.textHalign || 'center';
                        let distAlongLine = len / 2;
                        if (halign === 'left') {
                            distAlongLine = Math.min(24, len * 0.25);
                            ctx.textAlign = 'left';
                        } else if (halign === 'right') {
                            distAlongLine = len - Math.min(24, len * 0.25);
                            ctx.textAlign = 'right';
                        } else {
                            distAlongLine = len / 2;
                            ctx.textAlign = 'center';
                        }

                        // Anchor point on the line
                        const anchorX = pStart.x + (len > 0 ? Math.cos(angle) * distAlongLine : 0);
                        const anchorY = pStart.y + (len > 0 ? Math.sin(angle) * distAlongLine : 0);

                        // Translate and rotate canvas to line orientation
                        ctx.translate(anchorX, anchorY);
                        ctx.rotate(angle);

                        const valign = t.textValign || 'top';
                        const lines = String(t.text).split('\n');
                        const lineHeight = Math.round(fontSize * 1.25);
                        const offsetFromLine = Math.max(5, (lineWidth / 2) + 4);

                        if (valign === 'top') {
                            // Sits on top of / above the line (negative Y in local rotated space)
                            ctx.textBaseline = 'bottom';
                            for (let k = 0; k < lines.length; k++) {
                                const lineY = -offsetFromLine - ((lines.length - 1 - k) * lineHeight);
                                ctx.fillText(lines[k], 0, lineY);
                            }
                        } else if (valign === 'bottom') {
                            // Sits below the line (positive Y in local rotated space)
                            ctx.textBaseline = 'top';
                            for (let k = 0; k < lines.length; k++) {
                                const lineY = offsetFromLine + (k * lineHeight);
                                ctx.fillText(lines[k], 0, lineY);
                            }
                        } else {
                            // Middle: centered directly on the line
                            ctx.textBaseline = 'middle';
                            const totalH = (lines.length - 1) * lineHeight;
                            const startY = -(totalH / 2);
                            for (let k = 0; k < lines.length; k++) {
                                const lineY = startY + (k * lineHeight);
                                ctx.fillText(lines[k], 0, lineY);
                            }
                        }

                        ctx.restore();
                    }

                    // Render optional angle
                    if (t.showAngle) {
                        const deg = getTrendlineAngle(t);
                        ctx.save();
                        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                        ctx.fillStyle = lineColor;
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
                        ctx.shadowBlur = 3;
                        ctx.fillText(deg + '°', x2 + 10, y2);
                        ctx.restore();
                    }

                    // Only render anchor handles when in EDIT MODE (isSelected)
                    if (isSelected) {
                        // Anchor 1 handle
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x1, y1, 8, 0, Math.PI * 2);
                        ctx.fillStyle = hexToRgba(lineColor, 0.25);
                        ctx.fill();
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(x1, y1, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x1, y1, 2, 0, Math.PI * 2);
                        ctx.fillStyle = lineColor;
                        ctx.fill();
                        ctx.restore();

                        // Anchor 2 handle
                        ctx.save();
                        ctx.beginPath();
                        ctx.arc(x2, y2, 8, 0, Math.PI * 2);
                        ctx.fillStyle = hexToRgba(lineColor, 0.25);
                        ctx.fill();
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 1.5;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(x2, y2, 4, 0, Math.PI * 2);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(x2, y2, 2, 0, Math.PI * 2);
                        ctx.fillStyle = lineColor;
                        ctx.fill();
                        ctx.restore();
                    }
                }
                ctx.restore();
            }

            // 1.6 Render Trendline Live Rubber-band Preview during Anchor 2 aiming
            if (isDrawingTrendline && trendlineDrawState === 2 && tempTrendlineP1 && tempTrendlineP2 && chart) {
                const x1 = chart.timeScale().timeToCoordinate(tempTrendlineP1.time);
                const y1 = activeSeries.priceToCoordinate(tempTrendlineP1.price);
                const x2 = chart.timeScale().timeToCoordinate(tempTrendlineP2.time);
                const y2 = activeSeries.priceToCoordinate(tempTrendlineP2.price);
                if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                    ctx.save();
                    // Live rubber band line
                    ctx.beginPath();
                    ctx.strokeStyle = '#7C4DFF';
                    ctx.lineWidth = 2.0;
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();

                    // Anchor 1
                    ctx.fillStyle = '#7C4DFF';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Live cursor Anchor 2
                    ctx.fillStyle = '#7C4DFF';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // 1.7 Render Rectangles (Box Area - Supply/Demand, Consolidation)
            if (rectangles && rectangles.length > 0 && chart) {
                ctx.save();
                for (let i = 0; i < rectangles.length; i++) {
                    const r = rectangles[i];
                    if (r.hidden) continue;
                    const x1 = chart.timeScale().timeToCoordinate(r.p1.time);
                    const y1 = activeSeries.priceToCoordinate(r.p1.price);
                    const x2 = chart.timeScale().timeToCoordinate(r.p2.time);
                    const y2 = activeSeries.priceToCoordinate(r.p2.price);
                    if (x1 === null || y1 === null || x2 === null || y2 === null) continue;

                    const left = Math.min(x1, x2);
                    const right = Math.max(x1, x2);
                    const top = Math.min(y1, y2);
                    const bottom = Math.max(y1, y2);
                    const boxW = Math.max(1, right - left);
                    const boxH = Math.max(1, bottom - top);

                    const isSelected = (i === selectedRectangleIndex);

                    // Translucent fill
                    const fColor = r.fillColor || '#AB47BC';
                    const fOp = (r.fillOpacity !== undefined) ? r.fillOpacity : 0.2;
                    ctx.fillStyle = hexToRgba(fColor, fOp);
                    ctx.fillRect(left, top, boxW, boxH);

                    // Border stroke
                    ctx.beginPath();
                    ctx.strokeStyle = r.color || '#AB47BC';
                    ctx.lineWidth = r.width || 2;
                    if (r.style === 'dashed') {
                        ctx.setLineDash([6, 5]);
                    } else if (r.style === 'dotted') {
                        ctx.setLineDash([2, 3]);
                    } else {
                        ctx.setLineDash([]);
                    }
                    ctx.strokeRect(left, top, boxW, boxH);
                    ctx.setLineDash([]);

                    // Optional Text Rendering
                    if (r.text && String(r.text).trim().length > 0) {
                        ctx.save();
                        const fontSize = r.textSize || 14;
                        const fontStyle = (r.textItalic ? 'italic ' : '') + (r.textBold ? 'bold ' : '');
                        ctx.font = `${fontStyle}${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
                        ctx.fillStyle = r.textColor || '#FFFFFF';
                        ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
                        ctx.shadowBlur = 3;

                        const halign = r.textHalign || 'center';
                        let tx = (left + right) / 2;
                        if (halign === 'left') {
                            tx = left + 8;
                            ctx.textAlign = 'left';
                        } else if (halign === 'right') {
                            tx = right - 8;
                            ctx.textAlign = 'right';
                        } else {
                            ctx.textAlign = 'center';
                        }

                        const valign = r.textValign || 'middle';
                        const lines = String(r.text).split('\n');
                        const lineHeight = Math.round(fontSize * 1.25);
                        let ty = top + 8;
                        if (valign === 'bottom') {
                            ty = bottom - 8 - ((lines.length - 1) * lineHeight);
                            ctx.textBaseline = 'bottom';
                        } else if (valign === 'middle') {
                            const totalH = lines.length * lineHeight;
                            ty = ((top + bottom) / 2) - (totalH / 2) + (lineHeight / 2);
                            ctx.textBaseline = 'middle';
                        } else {
                            ty = top + 8;
                            ctx.textBaseline = 'top';
                        }

                        for (let k = 0; k < lines.length; k++) {
                            ctx.fillText(lines[k], tx, ty + (k * lineHeight));
                        }
                        ctx.restore();
                    }

                    // EDIT MODE: 4 Corner handles
                    if (isSelected) {
                        const corners = [
                            { x: left, y: top },
                            { x: right, y: top },
                            { x: right, y: bottom },
                            { x: left, y: bottom }
                        ];

                        const handleColor = r.color || '#AB47BC';
                        corners.forEach(c => {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                            ctx.fillStyle = hexToRgba(handleColor, 0.3);
                            ctx.fill();
                            ctx.strokeStyle = handleColor;
                            ctx.lineWidth = 1.5;
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(c.x, c.y, 3.5, 0, Math.PI * 2);
                            ctx.fillStyle = '#FFFFFF';
                            ctx.fill();
                            ctx.beginPath();
                            ctx.arc(c.x, c.y, 1.8, 0, Math.PI * 2);
                            ctx.fillStyle = handleColor;
                            ctx.fill();
                            ctx.restore();
                        });
                    }
                }
                ctx.restore();
            }

            // 1.8 Render Rectangle Live Rubber-band Preview during Corner 2 aiming
            if (isDrawingRectangle && rectangleDrawState === 2 && tempRectangleP1 && tempRectangleP2 && chart) {
                const x1 = chart.timeScale().timeToCoordinate(tempRectangleP1.time);
                const y1 = activeSeries.priceToCoordinate(tempRectangleP1.price);
                const x2 = chart.timeScale().timeToCoordinate(tempRectangleP2.time);
                const y2 = activeSeries.priceToCoordinate(tempRectangleP2.price);
                if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                    ctx.save();
                    const left = Math.min(x1, x2);
                    const right = Math.max(x1, x2);
                    const top = Math.min(y1, y2);
                    const bottom = Math.max(y1, y2);
                    const boxW = Math.max(1, right - left);
                    const boxH = Math.max(1, bottom - top);

                    // Fill preview
                    ctx.fillStyle = 'rgba(171, 71, 188, 0.16)';
                    ctx.fillRect(left, top, boxW, boxH);

                    // Dashed border preview
                    ctx.beginPath();
                    ctx.setLineDash([5, 4]);
                    ctx.strokeStyle = '#AB47BC';
                    ctx.lineWidth = 1.8;
                    ctx.strokeRect(left, top, boxW, boxH);
                    ctx.setLineDash([]);

                    // Corner 1 dot
                    ctx.fillStyle = '#AB47BC';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x1, y1, 3, 0, Math.PI * 2);
                    ctx.fill();

                    // Corner 2 (cursor) dot
                    ctx.fillStyle = '#AB47BC';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(x2, y2, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            // 2. Render Fibonacci Retracement
            if (currentShowFib) {
                if (isDrawingFib && fibPoint1 && fibDrawState === 2 && (!fibPoint2 || Math.abs(fibPoint2.price - fibPoint1.price) < 0.001)) {
                    // If Anchor 1 is set and waiting for Anchor 2, render Anchor 1 handle
                    const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                    const y1 = candleSeries.priceToCoordinate(fibPoint1.price);
                    if (x1 !== null && y1 !== null) {
                        ctx.fillStyle = '#FFB300';
                        ctx.beginPath();
                        ctx.arc(x1, y1, 7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#FFFFFF';
                        ctx.beginPath();
                        ctx.arc(x1, y1, 3.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                } else if (fibPoint1 && fibPoint2) {
                    const priceDiff = fibPoint1.price - fibPoint2.price;
                    if (Math.abs(priceDiff) >= 0.001) {
                        const x1 = chart.timeScale().timeToCoordinate(fibPoint1.time);
                        const y1 = candleSeries.priceToCoordinate(fibPoint1.price);
                        const x2 = chart.timeScale().timeToCoordinate(fibPoint2.time);
                        const y2 = candleSeries.priceToCoordinate(fibPoint2.price);

                        if (x1 !== null && y1 !== null && x2 !== null && y2 !== null) {
                            // In TradingView: Horizontal lines span between the X coordinates of the anchors!
                            const minX = Math.min(x1, x2);
                            const maxX = Math.max(x1, x2);
                            const lineStartX = Math.max(0, Math.min(minX, maxContentX));
                            const lineEndX = Math.min(maxContentX, Math.max(minX + 40, maxX));
                            const lineWidth = Math.max(0, lineEndX - lineStartX);

                            // Calculate Y positions for all levels
                            const levelYs = [];
                            for (let i = 0; i < FIB_LEVELS.length; i++) {
                                const item = FIB_LEVELS[i];
                                const price = fibPoint2.price + (priceDiff * item.level);
                                const y = candleSeries.priceToCoordinate(price);
                                levelYs.push({ ...item, price, y });
                            }

                            // Draw filled zones between levels (from lineStartX to lineEndX)
                            const sortedLevels = [...levelYs].sort((a, b) => b.level - a.level);
                            for (let i = 0; i < sortedLevels.length - 1; i++) {
                                const curr = sortedLevels[i];
                                const next = sortedLevels[i + 1];
                                if (curr.y !== null && next.y !== null && curr.fill !== 'transparent') {
                                    ctx.fillStyle = fibCustomColor ? hexToRgba(fibCustomColor, 0.08) : curr.fill;
                                    const topY = Math.min(curr.y, next.y);
                                    const bandHeight = Math.abs(curr.y - next.y);
                                    ctx.fillRect(lineStartX, topY, lineWidth, bandHeight);
                                }
                            }

                            // Draw level lines and TradingView-style clean text labels
                            ctx.font = '600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                            ctx.textBaseline = 'bottom';

                            for (let i = 0; i < levelYs.length; i++) {
                                const item = levelYs[i];
                                if (item.y === null || item.y < 0 || item.y > height) continue;

                                ctx.beginPath();
                                ctx.strokeStyle = fibCustomColor || item.color;
                                ctx.lineWidth = fibLineWidth || 1.0;
                                ctx.moveTo(lineStartX, item.y);
                                ctx.lineTo(lineEndX, item.y);
                                ctx.stroke();

                                const priceFormatted = item.price >= 1000
                                    ? Math.round(item.price).toLocaleString('en-US')
                                    : item.price.toFixed(2);
                                const text = `${item.label} (${priceFormatted})`;

                                ctx.fillStyle = fibCustomColor || item.color;
                                ctx.fillText(text, lineStartX + 4, item.y - 3);
                            }

                            // Handles
                            if (isFibSelected) {
                                ctx.beginPath();
                                ctx.strokeStyle = '#9E9E9E';
                                ctx.lineWidth = 1.4;
                                ctx.setLineDash([5, 4]);
                                ctx.moveTo(x1, y1);
                                ctx.lineTo(x2, y2);
                                ctx.stroke();
                                ctx.setLineDash([]);

                                const isA1Active = (dragMode === 1);
                                ctx.save();
                                ctx.beginPath();
                                ctx.arc(x1, y1, isA1Active ? 12 : 9, 0, Math.PI * 2);
                                ctx.fillStyle = isA1Active ? 'rgba(255, 179, 0, 0.45)' : 'rgba(255, 179, 0, 0.25)';
                                ctx.fill();
                                ctx.strokeStyle = '#FFB300';
                                ctx.lineWidth = isA1Active ? 2 : 1.5;
                                ctx.stroke();

                                ctx.beginPath();
                                ctx.arc(x1, y1, 4.5, 0, Math.PI * 2);
                                ctx.fillStyle = '#FFFFFF';
                                ctx.fill();
                                ctx.beginPath();
                                ctx.arc(x1, y1, 2.5, 0, Math.PI * 2);
                                ctx.fillStyle = '#FFB300';
                                ctx.fill();
                                ctx.restore();

                                const isA2Active = (dragMode === 2);
                                ctx.save();
                                ctx.beginPath();
                                ctx.arc(x2, y2, isA2Active ? 12 : 9, 0, Math.PI * 2);
                                ctx.fillStyle = isA2Active ? 'rgba(255, 179, 0, 0.45)' : 'rgba(255, 179, 0, 0.25)';
                                ctx.fill();
                                ctx.strokeStyle = '#FFB300';
                                ctx.lineWidth = isA2Active ? 2 : 1.5;
                                ctx.stroke();

                                ctx.beginPath();
                                ctx.arc(x2, y2, 4.5, 0, Math.PI * 2);
                                ctx.fillStyle = '#FFFFFF';
                                ctx.fill();
                                ctx.beginPath();
                                ctx.arc(x2, y2, 2.5, 0, Math.PI * 2);
                                ctx.fillStyle = '#FFB300';
                                ctx.fill();
                                ctx.restore();
                            } else {
                                ctx.save();
                                ctx.beginPath();
                                ctx.arc(x1, y1, 3.5, 0, Math.PI * 2);
                                ctx.fillStyle = '#FFB300';
                                ctx.fill();
                                ctx.strokeStyle = '#FFFFFF';
                                ctx.lineWidth = 1.0;
                                ctx.stroke();

                                ctx.beginPath();
                                ctx.arc(x2, y2, 3.5, 0, Math.PI * 2);
                                ctx.fillStyle = '#FFB300';
                                ctx.fill();
                                ctx.strokeStyle = '#FFFFFF';
                                ctx.lineWidth = 1.0;
                                ctx.stroke();
                                ctx.restore();
                            }
                        }
                    }
                }
            }

            } finally {
                // Restore clipping state
                ctx.restore();
            }

            // ----------------------------------------------------
            // Render Price Scale Badges (in right price scale, seamlessly connected to horizontal lines)
            // ----------------------------------------------------
            if (horizontalLines && horizontalLines.length > 0 && activeSeries) {
                for (let i = 0; i < horizontalLines.length; i++) {
                    const h = horizontalLines[i];
                    if (h.hidden) continue;
                    const price = typeof h === 'object' ? h.price : h;
                    const y = activeSeries.priceToCoordinate(price);
                    if (y === null || y < 0 || y > pane0Height) continue;

                    const lineColor = (typeof h === 'object' && h.color) ? h.color : '#00E5FF';
                    const text = formatHorizontalLinePrice(price);
                    if (!text) continue;

                    ctx.save();
                    ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                    ctx.textBaseline = 'middle';
                    const textWidth = ctx.measureText(text).width;

                    const badgeHeight = 20;
                    const badgeY = Math.round(y - (badgeHeight / 2));
                    const neededW = textWidth + 14;
                    const badgeX = Math.min(maxContentX, Math.round(width - 2 - neededW));
                    const badgeWidth = Math.round(width - 2 - badgeX);

                    // Background pill in price scale (flush with horizontal line on left, rounded on right)
                    ctx.fillStyle = lineColor;
                    ctx.beginPath();
                    if (ctx.roundRect) {
                        ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, [0, 4, 4, 0]);
                    } else {
                        ctx.rect(badgeX, badgeY, badgeWidth, badgeHeight);
                    }
                    ctx.fill();

                    // White text center-aligned in badge
                    ctx.fillStyle = '#FFFFFF';
                    ctx.textAlign = 'center';
                    const textCenterX = badgeX + (badgeWidth / 2);
                    ctx.fillText(text, textCenterX, y);
                    ctx.restore();
                }
            }

            // Render live crosshair guideline price badge on price scale if active
            if ((isDrawingHorizontalLine || (isDrawingFib && fibDrawState > 0) || (isDrawingTrendline && trendlineDrawState > 0) || (isDrawingRectangle && rectangleDrawState > 0)) && crosshairPos) {
                const hy = crosshairPos.y;
                const price = getPriceAtY(hy);
                if (price !== null && hy >= 0 && hy <= pane0Height) {
                    const text = formatHorizontalLinePrice(price);
                    if (text) {
                        ctx.save();
                        ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
                        ctx.textBaseline = 'middle';
                        const textWidth = ctx.measureText(text).width;

                        const badgeHeight = 20;
                        const badgeY = Math.round(hy - (badgeHeight / 2));
                        const neededW = textWidth + 14;
                        const badgeX = Math.min(maxContentX, Math.round(width - 2 - neededW));
                        const badgeWidth = Math.round(width - 2 - badgeX);

                        ctx.fillStyle = isDrawingTrendline ? '#7C4DFF' : (isDrawingRectangle ? '#AB47BC' : (isDrawingHorizontalLine ? '#00E5FF' : '#2962FF'));
                        ctx.beginPath();
                        if (ctx.roundRect) {
                            ctx.roundRect(badgeX, badgeY, badgeWidth, badgeHeight, [0, 4, 4, 0]);
                        } else {
                            ctx.rect(badgeX, badgeY, badgeWidth, badgeHeight);
                        }
                        ctx.fill();

                        ctx.fillStyle = '#FFFFFF';
                        ctx.textAlign = 'center';
                        const textCenterX = badgeX + (badgeWidth / 2);
                        ctx.fillText(text, textCenterX, hy);
                        ctx.restore();
                    }
                }
            }
        }

        function formatHorizontalLinePrice(price) {
            if (price === null || price === undefined || isNaN(price)) return '';
            const num = Math.round(Number(price));
            const activeSeries = candleSeries || areaSeries;
            try {
                if (activeSeries && activeSeries.priceFormatter && typeof activeSeries.priceFormatter().format === 'function') {
                    const formatted = activeSeries.priceFormatter().format(num);
                    if (formatted) return formatted;
                }
            } catch (_) {}
            return String(num);
        }

        function setFibonacci(showFib) {
            currentShowFib = Boolean(showFib);
            const canvas = document.getElementById('fib-canvas');
            if (currentShowFib) {
                if (!fibPoint1 || !fibPoint2) {
                    startFibDrawing();
                } else {
                    renderFib();
                }
            } else {
                isDrawingFib = false;
                fibDrawState = 0;
                fibPoint1 = null;
                fibPoint2 = null;
                isFibSelected = false;
                hideTrendlineToolbar();
                if (canvas) {
                    canvas.style.pointerEvents = 'none';
                    canvas.style.cursor = 'default';
                }
                renderFib();
                refreshObjectTree();
            }
        }

        function clearFibonacci() {
            setFibonacci(false);
            isFibSelected = false;
            fibCustomColor = null;
            fibLineWidth = 2;
            fibIsLocked = false;
            fibDragStartPos = null;
            hideTrendlineToolbar();
            renderFib();
            refreshObjectTree();
            if (window.flutter_inappwebview?.callHandler) {
                window.flutter_inappwebview.callHandler('onFibDeleted');
                window.flutter_inappwebview.callHandler('onFibDrawn', false);
            }
            window.parent?.postMessage(JSON.stringify({ type: 'onFibDeleted' }), '*');
            window.parent?.postMessage(JSON.stringify({ type: 'onFibDrawn', payload: false }), '*');
        }

        function resetFibonacci() {
            startFibDrawing();
        }

        function cancelFibDrawing() {
            isDrawingFib = false;
            fibDrawState = 0;
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingHorizontalLine && !isDrawingTrendline && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            if (!fibPoint1 || !fibPoint2) {
                clearFibonacci();
            } else {
                renderFib();
            }
        }

        function startFibDrawing() {
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            cancelTrendlineDrawing();
            cancelRectangleDrawing();
            isDrawingFib = true;
            currentShowFib = true;
            fibPoint1 = null;
            fibPoint2 = null;
            fibDrawState = 1; // Waiting for Anchor 1 click
            dragMode = 0;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            renderFib();
        }

        function startHorizontalLineDrawing() {
            if (isDrawingFib && (!fibPoint1 || !fibPoint2)) {
                clearFibonacci();
            }
            isDrawingFib = false;
            fibDrawState = 0;
            selectedHorizontalLineIndex = -1;
            cancelTrendlineDrawing();
            cancelRectangleDrawing();
            isDrawingHorizontalLine = true;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
        }

        function cancelHorizontalLineDrawing() {
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            crosshairPos = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingTrendline && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            renderFib();
        }

        function setHorizontalLines(linesInput) {
            const lines = typeof linesInput === 'string' ? JSON.parse(linesInput) : linesInput;
            const rawArr = Array.isArray(lines) ? lines : [];
            horizontalLines = rawArr.map(normalizeHorizontalLine).filter(Boolean);
            if (selectedHorizontalLineIndex >= horizontalLines.length) {
                selectedHorizontalLineIndex = -1;
                hideTrendlineToolbar();
            } else if (selectedHorizontalLineIndex >= 0) {
                showHorizontalLineToolbar(selectedHorizontalLineIndex);
            }
            renderFib();
        }

        function clearHorizontalLines() {
            horizontalLines = [];
            selectedHorizontalLineIndex = -1;
            isDrawingHorizontalLine = false;
            crosshairPos = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingTrendline && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            renderFib();
            notifyHorizontalLinesChanged();
        }

        function startTrendlineDrawing() {
            if (isDrawingFib && (!fibPoint1 || !fibPoint2)) {
                clearFibonacci();
            }
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            isDrawingFib = false;
            fibDrawState = 0;
            selectedTrendlineIndex = -1;
            globalAngleLock = false;
            hideTrendlineToolbar();
            cancelRectangleDrawing();
            isDrawingTrendline = true;
            trendlineDrawState = 1; // Waiting for Anchor 1 click
            tempTrendlineP1 = null;
            tempTrendlineP2 = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            renderFib();
        }

        function cancelTrendlineDrawing() {
            isDrawingTrendline = false;
            trendlineDrawState = 0;
            tempTrendlineP1 = null;
            tempTrendlineP2 = null;
            crosshairPos = null;
            selectedTrendlineIndex = -1;
            globalAngleLock = false;
            hideTrendlineToolbar();
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingHorizontalLine && !isDrawingRectangle) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
            renderFib();
        }

        function setTrendlines(linesInput) {
            const lines = typeof linesInput === 'string' ? JSON.parse(linesInput) : linesInput;
            trendlines = Array.isArray(lines) ? lines : [];
            if (selectedTrendlineIndex >= trendlines.length) {
                selectedTrendlineIndex = -1;
                hideTrendlineToolbar();
            } else if (selectedTrendlineIndex >= 0) {
                showTrendlineToolbar(selectedTrendlineIndex);
            }
            renderFib();
        }

        function clearTrendlines() {
            trendlines = [];
            selectedTrendlineIndex = -1;
            globalAngleLock = false;
            hideTrendlineToolbar();
            cancelTrendlineDrawing();
            notifyTrendlinesChanged();
        }

        function startRectangleDrawing() {
            if (isDrawingFib && (!fibPoint1 || !fibPoint2)) {
                clearFibonacci();
            }
            isDrawingHorizontalLine = false;
            selectedHorizontalLineIndex = -1;
            isDrawingFib = false;
            fibDrawState = 0;
            cancelTrendlineDrawing();
            selectedRectangleIndex = -1;
            isDrawingRectangle = true;
            rectangleDrawState = 1; // Waiting for Corner 1 click
            tempRectangleP1 = null;
            tempRectangleP2 = null;
            const canvas = document.getElementById('fib-canvas');
            if (canvas) {
                canvas.style.pointerEvents = 'auto';
                canvas.style.cursor = 'crosshair';
            }
            renderFib();
        }

        function cancelRectangleDrawing() {
            isDrawingRectangle = false;
            rectangleDrawState = 0;
            tempRectangleP1 = null;
            tempRectangleP2 = null;
            crosshairPos = null;
            selectedRectangleIndex = -1;
            hideTrendlineToolbar();
            const canvas = document.getElementById('fib-canvas');
            if (canvas && !isDrawingFib && !isDrawingHorizontalLine && !isDrawingTrendline) {
                canvas.style.pointerEvents = 'none';
                canvas.style.cursor = 'default';
            }
            if (chart) chart.applyOptions({ handleScroll: true, handleScale: true });
            renderFib();
        }

        function setRectangles(rectsInput) {
            const rects = typeof rectsInput === 'string' ? JSON.parse(rectsInput) : rectsInput;
            const rawArr = Array.isArray(rects) ? rects : [];
            rectangles = rawArr.map(normalizeRectangle).filter(Boolean);
            if (selectedRectangleIndex >= rectangles.length) {
                selectedRectangleIndex = -1;
                hideTrendlineToolbar();
            } else if (selectedRectangleIndex >= 0) {
                showRectangleToolbar(selectedRectangleIndex);
            }
            renderFib();
        }

        function clearRectangles() {
            rectangles = [];
            selectedRectangleIndex = -1;
            hideTrendlineToolbar();
            cancelRectangleDrawing();
            notifyRectanglesChanged();
        }

        function clearAllDrawings() {
            clearFibonacci();
            clearHorizontalLines();
            clearTrendlines();
            clearRectangles();
        }

        function initChart(upColor, downColor, gridColor, interactive, crosshairColor) {
            if (chart) return;
            upColor = upColor || '#21C07A';
            downColor = downColor || '#E53935';
            gridColor = gridColor || 'rgba(128, 128, 128, 0.15)';
            if (interactive === undefined || interactive === null) interactive = true;
            if (crosshairColor) currentCrosshairColor = crosshairColor;

            const container = document.getElementById('chart');
            if (!container) return;

            chart = LightweightCharts.createChart(container, {
                autoSize: true,
                layout: {
                    background: { color: 'transparent' },
                    textColor: '#9aa0a6',
                    fontSize: 11,
                    panes: {
                        enableResize: true,
                        separatorColor: 'rgba(128, 128, 128, 0.25)',
                        separatorHoverColor: '#2962FF',
                    },
                },
                grid: {
                    vertLines: { color: gridColor },
                    horzLines: { color: gridColor },
                },
                timeScale: {
                    timeVisible: true,
                    secondsVisible: false,
                    borderVisible: false,
                    rightOffset: 5,
                    barSpacing: 8,
                    minBarSpacing: 3,
                },
                rightPriceScale: {
                    borderVisible: false,
                    scaleMargins: { top: 0.08, bottom: 0.08 },
                    autoScale: true,
                    minimumWidth: 55,
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                    vertLine: {
                        visible: interactive,
                        labelVisible: interactive,
                        color: currentCrosshairColor,
                        width: 1,
                        style: LightweightCharts.LineStyle.LargeDashed,
                        labelBackgroundColor: '#2962FF',
                    },
                    horzLine: {
                        visible: interactive,
                        labelVisible: interactive,
                        color: currentCrosshairColor,
                        width: 1,
                        style: LightweightCharts.LineStyle.LargeDashed,
                        labelBackgroundColor: '#2962FF',
                    },
                },
                handleScroll: interactive ? {
                    mouseWheel: true,
                    pressedMouseMove: true,
                    horzTouchDrag: true,
                    vertTouchDrag: true,
                } : false,
                handleScale: interactive ? {
                    axisPressedMouseMove: {
                        time: true,
                        price: true,
                    },
                    axisDoubleClickReset: {
                        time: true,
                        price: true,
                    },
                    mouseWheel: true,
                    pinch: true,
                } : false,
            });

            candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
                upColor: upColor,
                downColor: downColor,
                borderVisible: false,
                wickUpColor: upColor,
                wickDownColor: downColor,
                priceFormat: { type: 'price', precision: 0, minMove: 1 },
            }, 0);

            areaSeries = chart.addSeries(LightweightCharts.AreaSeries, {
                lineColor: upColor,
                topColor: upColor + '55',
                bottomColor: upColor + '05',
                lineWidth: 2,
            }, 0);

            // Initialize SMA series in pane 0
            smaSeries = chart.addSeries(LightweightCharts.LineSeries, {
                color: '#2962FF',
                lineWidth: 2,
                title: 'SMA 20',
                visible: currentShowSma,
            }, 0);

            setSeriesType(currentType);
            updatePanes();

            chart.subscribeCrosshairMove(param => {
                if (!param.time) {
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onCrosshair', null);
                    }
                    window.parent?.postMessage(JSON.stringify({ type: 'onCrosshair', payload: null }), '*');
                    return;
                }
                const bar = param.seriesData.get(candleSeries) || param.seriesData.get(areaSeries);
                if (bar) {
                    const payloadStr = JSON.stringify({ time: param.time, ...bar });
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onCrosshair', payloadStr);
                    }
                    window.parent?.postMessage(JSON.stringify({ type: 'onCrosshair', payload: payloadStr }), '*');
                }
            });

            // Subscriptions to keep Fibonacci canvas locked with chart movements at 60fps
            chart.timeScale().subscribeVisibleTimeRangeChange(() => renderFib());
            chart.timeScale().subscribeVisibleLogicalRangeChange(() => renderFib());

            // Real-time synchronization during vertical price scale dragging, pinch zoom, & inertia
            let isUserInteractingWithChart = false;
            let priceScaleRafId = null;
            let lastKnownPriceY = null;

            function syncDrawingsOnPriceScaleChange() {
                const activeSeries = candleSeries || areaSeries;
                if (activeSeries && chart) {
                    const testPrice = (rawCandlesData && rawCandlesData.length > 0) ? rawCandlesData[0].close : 1000;
                    const curY = activeSeries.priceToCoordinate(testPrice);
                    if (curY !== null && curY !== lastKnownPriceY) {
                        lastKnownPriceY = curY;
                        renderFib();
                    }
                }
                if (isUserInteractingWithChart) {
                    priceScaleRafId = requestAnimationFrame(syncDrawingsOnPriceScaleChange);
                }
            }

            const chartWrapper = document.getElementById('chart-container');
            if (chartWrapper) {
                chartWrapper.addEventListener('pointerdown', () => {
                    isUserInteractingWithChart = true;
                    if (priceScaleRafId) cancelAnimationFrame(priceScaleRafId);
                    priceScaleRafId = requestAnimationFrame(syncDrawingsOnPriceScaleChange);
                }, { passive: true });

                chartWrapper.addEventListener('touchstart', () => {
                    isUserInteractingWithChart = true;
                    if (priceScaleRafId) cancelAnimationFrame(priceScaleRafId);
                    priceScaleRafId = requestAnimationFrame(syncDrawingsOnPriceScaleChange);
                }, { passive: true });

                chartWrapper.addEventListener('touchmove', () => {
                    renderFib();
                }, { passive: true });

                window.addEventListener('pointerup', () => {
                    isUserInteractingWithChart = false;
                    let decayFrames = 30;
                    function postReleaseSync() {
                        if (isUserInteractingWithChart) return;
                        const activeSeries = candleSeries || areaSeries;
                        if (activeSeries && chart) {
                            const testPrice = (rawCandlesData && rawCandlesData.length > 0) ? rawCandlesData[0].close : 1000;
                            const curY = activeSeries.priceToCoordinate(testPrice);
                            if (curY !== null && curY !== lastKnownPriceY) {
                                lastKnownPriceY = curY;
                                renderFib();
                            }
                        }
                        if (--decayFrames > 0) {
                            requestAnimationFrame(postReleaseSync);
                        }
                    }
                    requestAnimationFrame(postReleaseSync);
                }, { passive: true });

                window.addEventListener('touchend', () => {
                    isUserInteractingWithChart = false;
                }, { passive: true });

                chartWrapper.addEventListener('wheel', () => {
                    renderFib();
                }, { passive: true });
            }

            // Click listener for interactive tap-to-draw
            chart.subscribeClick(param => {
                if (!isDrawingFib || !param.time || !param.point) return;
                const price = candleSeries.coordinateToPrice(param.point.y);
                if (price === null) return;

                if (!fibPoint1) {
                    fibPoint1 = { time: param.time, price: price };
                    renderFib();
                } else {
                    fibPoint2 = { time: param.time, price: price };
                    isDrawingFib = false;
                    isFibSelected = true;
                    renderFib();
                    if (window.flutter_inappwebview?.callHandler) {
                        window.flutter_inappwebview.callHandler('onFibDrawn', JSON.stringify({ p1: fibPoint1, p2: fibPoint2 }));
                    }
                }
            });

            setTimeout(resizeFibCanvas, 100);
            initFibPointerEvents();

            if (pendingData) {
                const p = pendingData;
                pendingData = null;
                setDataWithIndicators(p);
            }
        }

        function setSeriesType(type) {
            currentType = type;
            if (candleSeries) candleSeries.applyOptions({ visible: type === 'candle' });
            if (areaSeries) areaSeries.applyOptions({ visible: type === 'area' });
        }

        function setCrosshairColor(color) {
            if (!color) return;
            currentCrosshairColor = color;
            if (chart) {
                chart.applyOptions({
                    crosshair: {
                        vertLine: {
                            color: color,
                            style: LightweightCharts.LineStyle.LargeDashed,
                        },
                        horzLine: {
                            color: color,
                            style: LightweightCharts.LineStyle.LargeDashed,
                        },
                    }
                });
            }
            renderFib();
        }

        function updatePanes() {
            try {
                if (!chart || !candleSeries) return;

                // Remove series that are toggled off
                if (!currentShowRsi && rsiSeries) {
                    try { chart.removeSeries(rsiSeries); } catch (_) {}
                    rsiSeries = null;
                }
                if (!currentShowVolume && volumeSeries) {
                    try { chart.removeSeries(volumeSeries); } catch (_) {}
                    volumeSeries = null;
                }

                // Determine dynamic pane indices
                let nextPaneIndex = 1;
                let targetRsiPane = null;
                let targetVolumePane = null;

                if (currentShowRsi) {
                    targetRsiPane = nextPaneIndex++;
                }
                if (currentShowVolume) {
                    targetVolumePane = nextPaneIndex++;
                }

                // Create or position RSI series
                if (currentShowRsi) {
                    if (!rsiSeries) {
                        rsiSeries = chart.addSeries(LightweightCharts.LineSeries, {
                            color: '#E91E63',
                            lineWidth: 2,
                            title: 'RSI 14',
                            priceScaleId: 'rsi-scale',
                            priceFormat: {
                                type: 'custom',
                                minMove: 0.01,
                                formatter: (p) => p.toFixed(1),
                            },
                        }, targetRsiPane);

                        rsiSeries.createPriceLine({
                            price: 70,
                            color: 'rgba(233, 30, 99, 0.4)',
                            lineWidth: 1,
                            lineStyle: LightweightCharts.LineStyle.Dashed,
                            axisLabelVisible: true,
                            title: '70',
                        });
                        rsiSeries.createPriceLine({
                            price: 30,
                            color: 'rgba(233, 30, 99, 0.4)',
                            lineWidth: 1,
                            lineStyle: LightweightCharts.LineStyle.Dashed,
                            axisLabelVisible: true,
                            title: '30',
                        });
                        rsiSeries.priceScale().applyOptions({
                            scaleMargins: { top: 0.1, bottom: 0.1 },
                        });

                        if (currentRsiData && currentRsiData.length > 0) {
